<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - cxf54188.github.io</title>
    <meta name="description" content="cxf54188 的项目列表">
    <link rel="icon" type="image/svg+xml" href="../img/yb_avatar.svg">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        :root {
            --cyan: #00f0ff;
            --cyan-dim: rgba(0, 240, 255, 0.6);
            --magenta: #ff006e;
            --purple: #7b2ff7;
            --dark: #0a0e27;
            --darker: #050510;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
        }

        body {
            min-height: 100vh;
            font-family: "JetBrains Mono", "Fira Code", "Consolas",
                         "PingFang SC", "Microsoft YaHei", monospace;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #0d1b2a 100%);
            color: var(--text);
            overflow-x: hidden;
            position: relative;
        }

        /* ========== 背景 ========== */
        .grid-bg {
            position: fixed; top:0; left:0;
            width:100%; height:100%;
            pointer-events:none; z-index:0;
            background:
                linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove {
            0%   { background-position: 0 0, 0 0; }
            100% { background-position: 60px 60px, 60px 60px; }
        }
        .scanline {
            position: fixed; top:0; left:0;
            width:100%; height:100%;
            pointer-events:none; z-index:9999;
            background: repeating-linear-gradient(
                0deg, transparent, transparent 2px,
                rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
        }
        .glow-orb {
            position: fixed; border-radius:50%;
            filter: blur(80px); pointer-events:none; z-index:0;
        }
        .glow-1 {
            width:400px; height:400px; top:-100px; left:-100px;
            background: radial-gradient(circle, rgba(0,240,255,0.08), transparent 70%);
            animation: orbFloat 8s ease-in-out infinite;
        }
        .glow-2 {
            width:350px; height:350px; bottom:-80px; right:-80px;
            background: radial-gradient(circle, rgba(123,47,247,0.08), transparent 70%);
            animation: orbFloat 10s ease-in-out infinite reverse;
        }
        @keyframes orbFloat {
            0%,100% { transform: translate(0,0); }
            50%     { transform: translate(30px,-30px); }
        }

        /* ========== 导航栏 ========== */
        .navbar {
            position: relative; z-index:10;
            display:flex; align-items:center; justify-content:space-between;
            padding: 14px 40px;
            border-bottom: 1px solid rgba(0,240,255,0.08);
            backdrop-filter: blur(10px);
            background: rgba(5,5,16,0.6);
        }
        .nav-brand {
            display:flex; align-items:center; gap:10px;
            font-size:1rem; color:var(--cyan);
            text-decoration:none; letter-spacing:1px;
        }
        .nav-brand .avatar-mini {
            width:32px; height:32px;
            border-radius:50%; border:2px solid var(--cyan);
            object-fit:cover;
        }
        .nav-links { display:flex; gap:8px; }
        .nav-links a {
            padding:8px 18px; border-radius:4px;
            font-size:0.85rem; color:var(--text-dim);
            text-decoration:none; border:1px solid transparent;
            transition: all 0.3s ease; letter-spacing:1px;
        }
        .nav-links a:hover,
        .nav-links a.active {
            color:var(--cyan);
            border-color: rgba(0,240,255,0.3);
            background: rgba(0,240,255,0.05);
        }

        /* ========== 页面标题 ========== */
        .page-header {
            position: relative; z-index:10;
            text-align:center; padding: 50px 20px 20px;
        }
        .page-header h1 {
            font-size: clamp(1.6rem, 4vw, 2.5rem);
            font-weight:700; margin-bottom:10px;
            color:#fff;
        }
        .page-header p {
            color: var(--text-dim);
            font-size:0.95rem; letter-spacing:1px;
        }

        /* ========== 项目卡片区 ========== */
        .projects-container {
            position:relative; z-index:10;
            max-width:900px; margin:0 auto;
            padding:20px 30px 60px;
        }

        .projects-grid {
            display:grid;
            grid-template-columns: 1fr;
            gap:20px;
        }

        /* ========== 项目卡片 ========== */
        .project-card {
            position:relative;
            display:block;
            background: rgba(10,10,30,0.5);
            border:1px solid rgba(0,240,255,0.1);
            border-radius:16px;
            padding:32px 28px;
            text-decoration:none; color:inherit;
            transition: all 0.35s ease;
            overflow:hidden;
            backdrop-filter:blur(6px);
        }
        .project-card::before {
            content:''; position:absolute; inset:0;
            background: radial-gradient(circle at 50% 0%, rgba(79,195,247,0.08), transparent 70%);
            opacity:0; transition: opacity 0.4s;
        }
        .project-card:hover {
            transform: translateY(-4px);
            border-color: rgba(79,195,247,0.4);
            box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 30px rgba(79,195,247,0.08);
        }
        .project-card:hover::before { opacity:1; }

        .project-num {
            font-size:0.72rem; color:var(--cyan-dim);
            letter-spacing:2px; margin-bottom:8px;
            font-family: "JetBrains Mono", monospace;
        }

        .project-card h3 {
            font-size:1.3rem; font-weight:600;
            margin-bottom:10px; color:#fff;
            display:flex; align-items:center; gap:10px;
        }
        .project-card h3 .icon { font-size:1.5em; }

        .project-card p {
            font-size:0.88rem; color:var(--text-dim);
            line-height:1.7; margin-bottom:16px;
        }

        .project-tags {
            display:flex; gap:8px; flex-wrap:wrap;
            margin-bottom:18px;
        }
        .tag {
            padding:3px 12px; border-radius:12px;
            font-size:0.72rem; letter-spacing:0.5px;
            border:1px solid rgba(255,255,255,0.1);
            color:var(--text-dim); background:rgba(255,255,255,0.02);
        }
        .tag.hot {
            color:#f43f5e; border-color:rgba(244,63,94,0.3);
            background:rgba(244,63,94,0.06);
        }
        .tag.new {
            color:#34d399; border-color:rgba(52,211,153,0.3);
            background:rgba(52,211,153,0.06);
        }

        .project-footer {
            display:flex; align-items:center; justify-content:space-between;
            padding-top:14px;
            border-top:1px solid rgba(255,255,255,0.05);
        }
        .view-link {
            font-size:0.85rem; color:var(--cyan);
            letter-spacing:1px;
        }
        .arrow {
            font-size:1.2rem; color:var(--text-dim);
            transition: transform 0.3s, color 0.3s;
        }
        .project-card:hover .arrow {
            transform: translateX(6px); color:var(--cyan);
        }

        /* ========== 底部 ========== */
        .footer {
            position:relative; z-index:10;
            text-align:center; padding:24px;
            border-top:1px solid rgba(0,240,255,0.06);
            font-size:0.78rem; color:rgba(200,200,255,0.25);
            letter-spacing:1px;
        }

        /* ========== 响应式 ========== */
        @media (max-width:640px) {
            .navbar { padding:10px 16px; }
            .nav-links a { padding:6px 12px; font-size:0.8rem; }
            .page-header { padding:30px 16px 16px; }
            .projects-container { padding:10px 16px 60px; }
            .project-card { padding:24px 18px; }
            .project-card h3 { font-size:1.1rem; }
        }
    </style>
</head>
<body>

<div class="grid-bg"></div>
<div class="glow-orb glow-1"></div>
<div class="glow-orb glow-2"></div>
<div class="scanline"></div>

<!-- 导航栏 -->
<nav class="navbar">
    <a class="nav-brand" href="../">
        <img class="avatar-mini" src="../img/avatar.png" alt="avatar">
        <span>cxf54188@github.io</span>
    </a>
    <div class="nav-links">
        <a href="../">首页</a>
        <a href="../blog/" class="active">项目</a>
        <a href="../links/">友链</a>
    </div>
</nav>

<!-- 页面标题 -->
<div class="page-header">
    <h1>我的项目列表</h1>
    <p>以下是我的项目，点击卡片查看详情</p>
</div>

<!-- 项目卡片 -->
<div class="projects-container">
    <div class="projects-grid">

        <!-- 小游戏合集 -->
        <a class="project-card" href="games/">
            <div class="project-num">PROJECT_01</div>
            <h3><span class="icon">🎮</span> 小游戏合集</h3>
            <p>8 款经典小游戏，纯前端实现，包含益智和动作两大分类。点击即玩，无需安装，支持手机和电脑。</p>
            <div class="project-tags">
                <span class="tag hot">热门</span>
                <span class="tag">HTML</span>
                <span class="tag">CSS</span>
                <span class="tag">JavaScript</span>
                <span class="tag">Canvas</span>
            </div>
            <div class="project-footer">
                <span class="view-link">进入游戏合集 →</span>
                <span class="arrow">↗</span>
            </div>
        </a>

    </div>
</div>

<!-- 底部 -->
<div class="footer">
    © 2026 cxf54188 · Powered by GitHub Pages · <span id="clock"></span>
</div>

<script>
    const clock = document.getElementById("clock");
    function tick() {
        clock.textContent = new Date().toLocaleString("zh-CN", {
            year:"numeric", month:"2-digit", day:"2-digit",
            hour:"2-digit", minute:"2-digit", second:"2-digit"
        });
    }
    tick(); setInterval(tick, 1000);
</script>

</body>
</html>
