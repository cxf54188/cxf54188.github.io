<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成就墙</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body{
  background:
    radial-gradient(1100px 620px at 22% -10%, #10203c 0%, transparent 60%),
    radial-gradient(900px 500px at 88% 8%, #1c1030 0%, transparent 62%),
    #05080f;
  color:#dbe6f5; min-height:100vh;
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  padding:44px 18px 70px; display:flex; justify-content:center;
}
.wrap{max-width:860px;width:100%;}
.top h1{font-size:34px;font-weight:800;letter-spacing:8px;
  background:linear-gradient(180deg,#fff,#7dd3fc 60%,#22d3ee);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.top .en{color:#7c8aa5;font-size:11px;letter-spacing:8px;margin:6px 0 0;}
.bar{margin:24px 0 8px;display:flex;align-items:center;gap:12px;}
.bar .track{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden;}
.bar .fill{height:100%;background:linear-gradient(90deg,#22d3ee,#a78bfa);transition:width .6s;}
.bar .num{font-size:12px;color:#fbbf24;letter-spacing:1px;}
.bar .num span{color:#7c8aa5;}
.back{display:inline-block;margin:18px 0 6px;color:#7c8aa5;text-decoration:none;font-size:12.5px;
  border:1px solid rgba(255,255,255,.08);padding:7px 15px;border-radius:10px;}
.back:hover{color:#22d3ee;border-color:rgba(34,211,238,.5);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:16px;}
.item{
  background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);
  border-radius:16px;padding:15px 16px;display:flex;gap:12px;align-items:flex-start;
  transition:.2s;
}
.item.on{border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.07);}
.item .icon{
  width:38px;height:38px;border-radius:11px;flex:0 0 auto;
  background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;
  font-size:19px;filter:grayscale(1);opacity:.35;
}
.item.on .icon{filter:none;opacity:1;background:rgba(251,191,36,.14);}
.item .nm{font-size:14px;font-weight:600;color:#5c6b83;}
.item.on .nm{color:#e8f2ff;}
.item .ds{font-size:11.5px;color:#4d5a70;margin-top:3px;line-height:1.6;}
.item.on .ds{color:#9fb0c9;}
.item .dt{font-size:10px;color:#fbbf24;margin-top:6px;letter-spacing:.5px;}
.tip{margin-top:26px;color:#4d5a70;font-size:11.5px;line-height:1.9;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>成就墙</h1>
    <div class="en">ACHIEVEMENTS</div>
  </div>

  <div class="bar">
    <div class="track"><div class="fill" id="fill" style="width:0%"></div></div>
    <div class="num" id="num">0 <span>/ 0</span></div>
  </div>

  <a class="back" href="javascript:history.back()">← 返回</a>

  <div class="grid" id="grid"></div>

  <p class="tip">成就记录保存在你自己的浏览器本地（localStorage），换设备或清缓存会重置。<br>每个成就只会在第一次达成时弹出提示，不会重复触发。</p>
</div>

<script>
(function () {
  var ACH = (window.fxAchList) || {};
  var ICON = {
    first_visit: '👋', night_owl: '🦉', konami: '🎮', wanderer: '🧭',
    clicker: '⚡', daily: '📖', gamer: '🕹️'
  };
  var got = {};
  try { got = JSON.parse(localStorage.getItem('fx_ach_v1') || '{}'); } catch (e) {}

  var ids = Object.keys(ACH);
  var grid = document.getElementById('grid');
  var done = 0;

  ids.forEach(function (id) {
    var t = got[id];
    if (t) done++;
    var d = t ? new Date(t) : null;
    var dateStr = d ? (d.getFullYear() + '.' + (d.getMonth() + 1) + '.' + d.getDate()) : '';
    var el = document.createElement('div');
    el.className = 'item' + (t ? ' on' : '');
    el.innerHTML =
      '<div class="icon">' + (ICON[id] || '★') + '</div>' +
      '<div><div class="nm">' + ACH[id].name + '</div>' +
      '<div class="ds">' + ACH[id].desc + '</div>' +
      (dateStr ? '<div class="dt">' + dateStr + ' 达成</div>' : '') +
      '</div>';
    grid.appendChild(el);
  });

  var total = ids.length;
  document.getElementById('num').innerHTML = done + ' <span>/ ' + total + '</span>';
  document.getElementById('fill').style.width = (total ? (done / total * 100) : 0) + '%';
})();
</script>
<script src="/blog/assets/fx.js"></script>
</body>
</html>
