<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>游戏大厅</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
:root{
  --bg:#05060d; --txt:#eaf6ff; --dim:#7d9bb8; --line:rgba(120,190,255,.18);
  --cyan:#57e8ff; --pink:#ff5fa8; --gold:#ffd25a; --violet:#a37bff;
}
body{
  background:
    radial-gradient(1000px 560px at 18% -12%, rgba(29,111,242,.20) 0%, transparent 60%),
    radial-gradient(900px 500px at 88% 6%, rgba(163,123,255,.16) 0%, transparent 62%),
    var(--bg);
  color:var(--txt);
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  min-height:100vh; display:flex; justify-content:center;
  padding:44px 18px 70px;
  -webkit-font-smoothing:antialiased;
  isolation:isolate;              /* 保证 fx.js 的粒子背景能透出来 */
}
.wrap{max-width:1120px;width:100%;}

header{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:10px;}
h1{font-size:40px;font-weight:900;letter-spacing:8px;line-height:1;
  background:linear-gradient(100deg,#fff 10%,var(--cyan) 42%,var(--pink) 75%,var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(87,232,255,.3));}
.brand .en{color:var(--dim);font-size:11px;letter-spacing:9px;margin-top:8px;}
nav{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;}
nav a{color:var(--dim);text-decoration:none;font-size:12.5px;
  border:1px solid var(--line);padding:8px 15px;border-radius:10px;
  background:rgba(255,255,255,.03);transition:.18s;}
nav a:hover{color:#fff;border-color:var(--cyan);background:rgba(87,232,255,.08);}

.lead{color:#9db4cd;font-size:13px;letter-spacing:1px;margin:18px 0 6px;}
.count{font-size:11px;letter-spacing:2px;color:var(--gold);margin-bottom:24px;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:16px;}
.card{
  --c:var(--cyan);
  position:relative;overflow:hidden;
  background:rgba(12,16,32,.72);border:1px solid var(--line);
  border-radius:20px;padding:20px 20px 18px;
  display:flex;flex-direction:column;min-height:262px;
  text-decoration:none;color:var(--txt);transition:.2s;
  backdrop-filter:blur(8px);
}
.card .glow{position:absolute;right:-46px;top:-46px;width:160px;height:160px;
  border-radius:50%;background:var(--c);filter:blur(55px);opacity:.16;transition:.3s;pointer-events:none;}
.card:hover{transform:translateY(-4px);border-color:var(--c);
  background:rgba(255,255,255,.055);box-shadow:0 18px 46px rgba(0,0,0,.55);}
.card:hover .glow{opacity:.42;}

.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
.idx{font-size:10.5px;letter-spacing:3px;color:var(--c);font-weight:800;}
.tag{font-size:10px;letter-spacing:1px;color:var(--dim);
  border:1px solid var(--line);border-radius:6px;padding:2px 8px;}

.card .cn{font-size:26px;font-weight:900;letter-spacing:3px;line-height:1.25;}
.card .en{font-size:10.5px;color:var(--dim);letter-spacing:4px;margin:6px 0 14px;}
.card .desc{font-size:12.5px;line-height:1.8;color:#a9c0d8;margin-top:auto;}
.card .keys{margin-top:14px;display:flex;gap:5px;flex-wrap:wrap;}
.card .keys span{font-size:10px;color:var(--dim);border:1px solid var(--line);
  border-radius:6px;padding:3px 7px;}
.card .play{margin-top:16px;align-self:flex-start;font-size:12.5px;letter-spacing:2px;
  font-weight:700;color:var(--c);border:1px solid var(--c);
  background:rgba(255,255,255,.03);padding:7px 16px;border-radius:10px;transition:.2s;}
.card:hover .play{background:var(--c);color:#04101c;}

.foot{margin-top:34px;color:#5f7894;font-size:11.5px;letter-spacing:1px;text-align:center;line-height:2;}
@media(max-width:560px){
  body{padding:28px 14px 50px;}
  h1{font-size:30px;letter-spacing:5px;}
  nav{margin-left:0;}
  .card{min-height:auto;}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <h1>游戏大厅</h1>
      <div class="en">G A M E &nbsp; L O U N G E</div>
    </div>
    <nav>
      <a href="/">← 返回主页</a>
      <a href="/blog/achievements/">🏆 成就墙</a>
    </nav>
  </header>

  <p class="lead">单人游玩，点开即玩，无需下载。成绩保存在各自游戏内的本机浏览器。</p>
  <div class="count" id="count"></div>

  <div class="grid" id="grid"></div>

  <p class="foot">以后加游戏，只改下面 GAMES 数组里的一行即可 · 卡片编号自动重排<br>方向键 / 鼠标 / 空格为主要操作，具体看每张卡片下方标签</p>
</div>

<script>
/* ============================================================
   游戏清单：以后增删游戏只改这个数组
   FLAT = true  → blog/games/<id>.html        （平铺，推荐）
   FLAT = false → blog/games/<id>/index.html  （每个游戏一个文件夹）
   ============================================================ */
const FLAT = true;

const GAMES = [
  {
    id:'qq-speed', cn:'飞车 3D', en:'QQ SPEED', type:'竞速', color:'#ff8a00',
    desc:'浏览器里的 3D 竞速，还原 11 城、情迷爱琴海、法老金字塔、雪地大冒险。漂移集气、小喷双喷、氮气与道具赛一并搬了进来。',
    keys:['方向键','漂移','氮气','道具']
  },
  {
    id:'chainburst', cn:'链爆', en:'CHAINBURST', type:'切割', color:'#57e8ff',
    desc:'直接挥动鼠标划过光球即可点燃，同色的一串顺着电弧整条炸开。60 秒冲分，链越长倍率越离谱。',
    keys:['鼠标划过','空格脉冲','避开暗球']
  },
  {
    id:'loopburst', cn:'圈爆', en:'LOOPBURST', type:'圈选', color:'#ff5fa8',
    desc:'按住拖出一个圈再松手，圈里数量最多的那种颜色整串连爆。圈越紧分越狠，画太大直接失效。',
    keys:['拖动画圈','松手连爆','空格脉冲']
  },
  {
    id:'gravitypen', cn:'引力笔', en:'GRAVITY PEN', type:'引力', color:'#a37bff',
    desc:'光核引擎永远全开、无法刹车，你手里只有一个引力点——把轨道提前弯过去。能量一直在漏，停下来就是死。',
    keys:['鼠标引力','左键急转','右键斥力','空格脉冲']
  },
  {
    id:'bubblesweep', cn:'气泡收网', en:'BUBBLE SWEEP', type:'收网', color:'#6fe3ff',
    desc:'在任意位置按住充气，气泡中央实时显示本网预计得分，见好就收。收满 12 网自动出成绩卡。',
    keys:['按住充气','松手收网','空格中央']
  },
  {
    id:'ghostwave', cn:'幽灵波', en:'GHOST WAVE', type:'描线', color:'#8fb8ff',
    desc:'屏幕上只给你几个发光采样点，隐藏波形全程不出现——靠脑子把它补成一条线。8 段波形约 60 秒。',
    keys:['从左到右画波','空格显影','仅 3 次']
  },
  {
    id:'mirror', cn:'反手', en:'MIRROR // SHIFT', type:'镜像', color:'#c084fc',
    desc:'鼠标不再直达屏幕。半透明十字是真身，发光圆环才是「你的手」，正位 / 左右反 / 上下反 / 全反转随机突变。',
    keys:['鼠标镜像','左键聚焦','空格脉冲']
  },
  {
    id:'echostorm', cn:'回声风暴', en:'ECHO STORM', type:'点击', color:'#ffd25a',
    desc:'每次命中都会在原地埋下一枚回声，1.5 秒后炸开收走周围整片光点。往人堆里打，一发能换七八次命中。',
    keys:['点击光点','空格狂热','重练这套']
  },
  {
    id:'cascade', cn:'链爆·级联', en:'CASCADE', type:'连锁', color:'#ffb547',
    desc:'点一颗能量核，光束顺着棋盘一层层炸开，最多 7 浪。点火瞬间卡准共振环，整条链再翻一截。',
    keys:['悬停预览','点击点火','空格共振']
  },
  {
    id:'graze', cn:'掠影', en:'GRAZE', type:'擦弹', color:'#6dffb0',
    desc:'机身跟着鼠标飞，你没有武器。分数不来自打爆什么，而来自离弹丸多近——擦身而过就算 GRAZE，越险分越狠。',
    keys:['鼠标贴弹','空格脉冲','避开暗球']
  }
];

const urlOf = g => FLAT
  ? '../games/' + g.id + '.html'
  : '../games/' + g.id + '/index.html';

document.getElementById('count').textContent =
  '共 ' + GAMES.length + ' 款 · 全部可直接在浏览器里玩';

document.getElementById('grid').innerHTML = GAMES.map(function (g, i) {
  const no = 'NO.' + String(i + 1).padStart(2, '0');
  const keys = g.keys.map(function (k) { return '<span>' + k + '</span>'; }).join('');
  return ''
    + '<a class="card" href="' + urlOf(g) + '" style="--c:' + g.color + '">'
    +   '<div class="glow"></div>'
    +   '<div class="row"><span class="idx">' + no + '</span><span class="tag">' + g.type + '</span></div>'
    +   '<div class="cn">' + g.cn + '</div>'
    +   '<div class="en">' + g.en + '</div>'
    +   '<div class="desc">' + g.desc + '</div>'
    +   '<div class="keys">' + keys + '</div>'
    +   '<div class="play">开始游玩 →</div>'
    + '</a>';
}).join('');
</script>
<script src="/blog/assets/fx.js"></script>
</body>
</html>
