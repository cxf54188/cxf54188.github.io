<!DOCTYPE html>
<html lang="zh-C-N">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>中国象棋</title>
<link rel="stylesheet" href="_common.css">
<style>
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:8px}
#board{display:grid;grid-template-columns:repeat(9,44px);grid-template-rows:repeat(10,44px);gap:0;padding:6px;background:#dcb35c;border-radius:8px;position:relative}
.sq{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;cursor:pointer;user-select:none;position:relative}
.sq.r{color:#e53e3e}.sq.b{color:#1a1a1a}
.sq.sel{background:rgba(79,195,247,.3)}
.sq.valid{box-shadow:inset 0 0 0 2px #34d399}
.hud{display:flex;gap:16px;margin:8px 0;font-size:14px;color:#94a3b8}
.hud b{color:#4fc3f7}
.btn{display:inline-block;padding:8px 20px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#f43f5e,#dc2626);color:#fff;font-family:inherit}
.btn:hover{transform:scale(1.05)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.overlay h2{font-size:22px;margin-bottom:10px;color:#a78bfa}
.overlay p{color:#cbd5e1;font-size:13px;line-height:1.8;max-width:380px}
</style>
</head>
<body>
<a class="back-link" href="index.html">← 返回主页</a>
<div id="topbar"></div>
<h1 style="font-size:22px;margin:6px 0">🐴 中国象棋</h1>
<div class="hud"><span>状态：<b id="st">你（红）先手</b></span></div>
<div id="board"></div>
<button class="btn" id="restart" style="margin-top:10px">重新开始</button>

<script src="_common.js"></script>
<script>
const topbar=document.getElementById('topbar');topbar.innerHTML=makeTopbar();
let board,cur,sel,valid,over;

function reset(){
  board=[
    ['bR','bN','bB','bA','bK','bA','bB','bN','bR'],
    Array(9).fill(null),
    [null,'bC',null,'bP',null,'bP',null,'bC',null],
    ['bP',null,'bP',null,'bP',null,'bP',null,'bP'],
    Array(9).fill(null),
    Array(9).fill(null),
    ['rP',null,'rP',null,'rP',null,'rP',null,'rP'],
    [null,'rC',null,'rP',null,'rP',null,'rC',null],
    Array(9).fill(null),
    ['rR','rN','rB','rA','rK','rA','rB','rN','rR']
  ];
  cur='r';over=false;sel=null;valid=[];render();
}

function inB(r,c){return r>=0&&r<10&&c>=0&&c<9;}

function movesFor(r,c){
  const p=board[r][c];if(!p)return[];
  const color=p[0];const type=p[1];const opp=color==='r'?'b':'r';
  const res=[];
  function canCap(nr,nc){return inB(nr,nc)&&(!board[nr][nc]||board[nr][nc][0]===opp);}
  function empty(nr,nc){return inB(nr,nc)&&!board[nr][nc];}
  function slide(dr,dc){
    let nr=r+dr,nc=c+dc;
    while(empty(nr,nc)){res.push([nr,nc]);nr+=dr;nc+=dc;}
    if(canCap(nr,nc))res.push([nr,nc]);
  }
  switch(type){
    case'K':{
      const palaceR=color==='r'?[7,8,9]:[0,1,2];
      const palaceC=[3,4,5];
      for(const[dr,dc]of[[1,0],[-1,0],[0,1],[0,-1]]){
        const nr=r+dr,nc=c+dc;
        if(palaceR.includes(nr)&&palaceC.includes(nc)&&canCap(nr,nc))res.push([nr,nc]);
      }
      break;
    }
    case'A':{
      const palaceR=color==='r'?[7,8,9]:[0,1,2];
      const palaceC=[3,4,5];
      for(const[dr,dc]of[[1,1],[1,-1],[-1,1],[-1,-1]]){
        const nr=r+dr,nc=c+dc;
        if(palaceR.includes(nr)&&palaceC.includes(nc)&&canCap(nr,nc))res.push([nr,nc]);
      }
      break;
    }
    case'B':{
      for(const[dr,dc]of[[2,2],[2,-2],[-2,2],[-2,-2]]){
        const nr=r+dr,nc=c+dc;
        const br=(r+nr)/2,bc=(c+nc)/2;
        if(inB(nr,nc)&&!board[br][bc]&&canCap(nr,nc)){
          if(color==='r'&&nr>=5)continue;
          if(color==='b'&&nr<=4)continue;
          res.push([nr,nc]);
        }
      }
      break;
    }
    case'N':{
      for(const[mr,mc]of[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]]){
        const nr=r+mr,nc=c+mc;
        const br=r+(mr/2|0),bc=c+(mc/2|0);
        if(inB(nr,nc)&&!board[br][bc]&&canCap(nr,nc))res.push([nr,nc]);
      }
      break;
    }
    case'R':{
      for(const[d1,d2]of[[1,0],[-1,0],[0,1],[0,-1]])slide(d1,d2);
      break;
    }
    case'C':{
      for(const[d1,d2]of[[1,0],[-1,0],[0,1],[0,-1]]){
        let nr=r+d1,nc=c+d2;let jumped=false;
        while(inB(nr,nc)&&!board[nr][nc]){if(!jumped){nr+=d1;nc+=d2;}else{nr+=d1;nc+=d2;}}
        if(inB(nr,nc)&&board[nr][nc]&&jumped&&board[nr][nc][0]===opp)res.push([nr,nc]);
      }
      break;
    }
    case'P':{
      const dir=color==='r'?-1:1;
      const river=color==='r'?r<=4:r>=5;
      if(empty(r+dir,c))res.push([r+dir,c]);
      if(river){
        if(empty(r,c-1))res.push([r,c-1]);
        if(empty(r,c+1))res.push([r,c+1]);
      }
      if(canCap(r+dir,c))res.push([r+dir,c]);
      break;
    }
  }
  return res;
}

function click(r,c){
  if(over||cur!=='r')return;
  if(sel){
    if(valid.some(([a,b])=>a===r&&b===c){move(sel.r,sel.c,r,c);return;}
    if(board[r][c]&&board[r][c][0]==='r'){sel={r,c};valid=movesFor(r,c);render();return;}
    sel=null;valid=[];render();return;
  }
  if(board[r][c]&&board[r][c][0]==='r'){sel={r,c};valid=movesFor(r,c);render();}
}

function move(fr,fc,tr,tc){
  const p=board[fr][fc];
  board[fr][fc]=null;
  board[tr][tc]=p;
  sel=null;valid=[];
  if(board[tr][tc]&&board[tr][tc][1]==='K'){
    over=true;
    document.getElementById('st').textContent='🎉 你赢了！';
    render();return;
  }
  cur='b';render();setTimeout(ai,500);
}

function ai(){
  if(over)return;
  const all=[];
  for(let r=0;r<10;r++)for(let c=0;c<9;c++){
    if(board[r][c]&&board[r][c][0]==='b'){
      const m=movesFor(r,c);
      m.forEach(x=>all.push({fr:r,fc:c,tr:x[0],tc:x[1]}));
    }
  }
  if(!all.length){over=true;document.getElementById('st').textContent='🎉 你赢了！';render();return;}
  // 优先吃子
  const caps=all.filter(m=>board[m.tr][m.tc]!=='');
  const pick=caps.length>0&&Math.random()<0.6?caps[Math.floor(Math.random()*caps.length)]:all[Math.floor(Math.random()*all.length)];
  const p=board[pick.fr][pick.fc];
  board[pick.fr][pick.fc]=null;
  board[pick.tr][pick.tc]=p;
  if(p&&p[1]==='K'){over=true;document.getElementById('st').textContent='💀 AI 赢了';render();return;}
  cur='r';render();
}

function render(){
  const b=document.getElementById('board');b.innerHTML='';
  for(let r=0;r<10;r++)for(let c=0;c<9;c++){
    const d=document.createElement('div');
    d.className='sq'+(sel&&sel.r===r&&sel.c===c?' sel':'')+(valid.some(([a,b])=>a===r&&b===c)?' valid':'');
    if(board[r][c]){
      d.classList.add(board[r][c][0]==='r'?'r':'b');
      const glyph=board[r][c][1];
      const map={K:'帅',A:'仕',B:'相',N:'马',R:'车',C:'炮',P:'兵'};
      d.textContent=map[glyph]||glyph;
    }
    d.onclick=()=>click(r,c);b.appendChild(d);
  }
  document.getElementById('st').textContent=over?'结束':(cur==='r'?'你的回合（红）':'AI 思考中…');
}

document.getElementById('restart').onclick=reset;
reset();
</script>
</body></html>
