<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🔢 2048</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0c29;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:system-ui,sans-serif;overflow:hidden}
#wrap{position:relative;width:360px;max-width:96vw}
#bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:rgba(0,0,0,.6);border-radius:14px 14px 0 0;color:#fff;font-size:13px}
#bar img{width:24px;height:24px;border-radius:50%;object-fit:cover}
#bar .sep{opacity:.5;margin:0 2px}
#info{display:flex;justify-content:space-between;padding:8px 14px;color:#fff;font-size:15px;font-weight:700;background:rgba(0,0,0,.4)}
/* board = 外框 */
#board{position:relative;width:100%;aspect-ratio:1;padding:12px;background:#2a2a4a;border-radius:0 0 14px 14px;overflow:hidden}
/* 背景格子的容器 —— 用 grid 自动对齐 */
.grid-bg{position:absolute;left:12px;right:12px;top:12px;bottom:12px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:10px}
.grid-cell{background:rgba(255,255,255,.07);border-radius:6px}
/* tiles 容器 —— 和 grid-bg 完全相同的尺寸和 gap */
.tiles{position:absolute;left:12px;right:12px;top:12px;bottom:12px}
.tile{position:absolute;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;will-change:transform;transition:transform .12s cubic-bezier(.2,.8,.2,1),background .2s;z-index:2}
.tile.appear{animation:appear .18s ease-out}
@keyframes appear{0%{transform:translate(var(--tx),var(--ty)) scale(0)}60%{transform:translate(var(--tx),var(--ty)) scale(1.08)}100%{transform:translate(var(--tx),var(--ty)) scale(1)}}
.tile.merged{animation:merged .18s ease-out}
@keyframes merged{0%{transform:translate(var(--tx),var(--ty)) scale(1)}50%{transform:translate(var(--tx),var(--ty)) scale(1.2)}100%{transform:translate(var(--tx),var(--ty)) scale(1)}}
#overlay{position:absolute;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);border-radius:14px;color:#fff;text-align:center;padding:20px}
#overlay h1{font-size:26px;margin-bottom:6px}
#overlay p{font-size:13px;opacity:.8;max-width:280px;line-height:1.5}
#btn{margin-top:16px;padding:12px 44px;font-size:18px;font-weight:700;border:none;border-radius:999px;cursor:pointer;background:linear-gradient(135deg,#f0932b,#eb4d4b);color:#fff;box-shadow:0 6px 24px rgba(235,77,75,.4)}
#btn:active{transform:scale(.95)}
</style>
</head>
<body>
<div id="wrap">
<div id="bar">
  <img src="https://cdn.luogu.com.cn/upload/image_hosting/v70j6st4.png" alt="cxf" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2216%22 fill=%22%236a5acd%22/%3E%3Ctext x=%2216%22 y=%2222%22 text-anchor=%22middle%22 font-size=%2218%22 fill=%22%23fff%22%3Ec%3C/text%3E%3C/svg%3E'">
  <span>作者：cxf54188</span><span class="sep">|</span>
  <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2322c55e' stroke='%2316a34a' stroke-width='2'/%3E%3Cpath d='M20 35 Q32 42 46 33' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='24' r='3.5' fill='%23fff'/%3E%3Ccircle cx='42' cy='24' r='3.5' fill='%23fff'/%3E%3Ccircle cx='22' cy='24' r='1.5' fill='%2316a34a'/%3E%3Ccircle cx='42' cy='24' r='1.5' fill='%2316a34a'/%3E%3C/svg%3E" alt="YB" style="background:#22c55e;">
  <span>辅助：元宝AI</span>
</div>
<div id="info"><span>🔢 2048</span><span id="score">分数: 0</span><span id="best">最佳: 0</span></div>
<div id="board">
  <div class="grid-bg">
    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
    <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
  </div>
  <div class="tiles" id="tiles"></div>
</div>
<div id="overlay">
  <h1>🔢 2048</h1>
  <p>方向键 / 滑动操作<br>合并相同数字，目标 2048！</p>
  <button id="btn">开始游戏</button>
</div>
</div>
<script>
(function(){
  'use strict';
  const SIZE = 4;
  const GAP = 10;          // 必须和 CSS .grid-bg 的 gap 一致
  const PAD = 12;          // 必须和 CSS #board 的 padding 一致
  const tilesEl = document.getElementById('tiles');
  const boardEl  = document.getElementById('board');
  const scoreEl  = document.getElementById('score');
  const bestEl   = document.getElementById('best');
  const ov       = document.getElementById('overlay');
  const btn      = document.getElementById('btn');

  const COLORS = {
    2:'#eee4da', 4:'#ede0c8', 8:'#f2b179', 16:'#f59563',
    32:'#f67c5f', 64:'#f65e3b', 128:'#edcf72', 256:'#edcc61',
    512:'#edc850', 1024:'#edc53f', 2048:'#edc22e', 4096:'#3c3a32', 8192:'#3c3a32'
  };
  const TEXT_COLORS = { 2:'#776e65', 4:'#776e65' };

  let grid, score, best, running;
  best = +(localStorage.getItem('2048_best') || 0);
  bestEl.textContent = '最佳: ' + best;

  // 关键：根据 board 实际像素尺寸计算 cell 大小
  // board 是正方形，padding 12px，内部 (boardW - 24)px 被 4 列 + 3 个 gap 平分
  function cellSize(){
    const boardW = boardEl.clientWidth;   // == boardEl.clientHeight
    return (boardW - PAD*2 - GAP*3) / 4;
  }

  // 第 c 列 / 第 r 行 的起始偏移（相对于 .tiles 容器左上角）
  function cellX(c){ return c * (cellSize() + GAP); }
  function cellY(r){ return r * (cellSize() + GAP); }

  function reset(){
    grid = Array.from({length:SIZE}, () => Array(SIZE).fill(0));
    score = 0;
    scoreEl.textContent = '分数: 0';
    addRandom(); addRandom();
    render(true);
  }

  function addRandom(){
    const empty = [];
    for(let r=0;r<SIZE;r++)
      for(let c=0;c<SIZE;c++)
        if(!grid[r][c]) empty.push([r,c]);
    if(!empty.length) return;
    const [r,c] = empty[Math.floor(Math.random()*empty.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  // 用 DOM 复用 + transform 实现滑动动画
  // 每个 tile 用 id="t_r_c" 标识它在 grid 中的逻辑位置
  function tileId(r,c){ return 't_'+r+'_'+c; }

  function render(initial){
    const s = cellSize();
    // 先收集当前 grid 的所有 (r,c,v)
    const present = {};
    for(let r=0;r<SIZE;r++)
      for(let c=0;c<SIZE;c++)
        if(grid[r][c]) present[tileId(r,c)] = {r,c,v:grid[r][c]};

    // 移除已经不在 grid 中的旧 tile
    const existing = tilesEl.querySelectorAll('.tile');
    existing.forEach(el => {
      if(!present[el.id]){
        el.style.transition = 'transform .12s, opacity .12s';
        el.style.opacity = '0';
        setTimeout(()=>el.remove(), 130);
      }
    });

    // 更新/创建
    for(const id in present){
      const {r,c,v} = present[id];
      let el = document.getElementById(id);
      const x = cellX(c), y = cellY(r);
      if(!el){
        el = document.createElement('div');
        el.id = id;
        el.className = 'tile' + (initial ? ' appear' : '');
        el.textContent = v;
        // 初始位置 + 尺寸
        el.style.width  = s + 'px';
        el.style.height = s + 'px';
        el.style.fontSize = (v>=8192?'18px':v>=1024?'22px':v>=128?'24px':'28px');
        el.style.background = COLORS[v] || '#3c3a32';
        el.style.color = TEXT_COLORS[v] || '#fff';
        // 用 CSS 变量配合 keyframes 做入场
        el.style.setProperty('--tx', x+'px');
        el.style.setProperty('--ty', y+'px');
        el.style.transform = 'translate('+x+'px,'+y+'px)';
        tilesEl.appendChild(el);
      } else {
        // 已有 → 滑动到新位置
        el.style.width  = s + 'px';
        el.style.height = s + 'px';
        el.style.fontSize = (v>=8192?'18px':v>=1024?'22px':v>=128?'24px':'28px');
        el.style.background = COLORS[v] || '#3c3a32';
        el.style.color = TEXT_COLORS[v] || '#fff';
        el.style.transform = 'translate('+x+'px,'+y+'px)';
        // 如果是合并产生的新值，加 merged 动画
        if(el.textContent !== String(v)){
          el.textContent = v;
          el.classList.remove('merged');
          // 强制 reflow 以重启动画
          void el.offsetWidth;
          el.classList.add('merged');
        }
      }
    }
  }

  // dir: 0=up, 1=right, 2=down, 3=left
  function move(dir){
    let moved = false;
    const newGrid = Array.from({length:SIZE}, () => Array(SIZE).fill(0));

    for(let i=0;i<SIZE;i++){
      const line = [];
      for(let j=0;j<SIZE;j++){
        let v;
        if(dir===0)       v = grid[j][i];
        else if(dir===1)  v = grid[i][SIZE-1-j];
        else if(dir===2)  v = grid[SIZE-1-j][i];
        else              v = grid[i][j];
        if(v) line.push(v);
      }
      const merged = [];
      for(let k=0;k<line.length;k++){
        if(k < line.length-1 && line[k] === line[k+1]){
          merged.push(line[k]*2);
          score += line[k]*2;
          k++;
          moved = true;
        } else {
          merged.push(line[k]);
        }
      }
      while(merged.length < SIZE) merged.push(0);
      for(let j=0;j<SIZE;j++){
        const v = merged[j];
        let r, c;
        if(dir===0)      { r=j;       c=i; }
        else if(dir===1) { r=i;       c=SIZE-1-j; }
        else if(dir===2) { r=SIZE-1-j; c=i; }
        else             { r=i;       c=j; }
        newGrid[r][c] = v;
        if(v !== 0 && v !== grid[r][c]) moved = true;
      }
    }

    if(moved){
      grid = newGrid;
      addRandom();
      scoreEl.textContent = '分数: ' + score;
      if(score > best){
        best = score;
        localStorage.setItem('2048_best', best);
        bestEl.textContent = '最佳: ' + best;
      }
      render(false);
      if(!canMove()) gameOver();
    }
  }

  function canMove(){
    for(let r=0;r<SIZE;r++)
      for(let c=0;c<SIZE;c++){
        if(!grid[r][c]) return true;
        if(c<SIZE-1 && grid[r][c]===grid[r][c+1]) return true;
        if(r<SIZE-1 && grid[r][c]===grid[r+1][c]) return true;
      }
    return false;
  }

  function gameOver(){
    running = false;
    ov.style.display = 'flex';
    ov.innerHTML = '<h1>💥 游戏结束</h1><p>分数: '+score+'</p>' +
      '<button id="btn" style="margin-top:16px;padding:12px 44px;font-size:18px;font-weight:700;border:none;border-radius:999px;cursor:pointer;background:linear-gradient(135deg,#f0932b,#eb4d4b);color:#fff" onclick="location.reload()">再来一次</button>';
  }

  function start(){
    ov.style.display = 'none';
    reset();
    running = true;
  }
  btn.addEventListener('click', start);

  document.addEventListener('keydown', function(e){
    if(!running) return;
    const k = e.key;
    if(k==='ArrowUp')       { move(0); e.preventDefault(); }
    else if(k==='ArrowRight'){ move(1); e.preventDefault(); }
    else if(k==='ArrowDown') { move(2); e.preventDefault(); }
    else if(k==='ArrowLeft') { move(3); e.preventDefault(); }
  });

  // 滑动 —— 绑定到 #board 上，避免和页面滚动冲突
  let tx, ty;
  boardEl.addEventListener('touchstart', function(e){
    tx = e.touches[0].clientX;
    ty = e.touches[0].clientY;
  }, {passive:true});
  boardEl.addEventListener('touchend', function(e){
    if(!running) return;
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > Math.abs(dy)){
      if(dx > 30) move(1);
      else if(dx < -30) move(3);
    } else {
      if(dy > 30) move(2);
      else if(dy < -30) move(0);
    }
  });

  // 初始渲染
  reset();
  running = false;
})();
</script>
<!-- 提交分数弹窗 -->
<div class="score-dialog" id="scoreDialog">
  <div class="box">
    <h2>🏆 游戏结束</h2>
    <p id="finalScore" style="color:#fff;font-size:14px"></p>
    <button onclick="loginAndSubmit()" style="background:#24292e;color:#fff;border:1px solid #555">
      🐙 用 GitHub 登录提交
    </button>
    <p class="status" id="submitStatus"></p>
  </div>
</div>

<script>
const GAME_KEY = '2048';
const CLIENT_ID = 'Ov23liUtg4iRn8uimlnC';

function showScoreDialog(score) {
  window._lastScore = score;
  document.getElementById('finalScore').textContent = '得分: ' + score;
  document.getElementById('scoreDialog').classList.add('show');
}

function loginAndSubmit() {
  localStorage.setItem('pending_game', GAME_KEY);
  localStorage.setItem('pending_score', String(window._lastScore));
  const redirect = encodeURIComponent('https://cxf54188.github.io/blog/games/oauth-callback.html');
  location.href = `https://github.com/login/oauth/authorize?client_id=${CLIENT_ID}&redirect_uri=${redirect}&scope=read:user`;
}
</script>
</html>
