<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>2048</title>
<link rel="stylesheet" href="_common.css">
<style>
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:8px;touch-action:none}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;background:rgba(255,255,255,.06);border-radius:14px;border:1px solid rgba(255,255,255,.1);max-width:340px;width:100%;position:relative}
.cell{aspect-ratio:1;background:rgba(255,255,255,.04);border-radius:8px;position:relative}
.cell::before{content:'';position:absolute;inset:0;border-radius:8px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04)}
#board{position:absolute;inset:10px;pointer-events:none}
.tile{position:absolute;display:flex;align-items:center;justify-content:center;font-weight:800;border-radius:8px;transition:transform .15s cubic-bezier(.2,.8,.2,1);will-change:transform;font-size:clamp(16px,5vw,26px)}
.hud{display:flex;gap:16px;margin:10px 0;font-size:14px;color:#94a3b8;flex-wrap:wrap;justify-content:center}
.hud b{color:#4fc3f7}
</style>
</head>
<body>
<a class="back-link" href="index.html">← 返回游戏列表</a>
<div id="topbar"></div>
<h1 style="font-size:22px;margin:6px 0;background:linear-gradient(90deg,#f43f5e,#f97316,#facc15);-webkit-background-clip:text;-webkit-text-fill-color:transparent">🔢 2048</h1>
<div class="hud">
  <span>分数：<b id="sc">0</b></span>
  <span>最高分：<b id="hi">0</b></span>
</div>
<div id="grid">
  <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
  <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
  <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
  <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
  <div id="board"></div>
</div>
<button class="btn btn-sm btn-danger" id="restart" style="margin-top:12px">重新开始</button>
<p style="color:#64748b;font-size:12px;margin-top:8px">方向键 / WASD / 滑动</p>

<script src="_common.js"></script>
<script>
const topbar=document.getElementById('topbar');topbar.innerHTML=makeTopbar();
const board=document.getElementById('board');
const grid=document.getElementById('grid');
const SIZE=4;
let tiles={},score=0,high=Store.get('2048_hi',0);

const COLORS={2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e',4096:'#3c3a32',8192:'#3c3a32'};

function tileSize(){
  const rect=grid.getBoundingClientRect();
  return (rect.width-3*8-20)/4;
}
function gapSize(){return 8}

function updateTilePos(t){
  const sz=tileSize();
  const gap=gapSize();
  t.el.style.width=sz+'px';
  t.el.style.height=sz+'px';
  t.el.style.transform=`translate(${t.col*(sz+gap)}px,${t.row*(sz+gap)}px)`;
}

function spawnTile(){
  const empty=[];
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(!tiles[`${r},${c}`])empty.push([r,c]);
  if(!empty.length)return;
  const [r,c]=empty[Math.floor(Math.random()*empty.length)];
  const v=Math.random()<0.9?2:4;
  const el=document.createElement('div');el.className='tile';
  const sz=tileSize();
  el.style.width=sz+'px';el.style.height=sz+'px';
  el.style.background=COLORS[v]||'#3c3a32';
  el.style.color=v<=4?'#776e65':'#fff';
  el.style.fontSize=Math.max(14,Math.min(26,v>=1000?16:22))+'px';
  el.textContent=v;
  board.appendChild(el);
  tiles[`${r},${c}`]={row:r,col:c,val:v,el};
  el.style.transition='none';
  updateTilePos(tiles[`${r},${c}`]);
  requestAnimationFrame(()=>{
    el.style.transition='transform .15s cubic-bezier(.2,.8,.2,1),opacity .15s';
    updateTilePos(tiles[`${r},${c}`]);
  });
}

function move(dir){
  // dir: 0=up, 1=down, 2=left, 3=right
  const horiz=dir>=2;
  const forward=dir===1||dir===3;
  let moved=false;
  for(let i=0;i<SIZE;i++){
    const line=[];
    for(let j=0;j<SIZE;j++){
      const r=horiz?i:(forward?j:SIZE-1-j);
      const c=horiz?(forward?j:SIZE-1-j):i;
      const t=tiles[`${r},${c}`];if(t)line.push(t);
    }
    // 合并
    for(let k=0;k<line.length-1;k++){
      if(line[k].val===line[k+1].val){
        line[k].val*=2;score+=line[k].val;
        line[k].el.textContent=line[k].val;
        line[k].el.style.background=COLORS[line[k].val]||'#3c3a32';
        line[k].el.style.color=line[k].val<=4?'#776e65':'#fff';
        const dead=line[k+1];line.splice(k+1,1);
        dead.el.style.opacity='0';setTimeout(()=>dead.el.remove(),160);
        for(const key in tiles)if(tiles[key]===dead)delete tiles[key];
        moved=true;
      }
    }
    // 重新放置
    line.forEach((t,idx)=>{
      const nr=horiz?i:idx;
      const nc=horiz?idx:i;
      const oldKey=`${t.row},${t.col}`;
      if(t.row!==nr||t.col!==nc)moved=true;
      t.row=nr;t.col=nc;
      delete tiles[oldKey];
      tiles[`${nr},${nc}`]=t;
      updateTilePos(t);
    });
  }
  if(moved){
    document.getElementById('sc').textContent=score;
    if(score>high){high=score;Store.set('2048_hi',high);document.getElementById('hi').textContent=high}
    setTimeout(()=>{spawnTile();checkLose()},120);
  }
}

function checkLose(){
  if(Object.keys(tiles).length<16)return;
  for(const k in tiles){const t=tiles[k];const r=t.row,c=t.col;
    const n=tiles[`${r},${c+1}`],s=tiles[`${r+1},${c}`];
    if((n&&n.val===t.val)||(s&&s.val===t.val))return;
  }
  setTimeout(()=>alert('💀 游戏结束！得分：'+score),200);
}

function reset(){
  score=0;
  Object.values(tiles).forEach(t=>t.el.remove());
  tiles={};
  document.getElementById('sc').textContent=0;
  document.getElementById('hi').textContent=high;
  spawnTile();spawnTile();
}

document.getElementById('restart').onclick=reset;

document.addEventListener('keydown',e=>{
  switch(e.key){
    case'ArrowUp':case'w':case'W':move(0);e.preventDefault();break;
    case'ArrowDown':case's':case'S':move(1);e.preventDefault();break;
    case'ArrowLeft':case'a':case'A':move(2);e.preventDefault();break;
    case'ArrowRight':case'd':case'D':move(3);e.preventDefault();break;
  }
});

addSwipe(grid,{up:()=>move(0),down:()=>move(1),left:()=>move(2),right:()=>move(3)});
window.addEventListener('resize',()=>{for(const k in tiles)updateTilePos(tiles[k])});

// 初始化
requestAnimationFrame(()=>{reset()});
</script>
</body></html>
