<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>行动代号</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#0a0e27,#1a1a3e);min-height:100vh;color:#fff;overflow:hidden}
.topbar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(0,0,0,.6);position:sticky;top:0;z-index:999;border-bottom:1px solid rgba(255,255,255,.08)}
.topbar .avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;border:2px solid #4fc3f7}
.topbar .info{font-size:12px;color:#94a3b8}
.topbar .info b{color:#e2e8f0}
.topbar .yb{width:22px;height:22px;border-radius:50%;background:#00a86b;display:inline-flex;align-items:center;justify-content:center;font-size:12px;vertical-align:middle;margin-right:2px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.overlay h2{font-size:22px;margin-bottom:10px;color:#f43f5e}
.overlay .rules{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:14px 18px;max-width:420px;margin-bottom:16px;text-align:left;font-size:13px;line-height:1.8;color:#cbd5e1}
.overlay .rules b{color:#f43f5e}
.btn{display:inline-block;padding:10px 28px;border-radius:10px;border:none;font-size:15px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#f43f5e,#ec4899);color:#fff;font-family:inherit}
.btn:hover{transform:scale(1.05)}
.btn-sm{padding:6px 14px;font-size:13px;border-radius:8px}
#game{display:none;height:calc(100vh - 42px);overflow-y:auto;padding:8px;flex-direction:column;align-items:center}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:560px;width:100%}
.word{aspect-ratio:1.6/1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;border-radius:6px;cursor:pointer;user-select:none;transition:.15s;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.1);text-align:center;padding:2px}
.word:hover{transform:scale(1.06);border-color:#4fc3f7}
.word.revealed{cursor:default;transform:none}
.word.red{background:linear-gradient(135deg,#dc2626,#991b1b);border-color:#fca5a5}
.word.blue{background:linear-gradient(135deg,#2563eb,#1e40af);border-color:#93c5fd}
.word.neutral{background:linear-gradient(135deg,#78716c,#44403c);border-color:#a8a29e}
.word.assassin{background:linear-gradient(135deg,#0f0f0f,#1c1917);border-color:#fbbf24}
.hint-bar{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:13px;color:#cbd5e1;flex-wrap:wrap;justify-content:center}
.hint-bar input{width:120px;padding:4px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:13px;font-family:inherit}
.hint-bar select{padding:4px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:13px;font-family:inherit}
.msg{font-size:13px;color:#fda4af;margin:4px 0;min-height:18px;text-align:center}
.score-bar{display:flex;gap:16px;font-size:13px;margin:4px 0}
.score-bar .red{color:#fca5a5}.score-bar .blue{color:#93c5fd}
.team-red{color:#fca5a5;font-weight:600}.team-blue{color:#93c5fd;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:20px;text-align:center}
.modal.show{display:flex}
.modal h3{font-size:20px}
.role-info{font-size:12px;color:#94a3b8;margin:2px 0}
</style>
</head>
<body>
<div class="topbar">
  <img class="avatar" src="../../img/avatar.png" alt="cxf54188" onerror="this.style.display='none'">
  <div class="info"><b>作者：cxf54188</b> &nbsp;|&nbsp; <span class="yb">🤖</span><b>辅助：元宝AI</b></div>
</div>
<div class="overlay" id="overlay">
  <h2>🕵️ 行动代号</h2>
  <div class="rules">
    <b>阵营：</b>你当<b>队长</b>（红队），AI 是<b>队友</b>（红队）<br>
    <b>目标：</b>先找出己方全部特工词<br>
    <b>玩法：</b><br>
    ① 你给一个<b>暗号词 + 数字</b>（如"水果 2"）<br>
    ② AI队友根据暗号猜词，点对应格子<br>
    ③ 猜对继续，猜错/碰中立/碰刺客 → 换队<br>
    <b>刺客：</b>谁先碰到直接输！<br>
    <b>你的视角：</b>能看到所有词的颜色
  </div>
  <button class="btn" id="startBtn">开始游戏</button>
</div>
<div id="game">
  <div class="msg" id="msg">你是红队队长，给暗号吧</div>
  <div class="hint-bar" id="hintBar">
    <span>暗号：</span>
    <input id="hintWord" placeholder="输入暗号词" maxlength="8">
    <span>数字：</span>
    <select id="hintNum">
      <option>1</option><option>2</option><option>3</option><option>4</option>
    </select>
    <button class="btn btn-sm" id="giveHint">发出暗号</button>
  </div>
  <div class="score-bar">
    <span class="red">红队：<b id="redScore">0</b>/<span id="redTotal">0</span></span>
    <span class="blue">蓝队：<b id="blueScore">0</b>/<span id="blueTotal">0</span></span>
    <span style="color:#a8a29e">中立：<b id="neutralTotal">0</b></span>
  </div>
  <div class="board" id="board"></div>
  <div class="role-info" id="roleInfo"></div>
</div>
<div class="modal" id="modal"><h3 id="modalTitle"></h3><div id="modalBody"></div><button class="btn btn-sm" onclick="document.getElementById('modal').classList.remove('show')">知道了</button></div>
<script>
const WORD_POOL=['苹果','香蕉','橙子','老虎','狮子','火箭','潜艇','城堡','钻石','皇冠','医生','钢琴','魔术','幽灵','海盗','沙漠','火山','雪豹','咖啡','奶茶','地铁','风筝','珊瑚','琥珀','辣椒','薄荷','琥珀','冰川','彩虹','磁铁','龙卷风','棋盘','灯塔','蜘蛛','海豚','吉他','金字塔','森林','火焰','流星','蘑菇','坚果','灯塔','蘑菇','瀑布','冰川','琥珀','珊瑚','磁铁','彩虹'];

let words=[],colors=[],revealed=[],turn,redLeft,blueLeft,neutralLeft,hint=null,guessesLeft=0,gameOver=false;

function startGame(){
  // 选25个词
  const pool=WORD_POOL.slice().sort(()=>Math.random()-.5);
  words=pool.slice(0,25);
  // 颜色分配：红9 蓝8 中立7 刺客1（红先）
  colors=[];
  for(let i=0;i<9;i++)colors.push('red');
  for(let i=0;i<8;i++)colors.push('blue');
  for(let i=0;i<7;i++)colors.push('neutral');
  colors.push('assassin');
  colors.sort(()=>Math.random()-.5);
  revealed=new Array(25).fill(false);
  turn='red';redLeft=9;blueLeft=8;neutralLeft=7;hint=null;guessesLeft=0;gameOver=false;
  document.getElementById('game').style.display='flex';
  render();
}

function render(){
  const board=document.getElementById('board');
  board.innerHTML='';
  words.forEach((w,i)=>{
    const d=document.createElement('div');
    d.className='word'+(revealed[i]?' revealed '+colors[i]:'');
    d.textContent=w;
    d.onclick=()=>guessWord(i);
    board.appendChild(d);
  });
  document.getElementById('redScore').textContent=9-redLeft;
  document.getElementById('redTotal').textContent=9;
  document.getElementById('blueScore').textContent=8-blueLeft;
  document.getElementById('blueTotal').textContent=8;
  document.getElementById('neutralTotal').textContent=neutralLeft;
  const msg=document.getElementById('msg');
  if(gameOver)return;
  if(turn==='red'){
    if(hint&&guessesLeft>0)msg.textContent=`AI队友猜词中...（还剩${guessesLeft}次）`;
    else msg.textContent='你（红队队长）— 给暗号';
  }else{
    msg.textContent='蓝队回合 — AI对手操作中...';
  }
  // 提示栏
  const hb=document.getElementById('hintBar');
  hb.style.display=(turn==='red'&&!hint)?'flex':'none';
  document.getElementById('roleInfo').textContent=`你看到的所有词颜色 → 红:${redLeft} 蓝:${blueLeft} 中立:${neutralLeft} 刺客:1`;
}

function giveHint(){
  if(turn!=='red'||hint)return;
  const w=document.getElementById('hintWord').value.trim();
  const n=parseInt(document.getElementById('hintNum').value);
  if(!w){alert('请输入暗号词');return;}
  hint={word:w,num:n};
  guessesLeft=n+1; // 多一次机会
  render();
  setTimeout(aiGuess,1200);
}

function aiGuess(){
  if(gameOver||turn!=='red'||guessesLeft<=0)return;
  // AI根据暗号猜词：选未揭示的，优先与暗号"相关"的
  const w=hint.word;
  const candidates=[];
  for(let i=0;i<25;i++){
    if(revealed[i])continue;
    let score=0;
    const word=words[i];
    // 简单关联：包含相同字/拼音近似（简化用随机+偏置）
    if(word.includes(w[0]))score+=3;
    if(colors[i]==='red')score+=2; // AI倾向猜红
    if(colors[i]==='blue')score-=1;
    if(colors[i]==='assassin')score-=5;
    candidates.push({i,score:score+Math.random()*2});
  }
  candidates.sort((a,b)=>b.score-a.score);
  const pick=candidates[0].i;
  revealWord(pick);
}

function revealWord(i){
  if(revealed[i]||gameOver)return;
  revealed[i]=true;
  const c=colors[i];
  if(c==='red'){redLeft--;guessesLeft--;}
  else if(c==='blue'){blueLeft--;guessesLeft=0;turn='blue';}
  else if(c==='neutral'){neutralLeft--;guessesLeft--;}
  else if(c==='assassin'){gameOver=true;setTimeout(()=>showModal('💀 刺客！','红队碰到了刺客，蓝队获胜！'),200);render();return;}
  // 检查胜负
  if(redLeft===0){gameOver=true;setTimeout(()=>showModal('🎉 红队胜利！','所有红队特工已找到！'),200);render();return;}
  if(blueLeft===0){gameOver=true;setTimeout(()=>showModal('💙 蓝队胜利！','所有蓝队特工已找到！'),200);render();return;}
  render();
  if(turn==='red'&&guessesLeft>0)setTimeout(aiGuess,1000);
  else if(turn==='red'&&guessesLeft<=0){turn='blue';hint=null;render();setTimeout(blueTurn,800);}
  else if(turn==='blue'){/* 蓝队结束后回红队 */turn='red';hint=null;render();}
}

function blueTurn(){
  if(gameOver)return;
  // 蓝队AI简单选：避开红和刺客
  const cands=[];
  for(let i=0;i<25;i++){
    if(revealed[i])continue;
    let s=Math.random()*3;
    if(colors[i]==='blue')s+=3;
    if(colors[i]==='red')s-=3;
    if(colors[i]==='assassin')s-=10;
    cands.push({i,s});
  }
  cands.sort((a,b)=>b.s-a.s);
  const picks=Math.min(1+Math.floor(Math.random()*2),cands.length);
  let count=0;
  const doPick=()=>{
    if(count>=picks||gameOver)return;
    const p=cands[count];count++;
    revealed[p.i]=true;
    if(colors[p.i]==='blue'){blueLeft--;}
    else if(colors[p.i]==='red'){redLeft--;turn='red';hint=null;render();setTimeout(()=>{},100);return;}
    else if(colors[p.i]==='neutral'){}
    else if(colors[p.i]==='assassin'){gameOver=true;showModal('💀 刺客！','蓝队碰到刺客，红队获胜！');render();return;}
    render();
    if(count<picks&&!gameOver)setTimeout(doPick,600);
    else{setTimeout(()=>{if(!gameOver){turn='red';hint=null;render();}},500);}
  };
  doPick();
}

function guessWord(i){
  // 玩家不能直接猜（只能给暗号），但允许点击查看
  if(turn==='red'&&hint&&guessesLeft>0){
    // 玩家也可以帮AI点
    revealWord(i);
  }
}

function showModal(t,b){
  document.getElementById('modalTitle').textContent=t;
  document.getElementById('modalBody').innerHTML=b;
  document.getElementById('modal').classList.add('show');
}

document.getElementById('giveHint').onclick=giveHint;
document.getElementById('startBtn').onclick=()=>{
  document.getElementById('overlay').style.display='none';
  setTimeout(startGame,100);
};
</script>
</body>
</html>
