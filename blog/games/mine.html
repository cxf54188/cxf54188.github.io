<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>扫雷</title>
<link rel="stylesheet" href="./_common.css">
<style>
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:8px}
#board{display:grid;gap:2px;padding:10px;background:rgba(255,255,255,.05);border-radius:12px;border:1px solid rgba(255,255,255,.1)}
.cell{width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;border-radius:4px;cursor:pointer;background:rgba(255,255,255,.08);user-select:none;transition:.1s}
.cell:hover{background:rgba(255,255,255,.15)}
.cell.open{background:rgba(0,0,0,.3);cursor:default}
.cell.mine{background:#f43f5e}
.cell.flag::after{content:'🚩';font-size:12px}
.hud{display:flex;gap:16px;margin:8px 0;font-size:14px;color:#94a3b8;flex-wrap:wrap;justify-content:center}
.hud b{color:#4fc3f7}
</style>
</head>
<body>
<a class="back-link" href="../../index.html">← 返回主页</a>
<div id="topbar"></div>
<h1 style="font-size:22px;margin:6px 0;background:linear-gradient(90deg,#34d399,#4fc3f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent">💣 扫雷</h1>
<div class="hud">
  <span>⏱️ <b id="tm">0</b>s</span>
  <span>💣 <b id="mines">40</b></span>
  <span>😊</span>
</div>
<div id="board"></div>
<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center">
  <button class="btn btn-sm" data-d="8,8,10">简单</button>
  <button class="btn btn-sm" data-d="16,16,40">中级</button>
  <button class="btn btn-sm btn-danger" data-d="24,24,99">专家</button>
</div>
<p style="color:#64748b;font-size:12px;margin-top:8px">左键揭开 · 右键插旗</p>

<script src="./_common.js"></script>
<script>
const topbar=document.getElementById('topbar');topbar.innerHTML=makeTopbar();
const board=document.getElementById('board');
let W=16,H=16,MINES=40,grid=[],opened=0,flagged=0,timer=0,tick=null,gameOver=false;

function reset(w,h,m){W=w;H=h;MINES=m;opened=0;flagged=0;timer=0;gameOver=false;clearInterval(tick);document.getElementById('tm').textContent=0;document.getElementById('mines').textContent=m;board.style.gridTemplateColumns=`repeat(${W},28px)`;grid=Array.from({length:H},()=>Array.from({length:W},()=>({mine:false,open:false,flag:false,count:0})));const idx=[];for(let i=0;i<H*W;i++)idx.push(i);shuffle(idx);for(let i=0;i<m;i++){const r=Math.floor(idx[i]/W),c=idx[i]%W;grid[r][c].mine=true}for(let r=0;r<H;r++)for(let c=0;c<W;c++){if(grid[r][c].mine)continue;let n=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<H&&nc>=0&&nc<W&&grid[nr][nc].mine)n++}grid[r][c].count=n}render()}
function render(){board.innerHTML='';for(let r=0;r<H;r++)for(let c=0;c<W;c++){const div=document.createElement('div');div.className='cell'+(grid[r][c].open?' open':'')+(grid[r][c].flag?' flag':'');if(grid[r][c].open&&grid[r][c].mine)div.classList.add('mine');if(grid[r][c].open&&!grid[r][c].mine&&grid[r][c].count)div.textContent=grid[r][c].count,div.style.color=['#3b82f6','#34d399','#f43f5e','#a78bfa','#f97316','#06b6d4','#000','#666'][grid[r][c].count-1];div.onclick=()=>click(r,c);div.oncontextmenu=e=>{e.preventDefault();flag(r,c)};board.appendChild(div)}}
function click(r,c){if(gameOver||grid[r][c].flag||grid[r][c].open)return;if(!tick)startTimer();if(grid[r][c].mine){grid[r][c].open=true;gameOver=true;clearInterval(tick);render();setTimeout(()=>alert('💥 BOOM!'),50);return}openCell(r,c);checkWin();render()}
function openCell(r,c){if(r<0||r>=H||c<0||c>=W||grid[r][c].open||grid[r][c].flag)return;grid[r][c].open=true;opened++;if(grid[r][c].count===0){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(dr||dc)openCell(r+dr,c+dc)}}
function flag(r,c){if(gameOver||grid[r][c].open)return;grid[r][c].flag=!grid[r][c].flag;flagged+=grid[r][c].flag?1:-1;document.getElementById('mines').textContent=MINES-flagged;render()}
function checkWin(){if(opened===H*W-MINES){gameOver=true;clearInterval(tick);setTimeout(()=>alert('🎉 你赢了！时间：'+timer+'s'),50)}}
function startTimer(){tick=setInterval(()=>{timer++;document.getElementById('tm').textContent=timer},1000)}
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const p=b.dataset.d.split(',');reset(+p[0],+p[1],+p[2])});
reset(16,16,40);
</script>
</body></html>
