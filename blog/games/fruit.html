<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🍉 接水果</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0c29;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:system-ui,sans-serif;overflow:hidden}
#wrap{position:relative;width:380px;max-width:96vw}
canvas{display:block;width:100%;border-radius:14px;box-shadow:0 0 40px rgba(255,100,100,.3);background:linear-gradient(180deg,#1a1a3e,#0d0d2b);touch-action:none}
#bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:rgba(0,0,0,.6);border-radius:14px 14px 0 0;color:#fff;font-size:13px}
#bar img{width:24px;height:24px;border-radius:50%;object-fit:cover}
#bar .sep{opacity:.5;margin:0 2px}
#info{display:flex;justify-content:space-between;padding:6px 14px;color:#fff;font-size:14px;font-weight:700;background:rgba(0,0,0,.4)}
#overlay{position:absolute;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);border-radius:14px;color:#fff;text-align:center;padding:20px}
#overlay h1{font-size:26px;margin-bottom:6px}
#overlay p{font-size:13px;opacity:.8;max-width:280px;line-height:1.5}
#btn{margin-top:16px;padding:12px 44px;font-size:18px;font-weight:700;border:none;border-radius:999px;cursor:pointer;background:linear-gradient(135deg,#f0932b,#f5576c);color:#fff;box-shadow:0 6px 24px rgba(245,87,108,.4)}
#btn:active{transform:scale(.95)}
</style>
</head>
<body>
<div id="wrap">
<div id="bar">
  <img src="https://cdn.luogu.com.cn/upload/image_hosting/v70j6st4.png" alt="cxf" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2216%22 fill=%22%236a5acd%22/%3E%3Ctext x=%2216%22 y=%2222%22 text-anchor=%22middle%22 font-size=%2218%22 fill=%22%23fff%22%3Ec%3C/text%3E%3C/svg%3E'">
  <span>作者：cxf54188</span><span class="sep">|</span>
  <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2322c55e' stroke='%2316a34a' stroke-width='2'/%3E%3Cpath d='M20 35 Q32 42 46 33' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='24' r='3.5' fill='%23fff'/%3E%3Ccircle cx='42' cy='24' r='3.5' fill='%23fff'/%3E%3Ccircle cx='22' cy='24' r='1.5' fill='%2316a34a'/%3E%3Ccircle cx='42' cy='24' r='1.5' fill='%2316a34a'/%3E%3C/svg%3E" alt="YB" style="background:#22c55e;">
  <span>辅助：元宝AI</span>
</div>
<canvas id="c" width="380" height="520"></canvas>
<div id="info"><span id="score">分数: 0</span><span id="combo">连击: 0</span><span id="lives">❤️❤️❤️</span></div>
<div id="overlay">
  <h1>🍉 接水果</h1>
  <p>← → 或鼠标拖动篮筐<br>接住水果得分，漏掉扣命</p>
  <button id="btn">开始游戏</button>
</div>
</div>
<script>
(function(){
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const W=380,H=520;
const ov=document.getElementById('overlay'),btn=document.getElementById('btn');
const scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo'),livesEl=document.getElementById('lives');

const FRUITS=[
  {emoji:'🍎',pts:10,spd:1.5,color:'#e74c3c'},
  {emoji:'🍊',pts:15,spd:2.0,color:'#f39c12'},
  {emoji:'🍇',pts:20,spd:2.5,color:'#9b59b6'},
  {emoji:'🍉',pts:30,spd:3.0,color:'#e74c3c'},
  {emoji:'🍌',pts:25,spd:2.8,color:'#f1c40f'},
  {emoji:'🍓',pts:20,spd:2.2,color:'#e91e63'},
  {emoji:'⭐',pts:50,spd:3.5,color:'#ffd700'}
];

let fruits,basket,score,combo,lives,running,animId;

function reset(){
  fruits=[];
  basket={x:W/2-35,y:H-50,w:70,h:18};
  score=0;combo=0;lives=3;
  scoreEl.textContent='分数: 0';comboEl.textContent='连击: 0';livesEl.textContent='❤️❤️❤️';
}
function spawnFruit(){
  const f=FRUITS[Math.floor(Math.random()*FRUITS.length)];
  let x;
  do{x=20+Math.random()*(W-40)}
  while(fruits.some(ex=>Math.abs(ex.x-x)<30&&ex.y<40));
  fruits.push({x,y:-20,emoji:f.emoji,pts:f.pts,spd:f.spd,color:f.color,size:22+Math.random()*8});
}
function update(){
  if(!running)return;
  // spawn
  if(Math.random()<0.02+combo*0.001)spawnFruit();
  // move
  for(const f of fruits){f.y+=f.spd+combo*0.05}
  // catch
  for(let i=fruits.length-1;i>=0;i--){
    const f=fruits[i];
    if(f.y+15>=basket.y&&f.y-15<=basket.y+basket.h&&
       f.x>=basket.x-10&&f.x<=basket.x+basket.w+10){
      score+=f.pts*(1+Math.floor(combo/5)*0.5);
      combo++;fruits.splice(i,1);
      scoreEl.textContent='分数: '+score;comboEl.textContent='连击: '+combo;
    }else if(f.y>H+20){
      combo=0;lives--;fruits.splice(i,1);
      comboEl.textContent='连击: 0';livesEl.textContent='❤️'.repeat(Math.max(0,lives));
      if(lives<=0){running=false;gameOver()}
    }
  }
}
function draw(){
  // bg
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1a1a3e');g.addColorStop(1,'#0d0d2b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // stars
  ctx.fillStyle='rgba(255,255,255,.3)';
  for(let i=0;i<30;i++){const x=(i*73)%W,y=(i*137)%H;ctx.fillRect(x,y,1,1)}
  // fruits
  ctx.font='24px serif';
  for(const f of fruits){ctx.font=f.size+'px serif';ctx.fillText(f.emoji,f.x-10,f.y+8)}
  // basket
  const bx=basket.x,bw=basket.w;
  ctx.shadowColor='#f5576c';ctx.shadowBlur=15;
  ctx.fillStyle='#f5576c';
  ctx.beginPath();ctx.roundRect(bx,basket.y,bw,basket.h,8);ctx.fill();
  ctx.shadowBlur=0;
  // basket handle
  ctx.strokeStyle='#f5576c';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(bx+bw/2,basket.y,12,Math.PI,0);ctx.stroke();
  // basket highlight
  ctx.fillStyle='rgba(255,255,255,.2)';
  ctx.beginPath();ctx.roundRect(bx+4,basket.y+2,bw-8,4,2);ctx.fill();
}
function gameOver(){
  ov.style.display='flex';
  ov.innerHTML='<h1>💔 游戏结束</h1><p>分数: '+Math.floor(score)+'<br>最高连击: '+combo+'</p><button id="btn" style="margin-top:16px;padding:12px 44px;font-size:18px;font-weight:700;border:none;border-radius:999px;cursor:pointer;background:linear-gradient(135deg,#f0932b,#f5576c);color:#fff" onclick="location.reload()">再来一次</button>';
}
function loop(){update();draw();if(running)animId=requestAnimationFrame(loop)}
function start(){ov.style.display='none';reset();running=true;if(animId)cancelAnimationFrame(animId);loop()}
btn.addEventListener('click',start);

// mouse
cvs.addEventListener('mousemove',e=>{
  const r=cvs.getBoundingClientRect();const s=W/r.width;
  basket.x=(e.clientX-r.left)*s-basket.w/2;basket.x=Math.max(0,Math.min(W-basket.w,basket.x));
});
// touch
cvs.addEventListener('touchmove',e=>{e.preventDefault();const r=cvs.getBoundingClientRect();const s=W/r.width;basket.x=(e.touches[0].clientX-r.left)*s-basket.w/2;basket.x=Math.max(0,Math.min(W-basket.w,basket.x))},{passive:false});
// keys
document.addEventListener('keydown',e=>{
  if(!running)return;
  const s=12;
  if(e.key==='ArrowLeft'){basket.x=Math.max(0,basket.x-s);e.preventDefault()}
  if(e.key==='ArrowRight'){basket.x=Math.min(W-basket.w,basket.x+s);e.preventDefault()}
});

// roundRect polyfill
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.quadraticCurveTo(x+w,y,x+w,y+r);this.lineTo(x+w,y+h-r);this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);this.lineTo(x+r,y+h);this.quadraticCurveTo(x,y+h,x,y+h-r);this.lineTo(x,y+r);this.quadraticCurveTo(x,y,x+r,y);this.closePath()}}

reset();draw();
})();
</script>
<!-- 提交分数弹窗 -->
<div class="score-dialog" id="scoreDialog">
  <div class="box">
    <h2>🏆 游戏结束</h2>
    <p id="finalScore" style="color:#fff;font-size:14px"></p>
    <button onclick="loginAndSubmit()" style="background:#24292e;color:#fff;border:1px solid #555">
      🐙 用 GitHub 登录提交
    </button>
    <p class="status" id="submitStatus"></p>
  </div>
</div>

<script>
const GAME_KEY = 'fruit';
const CLIENT_ID = 'Ov23liUtg4iRn8uimlnC';

function showScoreDialog(score) {
  window._lastScore = score;
  document.getElementById('finalScore').textContent = '得分: ' + score;
  document.getElementById('scoreDialog').classList.add('show');
}

function loginAndSubmit() {
  localStorage.setItem('pending_game', GAME_KEY);
  localStorage.setItem('pending_score', String(window._lastScore));
  const redirect = encodeURIComponent('https://cxf54188.github.io/blog/games/oauth-callback.html');
  location.href = `https://github.com/login/oauth/authorize?client_id=${CLIENT_ID}&redirect_uri=${redirect}&scope=read:user`;
}
</script>
</body>
</html>
