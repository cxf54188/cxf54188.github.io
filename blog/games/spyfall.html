<!DOCTYPE html>
<html lang="zh-C-N">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>谁是卧底</title>
<link rel="stylesheet" href="_common.css">
<style>
body{display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:8px}
.container{max-width:500px;width:100%;text-align:center}
.screen{display:none;padding:16px;background:rgba(255,255,255,.05);border-radius:12px;border:1px solid rgba(255,255,255,.1);margin:8px 0}
.screen.active{display:block}
.word{font-size:28px;font-weight:800;padding:16px;margin:12px 0;background:rgba(79,195,247,.1);border-radius:10px;border:1px solid rgba(79,195,247,.3)}
.role{font-size:18px;padding:8px;margin:8px 0;border-radius:8px}
.role.civilian{background:rgba(52,211,153,.15);color:#34d399}
.role.spy{background:rgba(244,63,94,.15);color:#f43f5e}
.btn{display:inline-block;padding:8px 20px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#4fc3f7,#a78bfa);color:#0a0e27;font-family:inherit;margin:4px}
.btn:hover{transform:scale(1.05)}
.btn-danger{background:linear-gradient(135deg,#f43f5e,#dc2626);color:#fff}
textarea{width:100%;max-width:300px;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.3);color:#fff;font-family:inherit;resize:none}
input{width:100%;max-width:200px;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.3);color:#fff;text-align:center;font-size:16px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.overlay h2{font-size:22px;margin-bottom:10px;color:#a78bfa}
.overlay p{color:#cbd5e1;font-size:13px;line-height:1.8;max-width:380px}
</style>
</head>
<body>
<a class="back-link" href="index.html">← 返回主页</a>
<div id="topbar"></div>
<h1 style="font-size:22px;margin:6px 0">🕵️ 谁是卧底</h1>
<div class="container">
  <div class="screen active" id="s1">
    <h3>设置玩家</h3>
    <p style="color:#94a3b8;font-size:13px;margin:6px 0">输入玩家名字（每行一个，至少3人）</p>
    <textarea id="names" rows="6" placeholder="玩家1&#10;玩家2&#10;玩家3&#10;玩家4&#10;玩家5">小明&#10;小红&#10;小刚&#10;小李&#10;小王</textarea>
    <div style="margin-top:10px"><button class="btn" id="startBtn">开始游戏</button></div>
  </div>
  <div class="screen" id="s2">
    <h3>查看身份</h3>
    <p style="color:#94a3b8;font-size:12px">逐个查看，不要让别人看到！</p>
    <div id="roleCard" class="role">点击查看</div>
    <div style="margin-top:10px"><button class="btn" id="nextRole">下一个 →</button></div>
  </div>
  <div class="screen" id="s3">
    <h3>发言阶段</h3>
    <p style="color:#94a3b8;font-size:13px">按顺序每人用一句话描述你的词</p>
    <div id="speakOrder" style="margin:8px 0;font-size:14px"></div>
    <div style="margin-top:10px"><button class="btn" id="doneSpeak">发言完毕 → 投票</button></div>
  </div>
  <div class="screen" id="s4">
    <h3>投票</h3>
    <p style="color:#94a3b8;font-size:13px">投票给谁是卧底</p>
    <div id="voteArea" style="margin:8px 0"></div>
    <div style="margin-top:10px"><button class="btn" id="doVote">确认投票</button></div>
  </div>
  <div class="screen" id="s5">
    <h3>结果揭晓</h3>
    <div id="result" style="margin:12px 0;font-size:15px;line-height:1.8"></div>
    <div style="margin-top:10px"><button class="btn" id="nextRound">下一轮</button></div>
  </div>
</div>

<script src="_common.js"></script>
<script>
const topbar=document.getElementById('topbar');topbar.innerHTML=makeTopbar();
const WORDS=[['苹果','梨'],['太阳','月亮'],['夏天','冬天'],['奶茶','咖啡'],['足球','篮球'],['老师','医生'],['熊猫','企鹅'],['钢琴','吉他'],['玫瑰','百合'],['手机','电脑']];
let players=[],words=[],roles=[],round=0,speakIdx=0,votes={},viewIdx=0,gameOver=false;

function $(id){return document.getElementById(id);}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');}
function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

$('startBtn').onclick=()=>{
  const names=$('names').value.trim().split('\n').filter(n=>n.trim()).map(n=>n.trim());
  if(names.length<3){alert('至少需要3人！');return;}
  players=names;
  const pair=WORDS[Math.floor(Math.random()*WORDS.length)];
  words=pair;
  const spyIdx=Math.floor(Math.random()*players.length);
  roles=players.map((_,i)=>i===spyIdx?'spy':'civilian');
  viewIdx=0;speakIdx=0;votes={};gameOver=false;round++;
  show('s2');showRole();
};

function showRole(){
  if(viewIdx>=players.length){show('s3');renderSpeak();return;}
  const name=players[viewIdx];
  const role=roles[viewIdx];
  const word=role==='spy'?words[1]:words[0];
  $('roleCard').className='role '+role;
  $('roleCard').innerHTML=`<b>${name}</b><br><span style="font-size:12px">${role==='spy'?'🕵️ 你是卧底':'😊 你是平民'}</span><br><div class="word">${word}</div>`;
}

$('nextRole').onclick=()=>{viewIdx++;showRole();};

function renderSpeak(){
  $('speakOrder').innerHTML=`轮到 <b style="color:#4fc3f7">${players[speakIdx]}</b> 发言<br><span style="font-size:12px;color:#64748b">点击完成继续下一位</span>`;
}

$('doneSpeak').onclick=()=>{
  speakIdx++;
  if(speakIdx>=players.length){show('s4');renderVote();}
  else renderSpeak();
};

function renderVote(){
  $('voteArea').innerHTML=players.map((n,i)=>`<button class="btn" data-v="${i}" style="margin:4px">${n}</button>`).join('');
  $('voteArea').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    votes[0]=+b.dataset.v;
    $('voteArea').querySelectorAll('button').forEach(x=>x.style.opacity=x===b?1:0.5);
  });
}

$('doVote').onclick=()=>{
  if(votes[0]===undefined){alert('请选择投票对象！');return;}
  const voted=votes[0];
  const wasSpy=roles[voted]==='spy';
  let result=`被投出：<b>${players[voted]}</b><br>身份：<b style="color:${wasSpy?'#f43f5e':'#34d399'}">${wasSpy?'🕵️ 卧底':'😊 平民'}</b><br><br>`;
  if(wasSpy){
    result+='🎉 平民胜利！卧底被找出！';
    gameOver=true;
  }else{
    result+='💀 卧底胜利！平民投错了人！';
    gameOver=true;
  }
  if(wasSpy){
    const civilianWord=words[0],spyWord=words[1];
    result+=`<br><br>平民词：<b style="color:#34d399">${civilianWord}</b><br>卧底词：<b style="color:#f43f5e">${spyWord}</b>`;
  }
  $('result').innerHTML=result;
  show('s5');
};

$('nextRound').onclick=()=>{
  if(gameOver){
    $('names').value=players.join('\n');
    show('s1');
  }else{
    show('s3');speakIdx=0;votes={};renderSpeak();
  }
};
</script>
</body></html>
