<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>毒药</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#0f172a,#1e1b4b);min-height:100vh;color:#fff;overflow:hidden}
.topbar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(0,0,0,.6);position:sticky;top:0;z-index:999;border-bottom:1px solid rgba(255,255,255,.08)}
.topbar .avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;border:2px solid #4fc3f7}
.topbar .info{font-size:12px;color:#94a3b8}
.topbar .info b{color:#e2e8f0}
.topbar .yb{width:22px;height:22px;border-radius:50%;background:#00a86b;display:inline-flex;align-items:center;justify-content:center;font-size:12px;vertical-align:middle;margin-right:2px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.overlay h2{font-size:22px;margin-bottom:10px;color:#a3e635}
.overlay .rules{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:14px 18px;max-width:420px;margin-bottom:16px;text-align:left;font-size:13px;line-height:1.8;color:#cbd5e1}
.overlay .rules b{color:#a3e635}
.btn{display:inline-block;padding:10px 28px;border-radius:10px;border:none;font-size:15px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#a3e635,#65a30d);color:#0a0e27;font-family:inherit}
.btn:hover{transform:scale(1.05)}
.btn-sm{padding:6px 14px;font-size:13px;border-radius:8px}
#game{display:none;height:calc(100vh - 42px);flex-direction:column;align-items:center;padding:10px}
.boiler{width:160px;height:180px;border-radius:20px;background:linear-gradient(180deg,#475569,#1e293b);border:3px solid #64748b;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:10px;position:relative;margin:8px 0}
.boiler::before{content:'🧪';position:absolute;top:10px;font-size:36px}
.boiler .level{width:100%;background:rgba(163,230,53,.3);border-radius:8px;transition:.5s;text-align:center;font-size:12px;color:#a3e635;min-height:4px}
.boiler .label{font-size:11px;color:#94a3b8;margin-top:4px}
.deck{width:70px;height:100px;border-radius:10px;background:linear-gradient(135deg,#7c3aed,#5b21b6);border:2px solid #a78bfa;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;user-select:none}
.deck:hover{transform:scale(1.06)}
.deck.disabled{opacity:.3;cursor:not-allowed}
.hand{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;max-width:95vw;min-height:90px;margin-top:8px}
.card{width:56px;height:78px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;cursor:pointer;user-select:none;transition:.15s;border:2px solid rgba(255,255,255,.2);flex-direction:column;padding:4px;text-align:center}
.card:hover{transform:translateY(-6px)}
.card.selected{transform:translateY(-10px);border-color:#a3e635;box-shadow:0 0 12px rgba(163,230,53,.4)}
.card.green{background:linear-gradient(135deg,#16a34a,#14532d)}
.card.yellow{background:linear-gradient(135deg,#ca8a04,#713f12)}
.card.red{background:linear-gradient(135deg,#dc2626,#7f1d1d)}
.card.purple{background:linear-gradient(135deg,#9333ea,#581c87)}
.card .val{font-size:18px;font-weight:700}
.card .lbl{font-size:9px;opacity:.7;margin-top:2px}
.msg{font-size:13px;color:#cbd5e1;margin:4px 0;min-height:18px;text-align:center}
.scores{display:flex;gap:16px;font-size:13px;color:#94a3b8;margin-top:4px}
.scores b{color:#a3e635}
.turn-indicator{font-size:12px;padding:2px 10px;border-radius:12px;margin-bottom:4px}
.turn-indicator.you{background:rgba(163,230,53,.2);color:#a3e635}
.turn-indicator.ai{background:rgba(251,191,36,.2);color:#fbbf24}
</style>
</head>
<body>
<div class="topbar">
  <img class="avatar" src="../../img/avatar.png" alt="cxf54188" onerror="this.style.display='none'">
  <div class="info"><b>作者：cxf54188</b> &nbsp;|&nbsp; <span class="yb">🤖</span><b>辅助：元宝AI</b></div>
</div>
<div class="overlay" id="overlay">
  <h2>🧪 毒药</h2>
  <div class="rules">
    <b>目标：</b>让对手的锅炉毒性先到 ≥13<br>
    <b>玩法：</b>轮流从牌堆抽1张，选择：<br>
    ① 倒入自己锅炉（毒性累加）<br>
    ② 倒入对手锅炉（毒性累加）<br>
    <b>牌值：</b>🟢 绿色=1~3 🩷 紫色=4~5 🩷 红色=6~7<br>
    <b>失败：</b>自己锅炉 ≥13 就爆掉输掉<br>
    <b>技巧：</b>毒大的给对手，毒小的留自己
  </div>
  <button class="btn" id="startBtn">开始游戏</button>
</div>
<div id="game">
  <div class="turn-indicator you" id="turnInd">你的回合</div>
  <div style="display:flex;gap:30px;align-items:flex-end">
    <div style="text-align:center">
      <div style="font-size:12px;color:#a3e635;margin-bottom:4px">你</div>
      <div class="boiler"><div class="level" id="lvl0" style="height:0%"></div><div class="label" id="lbl0">0</div></div>
    </div>
    <div class="deck" id="deck" title="抽牌">🂠</div>
    <div style="text-align:center">
      <div style="font-size:12px;color:#fbbf24;margin-bottom:4px">AI</div>
      <div class="boiler"><div class="level" id="lvl1" style="height:0%"></div><div class="label" id="lbl1">0</div></div>
    </div>
  </div>
  <div class="msg" id="msg">点击牌堆抽牌</div>
  <div class="hand" id="hand"></div>
  <div class="scores"><span>你：<b id="sc0">0</b></span><span>AI：<b id="sc1">0</b></span></div>
</div>
<script>
const POTIONS=[
  {val:1,cls:'green',lbl:'微毒'},{val:1,cls:'green',lbl:'微毒'},{val:1,cls:'green',lbl:'微毒'},
  {val:2,cls:'green',lbl:'轻毒'},{val:2,cls:'green',lbl:'轻毒'},{val:2,cls:'green',lbl:'轻毒'},
  {val:3,cls:'yellow',lbl:'中毒'},{val:3,cls:'yellow',lbl:'中毒'},{val:3,cls:'yellow',lbl:'中毒'},
  {val:4,cls:'yellow',lbl:'强毒'},{val:4,cls:'purple',lbl:'剧毒'},{val:5,cls:'purple',lbl:'剧毒'},
  {val:5,cls:'purple',lbl:'剧毒'},{val:6,cls:'red',lbl:'致命'},{val:6,cls:'red',lbl:'致命'},
  {val:7,cls:'red',lbl:'死神'},
];
let deck=[],scores=[0,0],current=0,heldPotion=null,gameOver=false;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function startGame(){
  deck=shuffle(POTIONS.slice());
  scores=[0,0];current=0;heldPotion=null;gameOver=false;
  document.getElementById('game').style.display='flex';
  render();
}

function render(){
  for(let p=0;p<2;p++){
    const pct=Math.min(100,scores[p]/13*100);
    const lvl=document.getElementById('lvl'+p);
    lvl.style.height=pct+'%';
    lvl.textContent=scores[p]>=10?'⚠️':(scores[p]>0?scores[p]:'');
    document.getElementById('lbl'+p).textContent=scores[p];
  }
  document.getElementById('sc0').textContent=scores[0];
  document.getElementById('sc1').textContent=scores[1];
  const ind=document.getElementById('turnInd');
  ind.className='turn-indicator '+(current===0?'you':'ai');
  ind.textContent=current===0?'你的回合':'AI 回合';
  const msg=document.getElementById('msg');
  if(gameOver)return;
  if(heldPotion){
    msg.innerHTML=`抽到 <b style="color:${heldPotion.cls==='green'?'#4ade60':heldPotion.cls==='yellow'?'#facc15':heldPotion.cls==='purple'?'#c084fc':'#f87171'}">${heldPotion.val} ${heldPotion.lbl}</b> — 点「倒给自己」或「倒给AI」`;
  }else if(current===0)msg.textContent='点击牌堆抽牌';
  else msg.textContent='AI 思考中...';
  document.getElementById('deck').classList.toggle('disabled',heldPotion!==null||gameOver||current!==0);
}

function drawCard(){
  if(heldPotion||gameOver||current!==0)return;
  if(deck.length===0){deck=shuffle(POTIONS.slice());}
  heldPotion=deck.pop();
  render();
}

function pourTo(target){
  if(!heldPotion||gameOver)return;
  scores[target]+=heldPotion.val;
  heldPotion=null;
  if(scores[target]>=13){
    gameOver=true;
    setTimeout(()=>alert(target===0?'💀 你爆了！AI赢':'🎉 AI爆了！你赢！'),100);
    render();
    return;
  }
  current=(current+1)%2;
  render();
  if(current===1&&!gameOver)setTimeout(aiTurn,800);
}

function aiTurn(){
  if(gameOver||heldPotion)return;
  if(deck.length===0)deck=shuffle(POTIONS.slice());
  heldPotion=deck.pop();
  // AI策略：毒性>=5给玩家，<5给自己
  const target=heldPotion.val>=5?0:1;
  setTimeout(()=>{
    scores[target]+=heldPotion.val;
    heldPotion=null;
    if(scores[target]>=13){gameOver=true;setTimeout(()=>alert(target===0?'💀 你爆了！':'🎉 AI爆了！你赢！'),100);render();return;}
    current=0;
    render();
  },700);
}

// 按钮
const actDiv=document.createElement('div');
actDiv.style.cssText='display:flex;gap:8px;margin-top:8px';
actDiv.innerHTML=`<button class="btn btn-sm" id="selfBtn" style="background:linear-gradient(135deg,#34d399,#10b981);color:#0a0e27">倒给自己</button><button class="btn btn-sm" id="aiBtn" style="background:linear-gradient(135deg,#f43f5e,#dc2626);color:#fff">倒给AI</button>`;
document.getElementById('game').appendChild(actDiv);
document.getElementById('selfBtn').onclick=()=>pourTo(0);
document.getElementById('aiBtn').onclick=()=>pourTo(1);
document.getElementById('deck').addEventListener('click',drawCard);

document.getElementById('startBtn').onclick=()=>{
  document.getElementById('overlay').style.display='none';
  setTimeout(startGame,100);
};
</script>
</body>
</html>
