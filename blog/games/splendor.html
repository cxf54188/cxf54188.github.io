<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>璀璨宝石</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#0a0e27,#1a1a3e);min-height:100vh;color:#fff;overflow:hidden}
.topbar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(0,0,0,.6);position:sticky;top:0;z-index:999;border-bottom:1px solid rgba(255,255,255,.08)}
.topbar .avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;border:2px solid #4fc3f7}
.topbar .info{font-size:12px;color:#94a3b8}
.topbar .info b{color:#e2e8f0}
.topbar .yb{width:22px;height:22px;border-radius:50%;background:#00a86b;display:inline-flex;align-items:center;justify-content:center;font-size:12px;vertical-align:middle;margin-right:2px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.overlay h2{font-size:22px;margin-bottom:10px;color:#38bdf8}
.overlay .rules{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:14px 18px;max-width:420px;margin-bottom:16px;text-align:left;font-size:13px;line-height:1.8;color:#cbd5e1}
.overlay .rules b{color:#38bdf8}
.btn{display:inline-block;padding:10px 28px;border-radius:10px;border:none;font-size:15px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#38bdf8,#818cf8);color:#0a0e27;font-family:inherit}
.btn:hover{transform:scale(1.05)}
.btn-sm{padding:6px 14px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.3;cursor:not-allowed;transform:none}
#game{display:none;height:calc(100vh - 42px);overflow-y:auto;padding:8px}
.gems-row{display:flex;gap:6px;justify-content:center;margin:6px 0;flex-wrap:wrap}
.gem{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;cursor:pointer;user-select:none;border:2px solid rgba(255,255,255,.3);transition:.15s;position:relative}
.gem:hover{transform:scale(1.12);box-shadow:0 0 10px currentColor}
.gem.selected{border-color:#fff;transform:scale(1.15);box-shadow:0 0 14px currentColor}
.gem.red{background:radial-gradient(circle,#fca5a5,#dc2626);color:#7f1d1d}
.gem.green{background:radial-gradient(circle,#86efac,#16a34a);color:#14532d}
.gem.blue{background:radial-gradient(circle,#93c5fd,#2563eb);color:#1e3a5f}
.gem.white{background:radial-gradient(circle,#e2e8f0,#94a3b8);color:#334155}
.gem.black{background:radial-gradient(circle,#a1a1aa,#3f3f46);color:#18181b}
.gem.gold{background:radial-gradient(circle,#fde68a,#d97706);color:#78350f}
.gem .cnt{position:absolute;bottom:-2px;right:-2px;background:#000;color:#fff;font-size:9px;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center}
.cards-row{display:flex;gap:6px;justify-content:center;margin:6px 0;flex-wrap:wrap}
.dcard{width:72px;height:52px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;cursor:pointer;user-select:none;border:2px solid rgba(255,255,255,.2);transition:.15s;position:relative;padding:2px}
.dcard:hover{transform:translateY(-4px);box-shadow:0 4px 12px rgba(0,0,0,.4)}
.dcard.bought{opacity:.3;pointer-events:none}
.dcard .cost{display:flex;gap:2px;margin-top:1px}
.dcard .cost span{width:10px;height:10px;border-radius:50%;display:inline-block}
.dcard .pts{position:absolute;top:2px;right:3px;font-size:10px;font-weight:700;color:#fbbf24}
.dcard .gem-icon{font-size:14px}
.nobles-row{display:flex;gap:6px;justify-content:center;margin:4px 0}
.noble{width:60px;height:36px;border-radius:6px;background:linear-gradient(135deg,#fbbf24,#d97706);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#78350f;border:1px solid #fbbf24}
.noble .pts{font-size:14px;color:#fff}
.players-info{display:flex;gap:16px;justify-content:center;margin:4px 0;font-size:12px;color:#94a3b8}
.player-info{padding:3px 10px;border-radius:6px;background:rgba(255,255,255,.04)}
.player-info.active{background:rgba(56,189,248,.2);color:#38bdf8;font-weight:600}
.msg{font-size:13px;color:#cbd5e1;text-align:center;margin:4px 0;min-height:18px}
.actions{display:flex;gap:8px;justify-content:center;margin:6px 0}
.tier-label{font-size:10px;color:#64748b;text-align:center;margin-top:4px}
</style>
</head>
<body>
<div class="topbar">
  <img class="avatar" src="../../img/avatar.png" alt="cxf54188" onerror="this.style.display='none'">
  <div class="info"><b>作者：cxf54188</b> &nbsp;|&nbsp; <span class="yb">🤖</span><b>辅助：元宝AI</b></div>
</div>
<div class="overlay" id="overlay">
  <h2>💎 璀璨宝石</h2>
  <div class="rules">
    <b>目标：</b>先达到 <b>15 分</b><br>
    <b>回合：</b>二选一<br>
    ① <b>拿宝石</b>：选3种不同颜色各1个（或同色2个需堆≥4）<br>
    ② <b>买卡牌</b>：用宝石支付卡牌左下角费用<br>
    <b>卡牌：</b>提供永久折扣 + 分数（右下角）<br>
    <b>贵族：</b>达到条件自动来访，+3分<br>
    <b>金币：</b>万能宝石，可代替任意颜色
  </div>
  <button class="btn" id="startBtn">开始游戏</button>
</div>
<div id="game">
  <div class="msg" id="msg">你的回合 — 选宝石或买卡牌</div>
  <div class="players-info" id="pInfo"></div>
  <div style="text-align:center;font-size:11px;color:#fbbf24;margin:2px 0">👑 贵族（满足折扣条件自动来访）</div>
  <div class="nobles-row" id="nobles"></div>
  <div class="tier-label">🔴 第1级卡牌（1分）</div>
  <div class="cards-row" id="t1"></div>
  <div class="tier-label">🟢 第2级卡牌（2分）</div>
  <div class="cards-row" id="t2"></div>
  <div class="tier-label">🔵 第3级卡牌（3-5分）</div>
  <div class="cards-row" id="t3"></div>
  <div style="text-align:center;font-size:11px;color:#64748b;margin:4px 0">💎 宝石堆（点击选择，选完点确认）</div>
  <div class="gems-row" id="gems"></div>
  <div class="actions">
    <button class="btn btn-sm" id="confirmBtn">确认拿宝石</button>
    <button class="btn btn-sm" id="reserveBtn" style="background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff">预留卡牌</button>
    <button class="btn btn-sm" id="cancelBtn" style="background:linear-gradient(135deg,#64748b,#475569);color:#fff">取消选择</button>
  </div>
</div>
<script>
const GEM_COLORS=['red','green','blue','white','black'];
const GEM_ICON={red:'❤️',green:'💚',blue:'💙',white:'🤍',black:'🖤'};
const ALL_GEMS=['red','green','blue','white','black','gold'];

// 卡牌生成
function genCards(){
  const t1=[],t2=[],t3=[];
  // 简化版：随机生成
  const discounts=[['red'],['green'],['blue'],['white'],['black']];
  for(let i=0;i<8;i++){
    const c={tier:1,pts:1,discount:discounts[i%5][0],cost:{}};
    const colors=GEM_COLORS.slice().sort(()=>Math.random()-.5).slice(0,1+Math.floor(Math.random()*2));
    colors.forEach(g=>{c.cost[g]=(c.cost[g]||0)+1;});
    t1.push(c);
  }
  for(let i=0;i<8;i++){
    const c={tier:2,pts:2,discount:discounts[i%5][0],cost:{}};
    const cols=GEM_COLORS.slice().sort(()=>Math.random()-.5).slice(0,2+Math.floor(Math.random()*2));
    cols.forEach(g=>{c.cost[g]=(c.cost[g]||0)+1+(Math.random()<.3?1:0);});
    t2.push(c);
  }
  for(let i=0;i<8;i++){
    const c={tier:3,pts:3+Math.floor(Math.random()*3),discount:discounts[i%5][0],cost:{}};
    const cols=GEM_COLORS.slice().sort(()=>Math.random()-.5).slice(0,3+Math.floor(Math.random()*2));
    cols.forEach(g=>{c.cost[g]=(c.cost[g]||0)+1+(Math.random()<.5?1:0);});
    if(Math.random()<.3)c.cost[GEM_COLORS[Math.floor(Math.random()*5)]]=(c.cost[GEM_COLORS[Math.floor(Math.random()*5)]]||0)+1;
    t3.push(c);
  }
  return{t1,t2,t3};
}

let bank,players,current,selectedGems=[],phase,boughtThisTurn,deck,noblePool;

function startGame(){
  const cards=genCards();
  deck={t1:cards.t1.slice(),t2:cards.t2.slice(),t3:cards.t3.slice()};
  bank={red:4,green:4,blue:4,white:4,black:4,gold:3};
  players=[
    {gems:{},cards:[],pts:0,reserved:[]},
    {gems:{},cards:[],pts:0,reserved:[]}
  ];
  noblePool=[
    {pts:3,req:{red:3,green:3,blue:3}},
    {pts:3,req:{white:3,black:3,green:3}},
    {pts:3,req:{red:3,blue:3,black:3}},
    {pts:3,req:{green:3,white:3,blue:3}},
    {pts:3,req:{red:3,green:3,black:3}},
  ].slice(0,3);
  current=0;selectedGems=[];phase='select';boughtThisTurn=false;
  document.getElementById('game').style.display='block';
  render();
}

function gemCount(p,g){return(p.gems[g]||0)+p.cards.filter(c=>c.discount===g).length;}
function totalGems(p){return ALL_GEMS.reduce((s,g)=>s+(p.gems[g]||0),0);}
function canAfford(p,card){
  let needed=0;
  for(const g of GEM_COLORS){const n=(card.cost[g]||0)-gemCount(p,g);if(n>0)needed+=n;}
  return needed<=(p.gems.gold||0);
}
function payFor(p,card){
  let goldUsed=0;
  for(const g of GEM_COLORS){
    let n=card.cost[g]||0;
    const have=(p.gems[g]||0);
    const disc=p.cards.filter(c=>c.discount===g).length;
    n=Math.max(0,n-disc);
    const take=Math.min(n,have);
    p.gems[g]=have-take;
    goldUsed+=n-take;
  }
  if(goldUsed>0){p.gems.gold=(p.gems.gold||0)-goldUsed;}
}

function checkNobles(p){
  const visiting=[];
  noblePool.forEach((n,i)=>{
    let ok=true;
    for(const g of GEM_COLORS){if((n.req[g]||0)>gemCount(p,g)){ok=false;break;}}
    if(ok)visiting.push(i);
  });
  if(visiting.length>0){
    const pick=visiting[0];
    p.pts+=noblePool[pick].pts;
    noblePool.splice(pick,1);
    return noblePool[pick]?noblePool[pick].pts:3;
  }
  return 0;
}

function render(){
  // 玩家信息
  const pi=document.getElementById('pInfo');
  pi.innerHTML='';
  players.forEach((p,i)=>{
    const d=document.createElement('div');
    d.className='player-info'+(current===i?' active':'');
    let gemStr='';
    ALL_GEMS.forEach(g=>{if(p.gems[g])gemStr+=GEM_ICON[g]+p.gems[g]+' ';});
    d.innerHTML=`${i===0?'🫵你':'🤖AI'} | ${gemStr}| 分:<b style="color:#fbbf24">${p.pts}</b>`;
    pi.appendChild(d);
  });
  // 贵族
  const nr=document.getElementById('nobles');
  nr.innerHTML='';
  noblePool.forEach(n=>{
    const d=document.createElement('div');d.className='noble';
    d.innerHTML=`<span class="pts">${n.pts}</span>分<br>${GEM_COLORS.filter(g=>n.req[g]).map(g=>GEM_ICON[g]+n.req[g]).join('')}`;
    nr.appendChild(d);
  });
  // 卡牌行
  renderTier('t1',1);renderTier('t2',2);renderTier('t3',3);
  // 宝石堆
  const gr=document.getElementById('gems');
  gr.innerHTML='';
  ALL_GEMS.forEach(g=>{
    const d=document.createElement('div');
    d.className='gem '+g+(selectedGems.includes(g)?' selected':'');
    d.style.color=g==='gold'?'#92400e':g==='white'?'#475569':g==='black'?'#d4d4d8':'#fff';
    d.innerHTML=`${GEM_ICON[g]}<span class="cnt">${bank[g]}</span>`;
    d.onclick=()=>clickGem(g);
    gr.appendChild(d);
  });
  // 消息
  const msg=document.getElementById('msg');
  if(current===0)msg.textContent='你的回合 — 点击宝石选择（3种不同），或点击卡牌购买';
  else msg.textContent='AI 思考中...';
  // 按钮
  document.getElementById('confirmBtn').disabled=current!==0||selectedGems.length===0;
}

function renderTier(elId,tier){
  const el=document.getElementById(elId);
  el.innerHTML='';
  const cards=deck['t'+tier].slice(0,4);
  cards.forEach((c,idx)=>{
    const d=document.createElement('div');
    d.className='dcard';
    d.style.background=c.discount==='red'?'linear-gradient(135deg,#fca5a5,#dc2626)':c.discount==='green'?'linear-gradient(135deg,#86efac,#16a34a)':c.discount==='blue'?'linear-gradient(135deg,#93c5fd,#2563eb)':c.discount==='white'?'linear-gradient(135deg,#e2e8f0,#94a3b8)':c.discount==='black'?'linear-gradient(135deg,#a1a1aa,#3f3f46)':'#666';
    let costStr='';
    GEM_COLORS.forEach(g=>{if(c.cost[g])costStr+=`<span style="background:${g==='red'?'#dc2626':g==='green'?'#16a34a':g==='blue'?'#2563eb':g==='white'?'#94a3b8':'#3f3f46'};width:8px;height:8px;border-radius:50%;display:inline-block;margin:0 1px"></span>${c.cost[g]}`;});
    d.innerHTML=`<span class="gem-icon">${GEM_ICON[c.discount]}</span><span class="pts">${c.pts}</span><div class="cost">${costStr}</div>`;
    if(current===0&&canAfford(players[0],c))d.style.borderColor='#4ade60';
    d.onclick=()=>{if(current===0)tryBuy(idx,tier);};
    el.appendChild(d);
  });
}

function clickGem(g){
  if(current!==0)return;
  const idx=selectedGems.indexOf(g);
  if(idx>=0){selectedGems.splice(idx,1);}
  else{
    if(selectedGems.length>=3){alert('最多选3种宝石');return;}
    if(bank[g]===0){alert('该宝石已用完');return;}
    // 同色2个规则：必须该颜色≥4才能拿2个
    if(selectedGems.includes(g)&&bank[g]<4){alert('该颜色不足4个，不能拿2个');return;}
    selectedGems.push(g);
  }
  render();
}

function tryBuy(cardIdx,tier){
  const c=deck['t'+tier][cardIdx];
  if(!canAfford(players[0],c)){alert('宝石不够买这张牌！');return;}
  payFor(players[0],c);
  deck['t'+tier].splice(cardIdx,1);
  players[0].cards.push(c);
  players[0].pts+=c.pts;
  // 检查贵族
  const noblePts=checkNobles(players[0]);
  // 补充牌
  refill(tier);
  current=1;
  render();
  setTimeout(aiTurn,900);
}

function refill(tier){
  // 从牌库补牌到4张
  while(deck['t'+tier].length<4&&deck['t'+tier+'deck']&&deck['t'+tier+'deck'].length>0){
    deck['t'+tier].push(deck['t'+tier+'deck'].pop());
  }
}

function confirmGems(){
  if(current!==0||selectedGems.length===0)return;
  // 验证
  if(selectedGems.length===1){
    const g=selectedGems[0];
    if(bank[g]<4){alert('拿2个同色宝石需要该颜色≥4个');return;}
  }
  // 拿宝石
  selectedGems.forEach(g=>{
    if(bank[g]>0){bank[g]--;players[0].gems[g]=(players[0].gems[g]||0)+1;}
  });
  // 检查手牌上限（10个宝石）
  if(totalGems(players[0])>10){alert('宝石超过10个，需先买牌或弃宝石');return;}
  selectedGems=[];
  const noblePts=checkNobles(players[0]);
  current=1;
  render();
  if(players[0].pts>=15){alert('🎉 你赢了！');return;}
  setTimeout(aiTurn,900);
}

function aiTurn(){
  if(players[1].pts>=15){alert('🤖 AI赢了');return;}
  // AI简单策略：优先买能买的最贵牌
  let bought=false;
  for(const tier of [3,2,1]){
    const cards=deck['t'+tier];
    for(let i=0;i<cards.length;i++){
      if(canAfford(players[1],cards[i])){
        payFor(players[1],cards[i]);
        players[1].cards.push(cards[i]);
        players[1].pts+=cards[i].pts;
        cards.splice(i,1);
        bought=true;
        checkNobles(players[1]);
        break;
      }
    }
    if(bought)break;
  }
  if(!bought){
    // 拿宝石：贪心拿最缺的
    const needed={};
    // 找一张最想买的牌
    let target=null,minNeeded=99;
    for(const tier of [3,2,1]){for(const c of deck[tier]){
      let need=0;for(const g of GEM_COLORS){const n=(c.cost[g]||0)-gemCount(players[1],g);if(n>0)need+=n;}
      if(need<minNeeded&&need>0){minNeeded=need;target=c;}
    }}
    const take=[];
    if(target){
      for(const g of GEM_COLORS){const n=(target.cost[g]||0)-gemCount(players[1],g);if(n>0&&bank[g]>0&&take.length<3)take.push(g);}
    }
    while(take.length<3){const g=GEM_COLORS[Math.floor(Math.random()*5)];if(!take.includes(g)&&bank[g]>0)take.push(g);else if(take.length===0)break;}
    take.forEach(g=>{if(bank[g]>0){bank[g]--;players[1].gems[g]=(players[1].gems[g]||0)+1;}});
  }
  // 检查胜利
  if(players[1].pts>=15){render();setTimeout(()=>alert('🤖 AI赢了'),100);return;}
  current=0;
  render();
}

document.getElementById('confirmBtn').onclick=confirmGems;
document.getElementById('cancelBtn').onclick=()=>{selectedGems=[];render();};
document.getElementById('reserveBtn').onclick=()=>{alert('预留功能：选一张牌预留（扣1金币）— 简化版暂未实现');};

document.getElementById('startBtn').onclick=()=>{
  document.getElementById('overlay').style.display='none';
  setTimeout(startGame,100);
};
</script>
</body>
</html>
