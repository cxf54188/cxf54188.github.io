<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>路墙棋</title>
<link rel="stylesheet" href="./_common.css">
<style>
body{display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:8px}
#board{display:grid;grid-template-columns:repeat(9,40px);gap:1px;padding:8px;background:rgba(255,255,255,.05);border-radius:10px}
.cell{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;background:rgba(139,90,43,.4);border-radius:2px}
.cell:hover{background:rgba(139,90,43,.6)}
.cell.p0{background:rgba(59,130,246,.5)}.cell.p1{background:rgba(244,63,94,.5)}
.cell.valid{box-shadow:inset 0 0 0 2px #4fc3f7}
.cell.wall{box-shadow:inset 0 0 0 2px #f43f5e;cursor:not-allowed}
.hud{display:flex;gap:16px;margin:8px 0;font-size:14px;color:#94a3b8;flex-wrap:wrap;justify-content:center}
.hud b{color:#4fc3f7}
.btn-row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<a class="back-link" href="../../index.html">← 返回主页</a>
<div id="topbar"></div>
<h1 style="font-size:22px;margin:6px 0">🧱 路墙棋</h1>
<div class="hud">
  <span>回合：<b id="turn">你（蓝）</b></span>
  <span>蓝墙：<b id="w0">10</b></span>
  <span>红墙：<b id="w1">10</b></span>
  <span>模式：<b id="mode">移动</b></span>
</div>
<div id="board"></div>
<div class="btn-row">
  <button class="btn btn-sm" id="modeBtn">切换放墙</button>
  <button class="btn btn-sm btn-danger" id="restart">重来</button>
</div>
<p style="color:#64748b;font-size:12px;margin-top:6px">蓝从左→右，红从右→左；放墙阻断对手</p>

<script src="./_common.js"></script>
<script>
const topbar=document.getElementById('topbar');topbar.innerHTML=makeTopbar();
const N=9;let grid,pos,cur,mode,walls,over;

function reset(){grid=Array.from({length:N},()=>Array(N).fill(null));for(let r=0;r<N;r++){grid[r][0]='p0';grid[r][N-1]='p1'}pos=[Math.floor(N/2),0,Math.floor(N/2),N-1];cur=0;mode='move';walls=[10,10];over=false;updateHUD();render()}
function inB(r,c){return r>=0&&r<N&&c>=0&&c<N}
function reachable(r,c,fromR,fromC,visited){const res=[];const dirs=[[0,1],[0,-1],[1,0],[-1,0]];for(const[dr,dc]of dirs){const nr=r+dr,nc=c+dc;if(!inB(nr,nc)||visited[`${nr},${nc}`])continue;if(grid[nr][nc]&&grid[nr][nc]!=='wall')continue;if(grid[nr][nc]==='wall')continue;res.push([nr,nc])}return res}
function hasPath(sr,sc,targetC,color){const q=[[sr,sc]];const vis={};vis[`${sr},${sc}`]=true;while(q.length){const[r,c]=q.shift();if(c===targetC)return true;for(const[nr,nc]of reachable(r,c,r,c,vis)){if(!vis[`${nr},${nc}`]){vis[`${nr},${nc}`]=true;q.push([nr,nc])}}}return false}
function click(r,c){if(over)return;const my='p'+cur;if(mode==='move'){if(grid[r][c]===my){selected=[r,c];render();return}if(selected){const[fr,fc]=selected;if(Math.abs(r-fr)+Math.abs(c-fc)===1&&!grid[r][c]){grid[fr][fc]=null;grid[r][c]=my;selected=null;if(checkWin(r,c))return;cur=1-cur;render();updateHUD();if(cur===1)setTimeout(ai,500)}else if(grid[r][c]===my){selected=[r,c];render()}}}else{if(grid[r][c])return;if(walls[cur]<=0)return;const fr=cur===0?pos[0]:pos[2];const fc=cur===0?pos[1]:pos[3];if(!hasPath(fr,fc,cur===0?N-1:0))return;grid[r][c]='wall';walls[cur]--;cur=1-cur;mode='move';render();updateHUD();if(cur===1)setTimeout(ai,500)}}
function checkWin(r,c){const target=cur===0?N-1:0;if(c===target){over=true;document.getElementById('turn').textContent=cur===0?'🎉 你赢了！':'💀 AI 赢了';render();return true}return false}
function ai(){const my='p'+cur;if(mode==='move'){const sr=cur===0?pos[0]:pos[2];const sc=cur===0?pos[1]:pos[3];let best=null,bd=-1;for(const[nr,nc]of reachable(sr,sc,sr,sc,{})){const d=cur===0?(N-1-nc):nc;if(d>bd){bd=d;best=[nr,nc]}}if(best){grid[sr][sc]=null;grid[best[0]][best[1]]=my;if(!checkWin(best[0],best[1])){cur=0;render();updateHUD()}}}else{const sr=pos[2],sc=pos[3];const candidates=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(grid[r][c])continue;if(hasPath(sr,sc,c,cur===0?N-1:0)){const block=cur===0?c<N-2:c>1;if(block)candidates.push([r,c])}}if(candidates.length&&walls[1]>0){const[mr,mc]=candidates[Math.floor(Math.random()*candidates.length)];grid[mr][mc]='wall';walls[1]--;cur=0;mode='move';render();updateHUD()}else{mode='move';render();updateHUD();setTimeout(ai,300)}}}
function render(){board.innerHTML='';for(let r=0;r<N;r++)for(let c=0;c<N;c++){const d=document.createElement('div');d.className='cell'+(grid[r][c]?' '+grid[r][c]:'')+(selected&&selected[0]===r&&selected[1]===c?' selected':'');d.onclick=()=>click(r,c);board.appendChild(d)}}
function updateHUD(){document.getElementById('turn').textContent=over?'游戏结束':(cur===0?'你（蓝）':'AI（红）');document.getElementById('w0').textContent=walls[0];document.getElementById('w1').textContent=walls[1];document.getElementById('mode').textContent=mode==='move'?'移动':'放墙'}
document.getElementById('modeBtn').onclick=()=>{if(cur!==0)return;mode=mode==='move'?'wall':'move';updateHUD()};
document.getElementById('restart').onclick=reset;
let selected=null;reset();
</script>
</body></html>
