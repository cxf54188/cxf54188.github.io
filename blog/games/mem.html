<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🎴 记忆翻牌</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0c29;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:system-ui,sans-serif;overflow:hidden}
#wrap{position:relative;width:440px;max-width:96vw}
#bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:rgba(0,0,0,.6);border-radius:14px 14px 0 0;color:#fff;font-size:13px}
#bar img{width:24px;height:24px;border-radius:50%;object-fit:cover}
#bar .sep{opacity:.5;margin:0 2px}
#info{display:flex;justify-content:space-between;padding:6px 14px;color:#fff;font-size:14px;font-weight:700;background:rgba(0,0,0,.4)}
#board{display:grid;gap:6px;padding:10px;background:rgba(0,0,0,.3);perspective:800px}
/* 每张卡片是一个 3D 容器 */
.card{position:relative;aspect-ratio:1;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.card.flipped{transform:rotateY(180deg)}
/* 两个面 */
.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;border-radius:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
/* 正面（盖着的那面） */
.front{background:linear-gradient(135deg,#5b6abf,#764ba2);box-shadow:inset 0 0 8px rgba(0,0,0,.2)}
.front::after{content:'?';font-size:22px;color:rgba(255,255,255,.5);font-weight:700}
/* 背面（图案面） */
.back{transform:rotateY(180deg)}
/* 配对成功：保持背面朝上 + 绿色光晕 */
.card.matched{transform:rotateY(180deg);cursor:default}
.card.matched .back{box-shadow:0 0 12px rgba(0,255,160,.6),inset 0 0 0 2px #00f5a0}
/* 配对失败时的抖动 */
@keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0)}25%{transform:rotateY(180deg) translateX(-4px)}75%{transform:rotateY(180deg) translateX(4px)}}
.card.wrong{animation:shake .3s}
#overlay{position:absolute;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);border-radius:14px;color:#fff;text-align:center;padding:20px}
#overlay h1{font-size:26px;margin-bottom:6px}
#overlay p{font-size:13px;opacity:.8;max-width:280px;line-height:1.5}
#btn{margin-top:16px;padding:12px 44px;font-size:18px;font-weight:700;border:none;border-radius:999px;cursor:pointer;background:linear-gradient(135deg,#f093fb,#f5576c);color:#fff;box-shadow:0 6px 24px rgba(245,87,108,.4)}
#btn:active{transform:scale(.95)}
#diff{display:flex;gap:8px;margin-top:12px}
#diff button{padding:6px 14px;font-size:13px;border:1px solid rgba(255,255,255,.3);border-radius:8px;background:rgba(255,255,255,.1);color:#fff;cursor:pointer}
#diff button.active{background:rgba(255,255,255,.3);font-weight:700}
</style>
</head>
<body>
<div id="wrap">
<div id="bar">
  <img src="https://cdn.luogu.com.cn/upload/image_hosting/v70j6st4.png" alt="cxf" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2216%22 fill=%22%236a5acd%22/%3E%3Ctext x=%2216%22 y=%2222%22 text-anchor=%22middle%22 font-size=%2218%22 fill=%22%23fff%22%3Ec%3C/text%3E%3C/svg%3E'">
  <span>作者：cxf54188</span><span class="sep">|</span>
  <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2322c55e' stroke='%2316a34a' stroke-width='2'/%3E%3Cpath d='M20 35 Q32 42 46 33' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='24' r='3.5' fill='%23fff'/%3E%3Ccircle cx='42' cy='24' r='3.5' fill='%23fff'/%3E%3Ccircle cx='22' cy='24' r='1.5' fill='%2316a34a'/%3E%3Ccircle cx='42' cy='24' r='1.5' fill='%2316a34a'/%3E%3C/svg%3E" alt="YB" style="background:#22c55e;">
  <span>辅助：元宝AI</span>
</div>
<div id="info"><span id="moves">步数: 0</span><span id="pairs">配对: 0</span><span id="best">最佳: -</span></div>
<div id="board"></div>
<div id="overlay">
  <h1>🎴 记忆翻牌</h1>
  <p>翻开两张相同的牌即可配对<br>用最少步数完成挑战</p>
  <div id="diff">
    <button class="active" data-d="easy">简单 4×3</button>
    <button data-d="medium">中等 6×4</button>
    <button data-d="hard">困难 8×6</button>
  </div>
  <button id="btn">开始游戏</button>
</div>
</div>
<script>
(function(){
const board=document.getElementById('board');
const ov=document.getElementById('overlay'),btn=document.getElementById('btn');
const movesEl=document.getElementById('moves'),pairsEl=document.getElementById('pairs'),bestEl=document.getElementById('best');
const EMOJIS=['🐶','🐱','🦊','🐻','🐼','🦁','🐯','🐸','🐵','🦄','🐷','🐮','🐔','🐧','🦉','🦋','🌸','🌳','🌞','🌙','⭐','🍎','🍊','🍇'];

let diff='easy',rows,cols,pairs,deck,cards,first,second,moves,matched,busy,running;

function loadBest(){const b=localStorage.getItem('mem_best_'+diff);return b?+b:null}
function saveBest(m){localStorage.setItem('mem_best_'+diff,m)}
function updateBest(){const b=loadBest();bestEl.textContent='最佳: '+(b?b:'-')}

function reset(){
  const d={easy:[4,3],medium:[6,4],hard:[8,6]}[diff];
  cols=d[0];rows=d[1];pairs=cols*rows/2;
  board.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  moves=0;matched=0;first=null;second=null;busy=false;
  movesEl.textContent='步数: 0';pairsEl.textContent='配对: 0';updateBest();
  const symbols=EMOJIS.slice(0,pairs);
  deck=[];symbols.forEach(s=>{deck.push(s);deck.push(s)});
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
  board.innerHTML='';
  cards=[];
  for(let i=0;i<rows;i++)for(let j=0;j<cols;j++){
    const idx=i*cols+j;
    const card=document.createElement('div');
    card.className='card';
    card.innerHTML=`<div class="face front"></div><div class="face back" style="background:linear-gradient(135deg,#f093fb,#f5576c)">${deck[idx]}</div>`;
    card.addEventListener('click',()=>onFlip(idx,card));
    board.appendChild(card);
    cards.push(card);
  }
}
function onFlip(idx,card){
  if(!running||busy)return;
  if(card.classList.contains('flipped')||card.classList.contains('matched'))return;
  card.classList.add('flipped');
  if(!first){first={idx,card};return}
  second={idx,card};moves++;movesEl.textContent='步数: '+moves;
  const s1=deck[first.idx],s2=deck[second.idx];
  if(s1===s2){
    matched++;pairsEl.textContent='配对: '+matched;
    // 保持翻开状态 + 加 matched 样式
    first.card.classList.add('matched');second.card.classList.add('matched');
    first=null;second=null;
    if(matched===pairs){running=false;const b=loadBest();if(!b||moves<b)saveBest(moves);updateBest();setTimeout(win,400)}
  }else{
    busy=true;
    // 短暂显示后翻回去
    setTimeout(()=>{
      first.card.classList.add('wrong');
      second.card.classList.add('wrong');
      setTimeout(()=>{
        first.card.classList.remove('flipped','wrong');
        second.card.classList.remove('flipped','wrong');
        first=null;second=null;busy=false;
      },300);
    },800);
  }
}
function win(){
  window._lastScore = moves;
  showScoreDialog(moves);
  ov.style.display='flex';
  ov.innerHTML='<h1>🎉 恭喜过关！</h1>...';
}
document.querySelectorAll('#diff button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('#diff button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');diff=b.dataset.d;
  });
});
btn.addEventListener('click',()=>{ov.style.display='none';reset();running=true});
updateBest();reset();running=true;
})();
</script>
<!-- 提交分数弹窗 -->
<div class="score-dialog" id="scoreDialog">
  <div class="box">
    <h2>🏆 游戏结束</h2>
    <p id="finalScore" style="color:#fff;font-size:14px"></p>
    <button onclick="loginAndSubmit()" style="background:#24292e;color:#fff;border:1px solid #555">
      🐙 用 GitHub 登录提交
    </button>
    <p class="status" id="submitStatus"></p>
  </div>
</div>

<script>
const GAME_KEY = 'mem';
const CLIENT_ID = 'Ov23liUtg4iRn8uimlnC';

function showScoreDialog(score) {
  window._lastScore = score;
  document.getElementById('finalScore').textContent = '得分: ' + score;
  document.getElementById('scoreDialog').classList.add('show');
}

function loginAndSubmit() {
  localStorage.setItem('pending_game', GAME_KEY);
  localStorage.setItem('pending_score', String(window._lastScore));
  const redirect = encodeURIComponent('https://cxf54188.github.io/blog/games/oauth-callback.html');
  location.href = `https://github.com/login/oauth/authorize?client_id=${CLIENT_ID}&redirect_uri=${redirect}&scope=read:user`;
}
</script>
</body>
</html>
