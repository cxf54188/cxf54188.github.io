<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>牛头王</title>
<link rel="stylesheet" href="./_common.css">
<style>
body{display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:8px}
#rows{display:flex;flex-direction:column;gap:6px;padding:10px;max-width:500px;width:100%}
.row{display:flex;gap:3px;align-items:center;padding:4px;background:rgba(255,255,255,.03);border-radius:6px;min-height:36px;flex-wrap:wrap}
.row-num{font-size:11px;color:#64748b;width:16px}
.ncard{width:28px;height:36px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:white;cursor:default}
.hud{display:flex;gap:12px;margin:6px 0;font-size:13px;color:#94a3b8;flex-wrap:wrap;justify-content:center}
.hud b{color:#4fc3f7}
#myHand{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;padding:6px;min-height:50px}
.mcard{width:36px;height:48px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:white;cursor:pointer;border:2px solid rgba(255,255,255,.2);user-select:none}
.mcard:hover{transform:translateY(-3px)}
.mcard.sel{transform:translateY(-8px);border-color:#4fc3f7}
</style>
</head>
<body>
<a class="back-link" href="../../index.html">← 返回主页</a>
<div id="topbar"></div>
<h1 style="font-size:22px;margin:6px 0">🐂 牛头王</h1>
<div class="hud">
  <span>你：<b id="ys">0</b> 🐂</span>
  <span>AI：<b id="as">0</b> 🐂</span>
  <span>状态：<b id="st">选牌</b></span>
</div>
<div id="rows"></div>
<div id="myHand"></div>
<button class="btn btn-sm btn-danger" id="restart" style="margin-top:8px">重来</button>
<p style="color:#64748b;font-size:12px;margin-top:6px">放牌到末端数字最近但更小的行，收牛头扣分</p>

<script src="./_common.js"></script>
<script>
const topbar=document.getElementById('topbar');topbar.innerHTML=makeTopbar();
let rows,myHand,aiHand,curRound,selected,over,bullMy,bullAi;

function makeDeck(){const d=[];for(let i=1;i<=104;i++){let bulls=1;if(i%11===0)bulls++;if(i%10===0)bulls++;if(i%5===0)bulls++;d.push({n:i,bulls})}return shuffle(d)}
function reset(){const deck=makeDeck();myHand=deck.slice(0,10);aiHand=deck.slice(10,20);rows=[[deck[20]],[deck[21]],[deck[22]],[deck[23]]];bullMy=0;bullAi=0;curRound=0;over=false;selected=null;render()}
function cardColor(n){if(n<=10)return'#34d399';if(n<=30)return'#3b82f6';if(n<=60)return'#f97316';if(n<=80)return'#a78bfa';return'#e53e3e'}
function findRow(n){let best=null,bestDiff=999;for(const r of rows){const top=r[r.length-1].n;if(top<n&&n-top<bestDiff){bestDiff=n-top;best=r}}return best}
function render(){const rc=document.getElementById('rows');rc.innerHTML=rows.map((r,ri)=>`<div class="row"><span class="row-num">${ri+1}</span>${r.map(c=>`<div class="ncard" style="background:${cardColor(c.n)}">${c.n}<small style="font-size:8px;display:block">${'🐂'.repeat(c.bulls)}</small></div>`).join('')}</div>`).join('');const h=document.getElementById('myHand');h.innerHTML=myHand.map((c,i)=>`<div class="mcard ${selected===i?'sel':''}" style="background:${cardColor(c.n)}" data-i="${i}">${c.n}</div>`).join('');h.querySelectorAll('.mcard').forEach(el=>el.onclick=()=>{selected=+el.dataset.i;render()});document.getElementById('ys').textContent=bullMy;document.getElementById('as').textContent=bullAi;document.getElementById('st').textContent=over?(bullMy<bullAi?'🎉 你赢了！':'💀 AI 赢了'):'选一张牌放下'}
function playRound(){if(selected===null)return;const myC=myHand.splice(selected,1)[0];const aiC=aiHand.splice(Math.floor(Math.random()*aiHand.length),1)[0];const all=[{card:myC,who:'you'},{card:aiC,who:'ai'}].sort((a,b)=>a.card.n-b.card.n);let played=0;const playNext=()=>{if(played>=2||over){selected=null;if(myHand.length===0)endGame();else render();return}const{card,who}=all[played++];const row=findRow(card.n);if(row&&row.length<5){row.push(card);playNext()}else{// 收牌
  if(who==='you'){bullMy+=row.reduce((s,c)=>s+c.bulls,0);rows[rows.indexOf(row)]=[card];document.getElementById('st').textContent=`💀 你收了${row.length}张牌`}else{bullAi+=row.reduce((s,c)=>s+c.bulls,0);rows[rows.indexOf(row)]=[card];document.getElementById('st').textContent=`💀 AI 收了${row.length}张牌`}render();setTimeout(playNext,800)}};playNext()}
function endGame(){over=true;render()}
document.getElementById('myHand').addEventListener('click',e=>{if(over)return;if(e.target.classList.contains('mcard')&&selected!==null)playRound()});
document.getElementById('restart').onclick=reset;
reset();
</script>
</body></html>
