<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>卡坦岛</title>
<link rel="stylesheet" href="_common.css">
<style>
.hex-board { display:grid; grid-template-columns:repeat(5,60px); gap:2px; justify-content:center; margin:10px 0; }
.hex { width:60px; height:52px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; border-radius:4px; cursor:pointer; color:#fff; font-weight:600; }
.hex:hover { filter:brightness(1.3); }
.hex.built { opacity:0.5; cursor:not-allowed; }
.res-row { display:flex; gap:8px; justify-content:center; margin:8px 0; flex-wrap:wrap; }
.res { padding:4px 10px; border-radius:6px; font-size:13px; font-weight:600; color:#fff; }
.built-row { display:flex; gap:6px; justify-content:center; margin:8px 0; flex-wrap:wrap; }
.bld { width:36px; height:36px; border-radius:50%; border:2px solid #fff; display:flex; align-items:center; justify-content:center; font-size:18px; }
.btn { display:inline-block; padding:8px 20px; border-radius:8px; border:none; font-size:14px; font-weight:600; cursor:pointer; background:linear-gradient(135deg,#4fc3f7,#a78bfa); color:#0a0e27; font-family:inherit; }
.btn:hover { transform:scale(1.05); }
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center; }
.overlay h2 { font-size:22px; margin-bottom:10px; color:#a78bfa; }
.overlay p { color:#cbd5e1; font-size:13px; line-height:1.8; max-width:380px; }
</style>
</head>
<body>
<div class="topbar">
  <a href="index.html" style="color:#7C4DFF;font-size:18px;margin-right:8px">←</a>
  <img class="avatar" src="../../img/avatar.png" alt="cxf54188" onerror="this.style.display='none'">
  <span class="author">作者：cxf54188</span><span class="sep">|</span><span class="author">🤖 辅助：元宝AI</span>
</div>
<div class="game-container">
  <h2 class="game-title">🏝️ 卡坦岛（简化版）</h2>
  <div class="info-bar"><span id="turnInfo">你的回合</span><span class="score" id="ptsInfo">你:0 AI:0</span></div>
  <div class="res-row" id="myRes"></div>
  <div class="hex-board" id="board"></div>
  <div class="built-row" id="built"></div>
  <div class="msg" id="msg">点击「掷骰子」开始</div>
  <div style="text-align:center;margin-top:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
    <button class="btn" id="rollBtn">🎲 掷骰子</button>
    <button class="btn" id="restartBtn" style="background:linear-gradient(135deg,#64748b,#475569);color:#fff">重新开始</button>
  </div>
</div>
<div class="overlay" id="overlay">
  <h2>🏝️ 卡坦岛</h2>
  <p>掷骰子获取资源<br>用资源建造定居点（需各1个）<br>先达5分获胜（简化版）</p>
  <button class="btn" id="startBtn">开始游戏</button>
</div>
<script>
const RES=['wood','brick','sheep','wheat','ore'];
const RES_COLORS={wood:'#4CAF50',brick:'#E64A19',sheep:'#AED581',wheat:'#FDD835',ore:'#78909C'};
const RES_ICON={wood:'🌲',brick:'🧱',sheep:'🐑',wheat:'🌾',ore:'⛏️'};

let board,myRes,aiRes,myPts,aiPts,cur,diceRolled,built,gameOver;

function startGame(){
  document.getElementById('overlay').style.display='none';
  // 5x5 hex网格，6种类型（含desert）
  const types=['wood','wood','wood','brick','brick','sheep','sheep','sheep','wheat','wheat','wheat','ore','ore','desert'];
  board=[];
  for(let i=0;i<25;i++){
    const t=types[i%types.length];
    board.push({type:t,num:(i%11)+2});
  }
  for(let i=board.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[board[i],board[j]]=[board[j],board[i]];}
  myRes={wood:0,brick:0,sheep:0,wheat:0,ore:0};
  aiRes={wood:0,brick:0,sheep:0,wheat:0,ore:0};
  myPts=0;aiPts=0;cur=0;diceRolled=false;built=[];gameOver=false;
  render();
  setTurn('你的回合 - 掷骰子');
}

function rollDice(){
  if(diceRolled||gameOver||cur!==0)return;
  const d1=Math.floor(Math.random()*6)+1,d2=Math.floor(Math.random()*6)+1;
  const sum=d1+d2;
  let gained=false;
  board.forEach((h,idx)=>{
    if(h.type==='desert')return;
    if(h.num===sum&&!built.includes(idx)){
      myRes[h.type]++;
      gained=true;
    }
  });
  diceRolled=true;
  if(gained)setMsg(`掷出 ${sum}，获得资源！点击空格建造`);
  else setMsg(`掷出 ${sum}，无资源（该数字格已被占）`);
  render();
  if(canBuild(myRes)&&built.length<5){
    // 玩家可以建造
  }else{
    setTimeout(endTurn,1200);
  }
}

function canBuild(res){return RES.every(r=>res[r]>0);}

function buildAt(idx){
  if(cur!==0||!diceRolled||gameOver)return;
  if(built.includes(idx)){setMsg('此处已有建筑');return;}
  if(!canBuild(myRes)){setMsg('资源不够！需要各1个');return;}
  RES.forEach(r=>myRes[r]--);
  built.push(idx);myPts++;
  setMsg('🏠 建造完成！+' + myPts + '分');
  render();
  if(myPts>=5){gameOver=true;setMsg('🎉 你赢了！');return;}
  setTimeout(endTurn,800);
}

function endTurn(){
  if(cur===0){cur=1;diceRolled=false;setTimeout(aiTurn,600);}
  else{cur=0;diceRolled=false;setTurn('你的回合 - 掷骰子');}
}

function aiTurn(){
  if(gameOver)return;
  const d1=Math.floor(Math.random()*6)+1,d2=Math.floor(Math.random()*6)+1;
  const sum=d1+d2;
  let gained=false;
  board.forEach((h,idx)=>{
    if(h.type==='desert'||built.includes(idx))return;
    if(h.num===sum){aiRes[h.type]++;gained=true;}
  });
  if(canBuild(aiRes)&&aiPts<5){
    RES.forEach(r=>aiRes[r]--);
    let empty;do{empty=Math.floor(Math.random()*25);}while(built.includes(empty));
    built.push(empty);aiPts++;
  }
  render();
  if(aiPts>=5){gameOver=true;setMsg('😢 AI赢了');return;}
  cur=0;diceRolled=false;setTurn('你的回合 - 掷骰子');
}

function render(){
  // 资源
  const mr=document.getElementById('myRes');mr.innerHTML='';
  RES.forEach(r=>{if(myRes[r]>0){const s=document.createElement('span');s.className='res';s.style.background=RES_COLORS[r];s.textContent=RES_ICON[r]+myRes[r];mr.appendChild(s);}});
  // 棋盘
  const b=document.getElementById('board');b.innerHTML='';
  board.forEach((h,idx)=>{
    const d=document.createElement('div');d.className='hex'+(built.includes(idx)?' built':'');
    if(h.type==='desert')d.style.background='#fdd835';
    else d.style.background=RES_COLORS[h.type]||'#666';
    d.innerHTML=`<span>${RES_ICON[h.type]||'🏜️'}</span><span>${h.num}</span>`;
    if(cur===0&&diceRolled&&canBuild(myRes)&&!built.includes(idx)&&h.type!=='desert')d.onclick=()=>buildAt(idx);
    b.appendChild(d);
  });
  // 建筑
  const bt=document.getElementById('built');bt.innerHTML='';
  built.forEach(idx=>{const s=document.createElement('span');s.className='bld';s.textContent='🏠';s.style.background=RES_COLORS[board[idx].type]||'#666';bt.appendChild(s);});
  document.getElementById('ptsInfo').textContent=`你:${myPts} AI:${aiPts}`;
  document.getElementById('rollBtn').disabled=cur!==0||diceRolled||gameOver;
}

function setMsg(m){document.getElementById('msg').textContent=m;}
function setTurn(t){document.getElementById('turnInfo').textContent=t;}

document.getElementById('rollBtn').onclick=rollDice;
document.getElementById('restartBtn').onclick=startGame;
document.getElementById('startBtn').onclick=()=>{
  document.getElementById('overlay').style.display='none';
  setTimeout(startGame,100);
};
</script>
</body>
</html>
