<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>UNO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#0a0e27,#1a1a3e);min-height:100vh;color:#fff;overflow:hidden}
.topbar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(0,0,0,.6);position:sticky;top:0;z-index:999;border-bottom:1px solid rgba(255,255,255,.08)}
.topbar .avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;border:2px solid #4fc3f7}
.topbar .info{font-size:12px;color:#94a3b8}
.topbar .info b{color:#e2e8f0}
.topbar .yb{width:22px;height:22px;border-radius:50%;background:#00a86b;display:inline-flex;align-items:center;justify-content:center;font-size:12px;vertical-align:middle;margin-right:2px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.overlay h2{font-size:22px;margin-bottom:10px;color:#4fc3f7}
.overlay .rules{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:14px 18px;max-width:400px;margin-bottom:16px;text-align:left;font-size:13px;line-height:1.8;color:#cbd5e1}
.overlay .rules b{color:#4fc3f7}
.btn{display:inline-block;padding:10px 28px;border-radius:10px;border:none;font-size:15px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#4fc3f7,#a78bfa);color:#0a0e27;font-family:inherit}
.btn:hover{transform:scale(1.05)}
.btn-sm{padding:6px 14px;font-size:13px;border-radius:8px}
#game{display:none;height:calc(100vh - 42px);flex-direction:column;align-items:center;justify-content:center;padding:10px}
.center-area{display:flex;align-items:center;gap:16px;margin:10px 0}
.deck{width:70px;height:100px;border-radius:10px;background:linear-gradient(135deg,#1e3a5f,#0f766e);border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;user-select:none;position:relative}
.deck::after{content:'UNO';position:absolute;font-size:14px;font-weight:700;color:#fff;text-shadow:0 0 4px #000}
.deck:hover{transform:scale(1.08);box-shadow:0 0 16px rgba(79,195,247,.5)}
.deck.disabled{opacity:.4;cursor:not-allowed}
.discard{width:70px;height:100px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;color:#fff;border:2px solid rgba(255,255,255,.3)}
.color-pick{display:none;gap:8px;margin-top:8px}
.color-pick .cp{width:36px;height:36px;border-radius:50%;cursor:pointer;border:2px solid #fff}
.cp.red{background:#ef4444}.cp.green{background:#22c55e}.cp.blue{background:#3b82f6}.cp.yellow{background:#eab308}
.hand{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;max-width:95vw;min-height:90px}
.card{width:54px;height:80px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;border:2px solid rgba(255,255,255,.3);cursor:pointer;user-select:none;transition:.15s;position:relative}
.card:hover{transform:translateY(-6px) scale(1.08);box-shadow:0 6px 16px rgba(0,0,0,.4)}
.card.playable{border-color:#4fc3f7;box-shadow:0 0 10px rgba(79,195,247,.5)}
.card.wild{background:linear-gradient(135deg,#ef4444,#eab308,#22c55e,#3b82f6)!important}
.card.red{background:#ef4444}.card.green{background:#22c55e}.card.blue{background:#3b82f6}.card.yellow{background:#eab308}
.card .label{font-size:10px;position:absolute;bottom:3px;right:4px;opacity:.8}
.msg{font-size:14px;color:#cbd5e1;margin:6px 0;min-height:20px;text-align:center}
.ai-hands{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;justify-content:center}
.ai-hand{display:flex;align-items:center;gap:4px;font-size:12px;color:#94a3b8;background:rgba(255,255,255,.04);padding:3px 8px;border-radius:6px}
.ai-hand .dot{width:8px;height:8px;border-radius:50%;background:#4fc3f7}
.ai-hand.active .dot{background:#ef4444;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.dir-arrow{font-size:20px;margin:0 4px;color:#fbbf24}
</style>
</head>
<body>
<div class="topbar">
  <img class="avatar" src="../../img/avatar.png" alt="cxf54188" onerror="this.style.display='none'">
  <div class="info"><b>作者：cxf54188</b> &nbsp;|&nbsp; <span class="yb">🤖</span><b>辅助：元宝AI</b></div>
</div>
<div class="overlay" id="overlay">
  <h2>🎴 UNO</h2>
  <div class="rules">
    <b>目标：</b>先把手牌出完<br>
    <b>规则：</b>出牌需匹配桌面牌的<b>颜色或数字</b><br>
    <b>功能牌：</b>跳过⏭ 反转🔄 +2抽牌<br>
    <b>万能牌：</b>变色🎨 +4抽牌（只能在没有可出牌时出）<br>
    <b>操作：</b>点击手牌出牌，点牌堆抽牌<br>
    <b>UNO！</b>剩1张时记得喊（自动处理）
  </div>
  <button class="btn" id="startBtn">开始游戏</button>
</div>
<div id="game">
  <div class="ai-hands" id="aiHands"></div>
  <div class="center-area">
    <div class="deck" id="deck" title="抽牌">🂠</div>
    <div class="discard" id="discard"></div>
    <div class="dir-arrow" id="dir">➡️</div>
  </div>
  <div class="color-pick" id="colorPick">
    <div class="cp red" data-c="red"></div>
    <div class="cp green" data-c="green"></div>
    <div class="cp blue" data-c="blue"></div>
    <div class="cp yellow" data-c="yellow"></div>
  </div>
  <div class="msg" id="msg">你的回合</div>
  <div class="hand" id="hand"></div>
</div>
<script>
const COLORS=['red','green','blue','yellow'];
const NAMES={red:'红',green:'绿',blue:'蓝',yellow:'黄'};
let deck=[],discard=[],hands=[],current=0,dir=1,currentColor=null,wildPick=false,gameOver=false;

function buildDeck(){
  const d=[];
  for(const c of COLORS){
    d.push({color:c,value:'0'});
    for(let i=1;i<=9;i++){d.push({color:c,value:String(i)});d.push({color:c,value:String(i)});}
    for(const s of ['skip','reverse','+2']){d.push({color:c,value:s});d.push({color:c,value:s});}
  }
  for(let i=0;i<4;i++){d.push({color:'wild',value:'wild'});d.push({color:'wild',value:'+4'});}
  return d;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function topCard(){return discard[discard.length-1];}
function cardText(c){if(c.value==='wild')return '🎨';if(c.value==='+4')return '+4';if(c.value==='skip')return '⏭';if(c.value==='reverse')return '🔄';if(c.value==='+2')return '+2';return c.value;}
function cardMatches(c,top){
  if(c.color==='wild')return true;
  if(currentColor && c.color===currentColor)return true;
  if(c.color===top.color && top.color!=='wild')return true;
  if(c.value===top.value)return true;
  return false;
}
function canPlay(c){return cardMatches(c,topCard());}
function drawCard(n){for(let i=0;i<n;i++){if(deck.length===0){deck=shuffle(discard.splice(0,discard.length-1));discard.push(deck.pop());}hands[current].push(deck.pop());}}

function startGame(){
  deck=shuffle(buildDeck());
  discard=[];
  hands=[[]]; // 0=玩家, 1-2=AI
  for(let i=0;i<3;i++) hands.push([]);
  for(let i=0;i<7;i++){for(let p=0;p<3;p++) hands[p].push(deck.pop());}
  // 确保首发不是wild
  let first;
  do{first=deck.pop();}while(first.color==='wild');
  discard.push(first);
  currentColor=first.color;
  current=0;dir=1;gameOver=false;wildPick=false;
  document.getElementById('game').style.display='flex';
  render();
}

function render(){
  // 桌面牌
  const top=topCard();
  const dc=document.getElementById('discard');
  dc.style.background=top.color==='wild'?(currentColor||'#666'):(top.color==='red'?'#ef4444':top.color==='green'?'#22c55e':top.color==='blue'?'#3b82f6':'#eab308');
  dc.textContent=cardText(top);
  // 牌堆
  const dk=document.getElementById('deck');
  dk.classList.toggle('disabled',current!==0||wildPick);
  // AI
  const ah=document.getElementById('aiHands');
  ah.innerHTML='';
  for(let i=1;i<=2;i++){
    const div=document.createElement('div');
    div.className='ai-hand'+(current===i?' active':'');
    div.innerHTML=`<span class="dot"></span>AI${i}（${hands[i].length}张）`;
    ah.appendChild(div);
  }
  // 方向
  document.getElementById('dir').textContent=dir===1?'➡️':'⬅️';
  // 消息
  const msg=document.getElementById('msg');
  if(gameOver){msg.textContent='游戏结束！';return;}
  if(wildPick){msg.textContent='请选择颜色 ▼';return;}
  if(current===0)msg.textContent='你的回合 — 点击手牌出牌，或点牌堆抽牌';
  else msg.textContent=`AI${current} 思考中...`;
  // 手牌
  const hand=document.getElementById('hand');
  hand.innerHTML='';
  hands[0].forEach((c,i)=>{
    const div=document.createElement('div');
    div.className='card '+(c.color==='wild'?'wild':c.color)+(canPlay(c)?' playable':'');
    div.innerHTML=cardText(c)+`<span class="label">${c.color!=='wild'?NAMES[c.color]:''}</span>`;
    div.onclick=()=>{if(current===0&&!wildPick)playCard(0,i);};
    hand.appendChild(div);
  });
}

function playCard(player,idx){
  const c=hands[player].splice(idx,1)[0];
  discard.push(c);
  const top=topCard();
  // 特效
  if(c.value==='skip'){current=(current+dir+2)%3;}
  else if(c.value==='reverse'){dir*=-1;current=(current+dir+2)%3;}
  else if(c.value==='+2'){current=(current+dir+3)%3;drawCardTo(current,2);}
  else if(c.value==='wild'){if(player===0){wildPick=true;document.getElementById('colorPick').style.display='flex';render();return;}else{currentColor=COLORS[Math.floor(Math.random()*4)];}}
  else if(c.value==='+4'){if(player===0){wildPick=true;document.getElementById('colorPick').style.display='flex';render();return;}else{currentColor=COLORS[Math.floor(Math.random()*4)];current=(current+dir+3)%3;drawCardTo(current,4);}}
  else{current=(current+dir+3)%3;}
  // 检查胜负
  if(hands[player].length===0){gameOver=true;render();setTimeout(()=>alert((player===0?'你赢了！🎉':'AI'+player+'赢了😢')),100);return;}
  // UNO喊叫（AI自动）
  if(hands[player].length===1&&player!==0){/* AI自动喊UNO */}
  render();
  if(current!==0&&!gameOver)setTimeout(aiTurn,800);
}

function drawCardTo(player,n){
  for(let i=0;i<n;i++){
    if(deck.length===0){deck=shuffle(discard.splice(0,discard.length-1));discard.push(deck.pop());}
    hands[player].push(deck.pop());
  }
}

function aiTurn(){
  if(gameOver||wildPick)return;
  const ai=current;
  // 找可出的牌
  const playable=[];
  hands[ai].forEach((c,i)=>{if(canPlay(c))playable.push(i);});
  if(playable.length>0){
    // 优先出功能牌/高价值
    playable.sort((a,b)=>{
      const va=hands[ai][a],vb=hands[ai][b];
      const sa=(va.value==='+4'?10:va.value==='wild'?9:va.value==='+2'?8:va.value==='skip'?7:va.value==='reverse'?6:0);
      const sb=(vb.value==='+4'?10:vb.value==='wild'?9:vb.value==='+2'?8:vb.value==='skip'?7:vb.value==='reverse'?6:0);
      return sb-sa;
    });
    playCard(ai,playable[0]);
  }else{
    drawCardTo(ai,1);
    // 检查抽到的能不能出
    const last=hands[ai].length-1;
    if(canPlay(hands[ai][last])){setTimeout(()=>playCard(ai,last),500);return;}
    current=(current+dir+3)%3;
    render();
    if(current!==0&&!gameOver)setTimeout(aiTurn,800);
  }
}

// 颜色选择
document.getElementById('colorPick').addEventListener('click',e=>{
  if(!e.target.classList.contains('cp')||!wildPick)return;
  currentColor=e.target.dataset.c;
  wildPick=false;
  document.getElementById('colorPick').style.display='none';
  // wild/+4 出完后转移回合
  const top=topCard();
  if(top.value==='+4'){current=(current+dir+3)%3;drawCardTo(current,4);}
  current=(current+dir+3)%3;
  render();
  if(current!==0&&!gameOver)setTimeout(aiTurn,800);
});

// 抽牌
document.getElementById('deck').addEventListener('click',()=>{
  if(current!==0||wildPick||gameOver)return;
  // 检查是否有可出的牌
  const hasPlayable=hands[0].some(c=>canPlay(c));
  if(hasPlayable){document.getElementById('msg').textContent='你还有可出的牌！请先出牌';return;}
  drawCardTo(0,1);
  render();
  // 出完牌后如果还不能出，回合结束
  setTimeout(()=>{
    if(current===0&&!gameOver){
      const stillPlayable=hands[0].some(c=>canPlay(c));
      if(!stillPlayable){current=(current+dir+3)%3;render();if(current!==0&&!gameOver)setTimeout(aiTurn,800);}
    }
  },400);
});

document.getElementById('startBtn').addEventListener('click',()=>{
  document.getElementById('overlay').style.display='none';
  setTimeout(startGame,100);
});
</script>
</body>
</html>
