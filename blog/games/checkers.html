<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>跳棋</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#450a0a,#1c1917);min-height:100vh;color:#fff;overflow:hidden}
.topbar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(0,0,0,.6);position:sticky;top:0;z-index:999;border-bottom:1px solid rgba(255,255,255,.08)}
.topbar .avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;border:2px solid #4fc3f7}
.topbar .info{font-size:12px;color:#fca5a5}
.topbar .info b{color:#fecaca}
.topbar .yb{width:22px;height:22px;border-radius:50%;background:#00a86b;display:inline-flex;align-items:center;justify-content:center;font-size:12px;vertical-align:middle;margin-right:2px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.overlay h2{font-size:22px;margin-bottom:10px;color:#f87171}
.overlay .rules{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:14px 18px;max-width:400px;margin-bottom:16px;text-align:left;font-size:13px;line-height:1.8;color:#fecaca}
.overlay .rules b{color:#f87171}
.btn{display:inline-block;padding:10px 28px;border-radius:10px;border:none;font-size:15px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#f87171,#dc2626);color:#fff;font-family:inherit}
.btn:hover{transform:scale(1.05)}
#game{display:none;height:calc(100vh - 42px);flex-direction:column;align-items:center;justify-content:center;padding:6px}
canvas{border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5);background:#8B4513}
.msg{font-size:13px;color:#fecaca;margin:4px 0;min-height:18px;text-align:center}
.scores{display:flex;gap:16px;font-size:12px;color:#fca5a5}
</style>
</head>
<body>
<div class="topbar">
  <img class="avatar" src="../../img/avatar.png" alt="cxf54188" onerror="this.style.display='none'">
  <div class="info"><b>作者：cxf54188</b> &nbsp;|&nbsp; <span class="yb">🤖</span><b>辅助：元宝AI</b></div>
</div>
<div class="overlay" id="overlay">
  <h2>🔴 跳棋</h2>
  <div class="rules">
    <b>目标：</b>把所有棋子跳到对方阵地<br>
    <b>规则：</b><br>
    ① <b>走一步</b>：斜线移动到相邻空格<br>
    ② <b>跳棋</b>：跳过相邻棋子到后方空格（可连跳）<br>
    ③ 跳过对方棋子 → <b>吃掉</b>！<br>
    <b>升王：</b>到达底线 → 加⭐，可前后跳<br>
    <b>操作：</b>点选棋子（高亮）→ 点目标格
  </div>
  <button class="btn" id="startBtn">开始游戏</button>
</div>
<div id="game">
  <div class="scores"><span id="sc0">你：12</span><span id="sc1">AI：12</span></div>
  <canvas id="c" width="480" height="480"></canvas>
  <div class="msg" id="msg">点选你的棋子</div>
</div>
<script>
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const N=8,SIZE=60;
let board,current,selected,mustJump,gameOver,multiJump;

function emptyBoard(){
  const b=[];for(let r=0;r<N;r++){b[r]=[];for(let c=0;c<N;c++)b[r][c]=null;}
  return b;
}

function startGame(){
  board=emptyBoard();
  for(let r=0;r<3;r++)for(let c=0;c<N;c++)if((r+c)%2===1)board[r][c]={color:'white',king:false};
  for(let r=5;r<8;r++)for(let c=0;c<N;c++)if((r+c)%2===1)board[r][c]={color:'black',king:false};
  current='white';selected=null;mustJump=false;gameOver=false;multiJump=null;
  document.getElementById('game').style.display='flex';
  render();
}

function getPieces(color){
  const ps=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(board[r][c]&&board[r][c].color===color)ps.push({r,c});
  return ps;
}

function getMoves(r,c){
  const p=board[r][c];if(!p)return[];
  const moves=[],jumps=[];
  const dirs=p.king?[[-1,-1],[-1,1],[1,-1],[1,1]]:p.color==='white'?[[-1,-1],[-1,1]]:[[1,-1],[1,1]];
  for(const [dr,dc] of dirs){
    const nr=r+dr,nc=c+dc;
    if(nr>=0&&nr<N&&nc>=0&&nc<N&&!board[nr][nc])moves.push({r:nr,c:nc,jump:false});
    const jr=r+dr*2,jc=c+dc*2;
    if(nr>=0&&nr<N&&nc>=0&&nc<N&&board[nr][nc]&&board[nr][nc].color!==p.color&&jr>=0&&jr<N&&jc>=0&&jc<N&&!board[jr][jc])jumps.push({r:jr,c:jc,jump:true,capture:{r:nr,c:nc}});
  }
  return{ moves, jumps};
}

function hasAnyJump(color){
  const ps=getPieces(color);
  for(const{p of ps){
    const{moves,jumps}=getMoves(p.r,p.c);
    if(jumps.length>0)return true;
  }
  return false;
}

function clickCell(r,c){
  if(gameOver||current!=='white')return;
  const p=board[r][c];
  if(multiJump){if(p&&p.color==='white'&&r===multiJump.r&&c===multiJump.c){selected={r,c};render();return;}if(selected){tryMove(selected.r,selected.c,r,c);}return;}
  if(mustJump){if(selected){tryMove(selected.r,selected.c,r,c);}return;}
  if(p&&p.color==='white'){selected={r,c};render();}
  else if(selected){tryMove(selected.r,selected.c,r,c);}
}

function tryMove(fr,fc,tr,tc){
  const p=board[fr][fc];if(!p)return;
  const{moves,jumps}=getMoves(fr,fc);
  const isJump=jumps.some(j=>j.r===tr&&j.c===tc);
  const isMove=moves.some(m=>m.r===tr&&m.c===tc);
  if(!isJump&&!isMove)return;
  board[tr][tc]=p;board[fr][fc]=null;
  if(isJump){
    const cap=jumps.find(j=>j.r===tr&&j.c===tc).capture;
    board[cap.r][cap.c]=null;
    // 检查是否还能跳
    const next=getMoves(tr,tc);
    if(next.jumps.length>0&&!isKing(tr,p)){multiJump={r:tr,c:tc};selected={r:tr,c:tc};render();return;}
  }
  // 升王
  if(p.color==='white'&&tr===0)p.king=true;
  if(p.color==='black'&&tr===N-1)p.king=true;
  selected=null;multiJump=null;
  // 检查对方是否还有棋
  if(getPieces('black').length===0){gameOver=true;setTimeout(()=>alert('🎉 你赢了！'),100);render();return;}
  // 切换
  current='black';
  render();
  setTimeout(aiTurn,700);
}

function isKing(r,p){return p.king||(p.color==='white'&&r===0)||(p.color==='black'&&r===N-1);}

function aiTurn(){
  if(gameOver)return;
  const canJump=hasAnyJump('black');
  const ps=getPieces('black');
  // 找所有合法移动
  let allMoves=[];
  ps.forEach(({r,c})=>{
    const{moves,jumps}=getMoves(r,c);
    jumps.forEach(j=>allMoves.push({fr:r,fc:c,tr:j.r,tc:j.c,cap:true}));
    if(!canJump)moves.forEach(m=>allMoves.push({fr:r,fc:c,tr:m.r,tc:m.c,cap:false}));
  });
  if(allMoves.length===0){gameOver=true;setTimeout(()=>alert('🎉 你赢了！AI无棋可走'),100);render();return;}
  // 优先吃子
  const caps=allMoves.filter(m=>m.cap);
  const pick=caps.length>0?caps[Math.floor(Math.random()*caps.length)]:allMoves[Math.floor(Math.random()*allMoves.length)];
  const p=board[pick.fr][pick.fc];
  board[pick.tr][pick.tc]=p;board[pick.fr][pick.fc]=null;
  if(pick.cap){
    // 找被吃的
    const mr=(pick.fr+pick.tr)/2,mc=(pick.fc+pick.tc)/2;
    board[mr][mc]=null;
  }
  if(pick.tr===N-1)p.king=true;
  // 检查胜负
  if(getPieces('white').length===0){gameOver=true;setTimeout(()=>alert('🤖 AI赢了'),100);render();return;}
  current='white';mustJump=false;selected=null;
  render();
}

function render(){
  // 画棋盘
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    ctx.fillStyle=(r+c)%2===0?'#DEB887':'#8B4513';
    ctx.fillRect(c*SIZE,r*SIZE,SIZE,SIZE);
  }
  // 高亮选中
  if(selected){ctx.strokeStyle='#4ade60';ctx.lineWidth=3;ctx.strokeRect(selected.c*SIZE+2,selected.r*SIZE+2,SIZE-4,SIZE-4);}
  // 画棋子
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const p=board[r][c];if(!p)continue;
    const cx=c*SIZE+SIZE/2,cy=r*SIZE+SIZE/2;
    ctx.beginPath();ctx.arc(cx,cy,SIZE/2-6,0,Math.PI*2);
    ctx.fillStyle=p.color==='white'?'#f8fafc':'#1c1917';
    ctx.fill();ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=2;ctx.stroke();
    if(p.king){ctx.fillStyle=p.color==='white'?'#fbbf24':'#fbbf24';ctx.font='16px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',cx,cy);}
  }
  // 分数
  document.getElementById('sc0').textContent='你：'+getPieces('white').length;
  document.getElementById('sc1').textContent='AI：'+getPieces('black').length;
  const msg=document.getElementById('msg');
  if(gameOver)return;
  if(current==='white'){
    if(multiJump)msg.textContent='连跳中 — 继续跳或点空格结束';
    else if(hasAnyJump('white'))msg.textContent='必须跳棋！点选可跳的棋子';
    else msg.textContent='你的回合 — 点选棋子再点目标格';
  }else msg.textContent='AI 思考中...';
  // 检查是否必须跳
  mustJump=hasAnyJump(current);
}

cvs.addEventListener('click',e=>{const r=cvs.getBoundingClientRect();const x=(e.clientX-r.left)*(cvs.width/r.width);const y=(e.clientY-r.top)*(cvs.height/r.height);clickCell(Math.floor(y/SIZE),Math.floor(x/SIZE));});

document.getElementById('startBtn').onclick=()=>{
  document.getElementById('overlay').style.display='none';
  setTimeout(startGame,100);
};
</script>
</body>
</html>
