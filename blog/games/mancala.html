<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>非洲播棋</title>
<link rel="stylesheet" href="./_common.css">
<style>
body{display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:8px}
#board{display:grid;grid-template-columns:repeat(8,44px);gap:4px;padding:10px;background:rgba(139,90,43,.2);border-radius:12px}
.pit{width:44px;height:44px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;cursor:pointer;background:rgba(101,67,33,.8);color:#e2e8f0;user-select:none;position:relative}
.pit:hover{background:rgba(139,90,43,.9)}
.pit.store{width:56px;height:90px;border-radius:10px;grid-row:span 2;background:rgba(218,165,32,.3)}
.pit .count{font-size:18px;font-weight:800}
.hud{display:flex;gap:12px;margin:6px 0;font-size:13px;color:#94a3b8}
.hud b{color:#4fc3f7}
</style>
</head>
<body>
<a class="back-link" href="../../index.html">← 返回主页</a>
<div id="topbar"></div>
<h1 style="font-size:22px;margin:6px 0">🌍 非洲播棋</h1>
<div class="hud"><span>你：<b id="ys">0</b></span><span>AI：<b id="as">0</b></span><span>回合：<b id="turn">你</b></span></div>
<div id="board"></div>
<button class="btn btn-sm btn-danger" id="restart" style="margin-top:10px">重新开始</button>
<p style="color:#64748b;font-size:12px;margin-top:6px">逆时针播种，落入己方大仓加分，落在空坑可捕获</p>

<script src="./_common.js"></script>
<script>
const topbar=document.getElementById('topbar');topbar.innerHTML=makeTopbar();
let pits,cur,over;
// 索引: 0-5 玩家坑, 6 玩家大仓, 7-12 AI坑, 13 AI大仓
function reset(){pits=Array(14).fill(4);pits[6]=0;pits[13]=0;cur='you';over=false;render()}
function render(){const b=document.getElementById('board');b.innerHTML='';// AI store
  const aiStore={count:pits[13],label:'AI大仓',cls:'pit store',click:false};// layout: row1 AI pits 12-7, row2 your pits 0-5, then stores
  // Top row: AI pits (12,11,10,9,8,7) + AI store on right
  // Bottom row: your pits (0,1,2,3,4,5) + your store on right
  // We'll do: top row right-to-left for AI, bottom row left-to-right for you
  const order=[12,11,10,9,8,7,13,0,1,2,3,4,5,6];
  // Actually let's layout as 2 rows of 7
  // Row 0 (AI): stores on left? Let's do: [AI-store][7][8][9][10][11][12] top
  // Row 1 (You): [0][1][2][3][4][5][You-store] bottom
  const layout=[13,7,8,9,10,11,12,0,1,2,3,4,5,6];
  layout.forEach(i=>{const d=document.createElement('div');d.className='pit'+(i===6||i===13?' store':'');const cnt=pits[i];d.innerHTML=`<span class="count">${cnt}</span>`;if(cur==='you'&&i>=0&&i<=5)d.onclick=()=>play(i);b.appendChild(d)})
  document.getElementById('ys').textContent=pits[6];document.getElementById('as').textContent=pits[13];document.getElementById('turn').textContent=over?'结束':(cur==='you'?'你':'AI')}
function play(idx){if(cur!=='you'||over||idx<0||idx>5||pits[idx]===0)return;let stones=pits[idx];pits[idx]=0;let i=idx;while(stones>0){i=(i+1)%14;if(i===13)continue;// skip opponent store
    pits[i]++;stones--}// capture
  if(i<=5&&pits[i]===1&&pits[12-i]>=1){pits[6]+=pits[i]+pits[12-i];pits[i]=0;pits[12-i]=0}checkEnd();if(!over){cur='ai';render();setTimeout(aiTurn,600)}}
function aiTurn(){if(over)return;const moves=[];for(let i=7;i<=12;i++)if(pits[i]>0)moves.push(i);if(!moves.length){checkEnd();return}const idx=moves[Math.floor(Math.random()*moves.length)];let stones=pits[idx];pits[idx]=0;let i=idx;while(stones>0){i=(i+1)%14;if(i===6)continue;pits[i]++;stones--}if(i>=7&&i<=12&&pits[i]===1&&pits[12-i]>=1){pits[13]+=pits[i]+pits[12-i];pits[i]=0;pits[12-i]=0}checkEnd();if(!over){cur='you';render()}}
function checkEnd(){let yEmpty=true,aEmpty=true;for(let i=0;i<=5;i++)if(pits[i])yEmpty=false;for(let i=7;i<=12;i++)if(pits[i])aEmpty=false;if(yEmpty||aEmpty){for(let i=0;i<=5;i++){pits[6]+=pits[i];pits[i]=0}for(let i=7;i<=12;i++){pits[13]+=pits[i];pits[i]=0}over=true;const y=pits[6],a=pits[13];setTimeout(()=>alert((y>a?'🎉 你赢了！':'💀 AI 赢了')+`\n你：${y} | AI：${a}`),100)}}
document.getElementById('restart').onclick=reset;
reset();
</script>
</body></html>
