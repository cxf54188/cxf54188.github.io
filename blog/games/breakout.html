<style>
*{margin:0;padding:0;box-sizing:border-box}

body{background:#0f0c29;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:system-ui,sans-serif;overflow:hidden}
#wrap{position:relative;width:400px;max-width:96vw;border-radius:14px;overflow:hidden;box-shadow:0 0 40px rgba(138,43,226,.5)}
#bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:rgba(0,0,0,.7);color:#fff;font-size:13px;position:relative;z-index:10}
#bar img{width:24px;height:24px;border-radius:50%;object-fit:cover}
#bar .sep{opacity:.5;margin:0 2px}

#game-area{position:relative;width:100%;aspect-ratio:2/3}
canvas{display:block;width:100%!important;height:100%!important;background:#0a0a1a;touch-action:none;cursor:none}
#msg{position:absolute;top:8px;left:0;right:0;text-align:center;color:#ff0;font-size:14px;font-weight:700;z-index:50;pointer-events:none;opacity:0;transition:opacity .3s;text-shadow:0 0 8px rgba(255,255,0,.5)}
#overlay{position:absolute;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);color:#fff;text-align:center;padding:20px}

<body>
<div id="wrap">
  <div id="bar">
    <img src="https://cdn.luogu.com.cn/upload/image_hosting/v70j6st4.png" alt="cxf" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2216%22 fill=%22%236a5acd%22/%3E%3Ctext x=%2216%22 y=%2222%22 text-anchor=%22middle%22 font-size=%2218%22 fill=%22%23fff%22%3Ec%3C/text%3E%3C/svg%3E'">
    <span>作者：cxf54188</span><span class="sep">|</span>
    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2322c55e' stroke='%2316a34a' stroke-width='2'/%3E%3Cpath d='M20 35 Q32 42 46 33' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='24' r='3.5' fill='%23fff'/%3E%3Ccircle cx='42' cy='24' r='3.5' fill='%23fff'/%3E%3Ccircle cx='22' cy='24' r='1.5' fill='%2316a34a'/%3E%3Ccircle cx='42' cy='24' r='1.5' fill='%2316a34a'/%3E%3C/svg%3E" alt="YB" style="background:#22c55e;">

  <div id="info">

  </div>
  <div id="game-area">
    <canvas id="c"></canvas>

      <p>← → 或鼠标移动挡板<br>打碎砖块得分，漏球扣命<br>打空一行 → 上方全下移 → 顶端补新行<br><br>特殊砖块外观与普砖一致<br>打碎后随机触发效果</p>
      <div class="legend">
        <span><i style="background:#ffd700"></i>3倍分</span>
        <span><i style="background:#00d2ff"></i>宽挡板</span>

      </div>

<script>
(function(){
'use strict';

// ===== 画布 =====
var cvs = document.getElementById('c');
var ctx = cvs.getContext('2d');
var W = 400, H = 600;
cvs.width = W;
cvs.height = H;

// ===== DOM =====
var ov       = document.getElementById('overlay');
var btn      = document.getElementById('btn');
var scoreEl  = document.getElementById('score');
var livesEl  = document.getElementById('lives');
var multEl   = document.getElementById('mult');
var msgEl    = document.getElementById('msg');

// ===== 常量 =====
var COLS = 8, BW = 44, BH = 18, GAP = 4, BTOP = 50;
var PADDLE_Y = 555;
var MAX_ROWS = 6;
var ROW_COLORS = ['#ff4757','#ff6348','#ffa502','#2ed573','#1e90ff','#a29bfe'];

var T_NORMAL=0, T_MULT=1, T_WIDE=2, T_BIG=3, T_MULTIBALL=4;
var TYPE_RATE = 0.22;

// ===== 核心数据结构 =====
// grid: { rowNum: [brick x8] }
// 行号 0=最顶端, 5=最底端
// 永远保持有砖块可打，打空一行立即补

var grid = {};

// ===== 游戏状态 =====
var balls = [], paddle = null;
var score=0, lives=3, mult=1, running=false, animId=null;
var mouseX=200, useMouse=false;
var wideTimer=0, bigTimer=0, multiTimer=0;

// ===== 工具 =====
function showMsg(text, dur){
  msgEl.textContent = text;
  msgEl.style.opacity = '1';
  clearTimeout(showMsg._t);
  showMsg._t = setTimeout(function(){ msgEl.style.opacity = '0'; }, dur||1200);
}

function randType(){
  return (Math.random() < TYPE_RATE) ? (1 + Math.floor(Math.random()*4)) : 0;
}

function rowToY(row){ return BTOP + row * (BH + GAP); }

function forEachAlive(fn){
  for(var k in grid){
    var arr = grid[k];
    for(var i=0;i<arr.length;i++){
      if(arr[i].alive) fn(arr[i]);
    }
  }
}

function countAlive(row){
  var arr = grid[row];
  if(!arr) return 0;
  var n = 0;
  for(var i=0;i<arr.length;i++) if(arr[i].alive) n++;
  return n;
}

function getAliveRows(){
  var arr = [];
  for(var k in grid){
    if(countAlive(+k) > 0) arr.push(+k);
  }
  arr.sort(function(a,b){return a-b;});
  return arr;
}

function totalAlive(){
  var n = 0;
  forEachAlive(function(){ n++; });
  return n;
}

// ===== 砖块 =====
function makeBrick(col, row){
  return {
    x: 16 + col * (BW + GAP),
    y: rowToY(row),
    w: BW, h: BH,
    row: row,
    type: randType(),
    alive: true
  };
}

function fillRow(row){
  var arr = [];
  for(var c=0;c<COLS;c++) arr.push(makeBrick(c, row));
  grid[row] = arr;
}

function initBricks(){
  grid = {};
  for(var r=0;r<MAX_ROWS;r++) fillRow(r);
}

// ===== 行下移 =====
function shiftRowsDown(clearedRow){
  // 从大到小处理，避免覆盖
  var toShift = getAliveRows().filter(function(r){return r < clearedRow;});
  toShift.sort(function(a,b){return b-a;});

  for(var s=0;s<toShift.length;s++){
    var oldR = toShift[s];
    var newR = oldR + 1;
    var arr = grid[oldR];
    for(var j=0;j<arr.length;j++){
      arr[j].row = newR;
      arr[j].y = rowToY(newR);
    }
    grid[newR] = arr;
    delete grid[oldR];
  }
}

// ===== 确保顶端有行 =====
function ensureTopRow(){
  // 如果 row 0 有存活砖块，OK
  if(grid[0] && grid[0].some(function(b){return b.alive;})) return;

  var rows = getAliveRows();
  if(rows.length === 0){
    // 全空，重新填满 6 行
    initBricks();
    return;
  }

  var minR = rows[0];
  if(minR > 0){
    // 所有人下移 minR 格，使 minR=0
    var oldG = grid; grid = {};
    for(var k in oldG){
      var nr = +k - minR;
      var a = oldG[k];
      for(var i=0;i<a.length;i++){
        a[i].row = nr;
        a[i].y = rowToY(nr);
      }
      grid[nr] = a;
    }
  }

  // 现在 row 0 应该存在，如果没有存活砖块就填满
  if(!grid[0] || !grid[0].some(function(b){return b.alive;})){
    fillRow(0);
  }
}

// ===== 行清空处理 =====
function onRowCleared(clearedRow){
  shiftRowsDown(clearedRow);
  delete grid[clearedRow];
  ensureTopRow();
  showMsg('新行补充!', 1200);
}

// 砖块死亡检查（延迟到下一帧）
function onBrickDestroyed(brick){
  var row = brick.row;
  setTimeout(function(){
    if(countAlive(row) === 0) onRowCleared(row);
  }, 0);
}

// ===== 球 =====
function makeBall(x,y,dx,dy,r,big){
  return {x:x,y:y,dx:dx,dy:dy,r:r,big:big};
}

function resetBalls(){
  balls = [makeBall(200, 400, (Math.random()*2-1)*3, -3.5, 7, false)];
  updateMultDisplay();
  multiTimer = 0;
}

function addBall(){
  if(balls.length >= 3) return;
  var s = balls[0];
  balls.push(makeBall(
    s.x + (Math.random()*20-10),
    s.y + (Math.random()*20-10),
    -s.dx * (0.8+Math.random()*0.4),
    -Math.abs(s.dy) * (0.8+Math.random()*0.4),
    s.r, s.big
  ));
  updateMultDisplay();
  showMsg('三倍火力!', 1200);
}

function updateMultDisplay(){
  if(balls.length >= 3)       multEl.textContent = 'x3';
  else if(mult === 3)         multEl.textContent = 'x3';
  else if(paddle && paddle.w > 80) multEl.textContent = '宽';
  else if(balls[0] && balls[0].big) multEl.textContent = '大';
  else                        multEl.textContent = 'x1';
}

// ===== 挡板 =====
function resetPaddle(){
  paddle = {x:160, w:80, h:12, y:PADDLE_Y};
  wideTimer = 0;
}

// ===== 重置 =====
function reset(){
  score = 0; lives = 3; mult = 1;
  scoreEl.textContent = '分数: 0';
  livesEl.textContent = '❤️❤️❤️';
  initBricks();
  resetBalls();
  resetPaddle();
  mouseX = 200; useMouse = false;
}

// ===== 更新 =====
function update(){
  // 计时器
  if(wideTimer > 0){
    wideTimer--;
    if(wideTimer <= 0){ paddle.w = 80; showMsg('挡板恢复', 800); updateMultDisplay(); }
  }
  if(bigTimer > 0){
    bigTimer--;
    if(bigTimer <= 0){
      for(var i=0;i<balls.length;i++){ balls[i].r=7; balls[i].big=false; }
      showMsg('球恢复', 800); updateMultDisplay();
    }
  }
  if(multiTimer > 0){
    multiTimer--;
    if(multiTimer <= 0 && balls.length > 1){
      balls = [balls[0]];
      updateMultDisplay();
      showMsg('火力恢复', 800);
    }
  }

  // 挡板跟随
  if(useMouse){
    var target = mouseX - paddle.w/2;
    paddle.x += (target - paddle.x) * 0.25;
  }
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  // 更新球
  for(var bi=0;bi<balls.length;bi++){
    var ball = balls[bi];
    if(ball.y > H + 30) continue;

    ball.x += ball.dx;
    ball.y += ball.dy;

    // 左右墙
    if(ball.x - ball.r < 0){ ball.x = ball.r; ball.dx = -ball.dx; }
    if(ball.x + ball.r > W){ ball.x = W - ball.r; ball.dx = -ball.dx; }
    // 上墙
    if(ball.y - ball.r < 0){ ball.y = ball.r; ball.dy = -ball.dy; }

    // 挡板碰撞
    if(ball.dy > 0 &&
       ball.y + ball.r >= paddle.y &&
       ball.y + ball.r <= paddle.y + paddle.h + 8 &&
       ball.x >= paddle.x - ball.r &&
       ball.x <= paddle.x + paddle.w + ball.r){
      var hit = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
      var spd = Math.sqrt(ball.dx*ball.dx + ball.dy*ball.dy);
      ball.dx = hit * 4;
      ball.dy = -Math.abs(spd * 0.9);
      ball.y = paddle.y - ball.r - 0.5;
    }

    // 砖块碰撞
    var hitFlag = false;
    forEachAlive(function(b){
      if(hitFlag) return;
      if(ball.x+ball.r > b.x && ball.x-ball.r < b.x+b.w &&
         ball.y+ball.r > b.y && ball.y-ball.r < b.y+b.h){

        var oL = (ball.x + ball.r) - b.x;
        var oR = (b.x + b.w) - (ball.x - ball.r);
        var oT = (ball.y + ball.r) - b.y;
        var oB = (b.y + b.h) - (ball.y - ball.r);
        var mn = oL;
        if(oR < mn) mn = oR;
        if(oT < mn) mn = oT;
        if(oB < mn) mn = oB;

        if(mn === oL || mn === oR) ball.dx = -ball.dx;
        else                        ball.dy = -ball.dy;

        // 特殊效果
        var t = b.type;
        if(t === 1){ mult = 3; showMsg('3倍分数!', 1000); }
        else if(t === 2){ paddle.w = 120; wideTimer = 600; showMsg('挡板加宽!', 1000); }
        else if(t === 3){
          for(var j=0;j<balls.length;j++){ balls[j].r=12; balls[j].big=true; }
          bigTimer = 600; showMsg('大球!', 1000);
        }
        else if(t === 4){ addBall(); multiTimer = 600; }

        b.alive = false;
        score += 10 * mult;
        scoreEl.textContent = '分数: ' + score;

        onBrickDestroyed(b);
        hitFlag = true;
      }
    });

    // 速度钳制
    var spd2 = Math.sqrt(ball.dx*ball.dx + ball.dy*ball.dy);
    var minS = ball.big ? 3.5 : 3;
    var maxS = ball.big ? 8 : 7;
    if(spd2 < minS){ var k=minS/spd2; ball.dx*=k; ball.dy*=k; }
    if(spd2 > maxS){ var k2=maxS/spd2; ball.dx*=k2; ball.dy*=k2; }
  }

  // 移除掉出屏幕的球
  var alive = [];
  for(var ai=0;ai<balls.length;ai++){
    if(balls[ai].y <= H+20) alive.push(balls[ai]);
  }
  balls = alive;

  // 所有球都掉了 → 扣命
  if(balls.length === 0){
    lives--;
    var hs = '';
    for(var li=0;li<Math.max(0,lives);li++) hs += '❤️';
    livesEl.textContent = hs;
    updateMultDisplay();
    if(lives <= 0){ running = false; gameOver(); return; }
    resetBalls();
  }
}

// ===== 绘制 =====
function draw(){
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);

  // 砖块（按行号升序绘制，小的在下面=先画）
  var rows = getAliveRows();
  for(var ri=0;ri<rows.length;ri++){
    var r = rows[ri];
    var arr = grid[r];
    var color = ROW_COLORS[r % ROW_COLORS.length];
    for(var i=0;i<arr.length;i++){
      var b = arr[i];
      if(!b.alive) continue;
      ctx.shadowColor = color; ctx.shadowBlur = 6;
      ctx.fillStyle = color;
      rr(ctx, b.x, b.y, b.w, b.h, 3);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(b.x+2, b.y+2, b.w-4, b.h/2-2);
    }
  }

  // 球
  for(var bi=0;bi<balls.length;bi++){
    var ball = balls[bi];
    ctx.shadowColor = ball.big ? '#ff6b81' : '#fff';
    ctx.shadowBlur = ball.big ? 22 : 15;
    ctx.fillStyle = ball.big ? '#ff6b81' : '#fff';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // 挡板
  ctx.shadowColor = '#f5576c'; ctx.shadowBlur = 20;
  ctx.fillStyle = '#f5576c';
  rr(ctx, paddle.x, paddle.y, paddle.w, paddle.h, 6);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(paddle.x+4, paddle.y+2, paddle.w-8, 4);

  // 计时条
  var maxT = 600, t = 0;
  if(wideTimer > t) t = wideTimer;
  if(bigTimer > t) t = bigTimer;
  if(multiTimer > t) t = multiTimer;
  if(t > 0){
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(10, H-8, W-20, 4);
    var bc = '#ffd700';
    if(wideTimer >= t) bc = '#00d2ff';
    else if(bigTimer >= t) bc = '#ff6b81';
    ctx.fillStyle = bc;
    ctx.fillRect(10, H-8, (W-20)*(t/maxT), 4);
  }
}

// 圆角矩形
function rr(c, x, y, w, h, r){
  if(r > w/2) r = w/2;
  if(r > h/2) r = h/2;
  c.beginPath();
  c.moveTo(x+r, y);
  c.lineTo(x+w-r, y);
  c.quadraticCurveTo(x+w, y, x+w, y+r);
  c.lineTo(x+w, y+h-r);
  c.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  c.lineTo(x+r, y+h);
  c.quadraticCurveTo(x, y+h, x, y+h-r);
  c.lineTo(x, y+r);
  c.quadraticCurveTo(x, y, x+r, y);
  c.closePath();
}

// ===== 游戏结束 =====
function gameOver(){
  window._lastScore = score;
  showScoreDialog(score);
  ov.style.display = 'flex';
  ov.innerHTML = '<h1>游戏结束</h1>...';
}

// ===== 主循环 =====
function loop(){
  if(!running) return;
  update();
  draw();
  animId = requestAnimationFrame(loop);
}

function start(){
  ov.style.display = 'none';
  reset();
  running = true;
  if(animId) cancelAnimationFrame(animId);
  animId = requestAnimationFrame(loop);
}

// ===== 事件 =====
btn.addEventListener('click', start);

cvs.addEventListener('mousemove', function(e){
  var rect = cvs.getBoundingClientRect();
  mouseX = (e.clientX - rect.left) * (W / rect.width);
  useMouse = true;
});
cvs.addEventListener('mouseleave', function(){ useMouse = false; });

cvs.addEventListener('touchmove', function(e){
  e.preventDefault();
  var rect = cvs.getBoundingClientRect();
  mouseX = (e.touches[0].clientX - rect.left) * (W / rect.width);
  useMouse = true;
}, {passive:false});
cvs.addEventListener('touchend', function(){ useMouse = false; });

document.addEventListener('keydown', function(e){
  if(!running) return;
  if(e.key==='ArrowLeft'){ paddle.x=Math.max(0,paddle.x-18); useMouse=false; e.preventDefault(); }
  if(e.key==='ArrowRight'){ paddle.x=Math.min(W-paddle.w,paddle.x+18); useMouse=false; e.preventDefault(); }
});

// ===== 初始绘制 =====
reset();
draw();

})();
</script>
