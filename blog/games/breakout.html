<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>打砖块</title>
<link rel="stylesheet" href="_common.css">
<style>
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:8px}
canvas{border-radius:12px;max-width:100%;touch-action:none}
.hud{display:flex;gap:16px;margin:8px 0;font-size:14px;color:#94a3b8;flex-wrap:wrap;justify-content:center}
.hud b{color:#4fc3f7}
</style>
</head>
<body>
<a class="back-link" href="index.html">← 返回游戏列表</a>
<div id="topbar"></div>
<h1 style="font-size:22px;margin:6px 0;background:linear-gradient(90deg,#f43f5e,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent">🧱 打砖块</h1>
<div class="hud">
  <span>分数：<b id="sc">0</b></span>
  <span>生命：<b id="hp">3</b></span>
  <span>最高分：<b id="hi">0</b></span>
</div>
<canvas id="c" width="480" height="320"></canvas>
<button class="btn btn-sm btn-danger" id="restart" style="margin-top:10px">重新开始</button>
<p style="color:#64748b;font-size:12px;margin-top:6px">← → / 鼠标拖动挡板</p>

<script src="_common.js"></script>
<script>
const topbar=document.getElementById('topbar');topbar.innerHTML=makeTopbar();
const C=document.getElementById('c'),X=C.getContext('2d');
const W=480,H=320;
let paddle,ball,bricks,score=0,high=Store.get('bk_hi',0),lives=3,running=true;

function reset(){
  paddle={x:W/2-40,y:H-24,w:80,h:12,vx:0};
  ball={x:W/2,y:H/2,r:7,vx:3,vy:-3,speed:4};
  bricks=[];score=0;lives=3;running=true;
  for(let r=0;r<5;r++)for(let c=0;c<8;c++){
    bricks.push({x:4+c*59,y:4+r*20,w:55,h:16,hp:3-r,alive:true});
  }
  updateHUD();
}
function updateHUD(){document.getElementById('sc').textContent=score;document.getElementById('hp').textContent=lives;document.getElementById('hi').textContent=high}
function normalizeBall(){
  const sp=Math.hypot(ball.vx,ball.vy);
  if(sp===0)return;
  if(sp<2.5||sp>7){const target=Math.max(2.5,Math.min(7,ball.speed||4));ball.vx=ball.vx/sp*target;ball.vy=ball.vy/sp*target;return}
  ball.vx=ball.vx/sp*ball.speed;ball.vy=ball.vy/sp*ball.speed;
}
function step(){
  if(!running)return;
  // 挡板
  paddle.x+=paddle.vx;
  paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));
  // 球
  ball.x+=ball.vx;ball.y+=ball.vy;
  // 墙
  if(ball.x<ball.r){ball.x=ball.r;ball.vx*=-1}
  if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx*=-1}
  if(ball.y<ball.r){ball.y=ball.r;ball.vy*=-1}
  // 挡板碰撞（仅下落时）
  if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x-4&&ball.x<=paddle.x+paddle.w+4){
    ball.y=paddle.y-ball.r-0.5;ball.vy*=-1;
    const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);
    ball.vx=hit*ball.speed*0.9;normalizeBall();
  }
  // 砖块碰撞
  for(const b of bricks){if(!b.alive)continue;
    if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){
      // 计算从哪边撞入
      const ox=(ball.x-(b.x+b.w/2))/(b.w/2),oy=(ball.y-(b.y+b.h/2))/(b.h/2);
      if(Math.abs(ox)>Math.abs(oy)){ball.vx*=-1;ball.x=ball.vx>0?b.x+b.w+ball.r+0.5:b.x-ball.r-0.5}
      else{ball.vy*=-1;ball.y=ball.vy>0?b.y+b.h+ball.r+0.5:b.y-ball.r-0.5}
      b.hp--;score+=10;if(b.hp<=0)b.alive=false;
      normalizeBall();break;
    }
  }
  // 出界
  if(ball.y>H+10){lives--;if(lives<=0){running=false;alert('💀 游戏结束 得分:'+score)}else{resetBall()}}
  if(score>high){high=score;Store.set('bk_hi',high)}
  updateHUD();
}
function resetBall(){ball.x=W/2;ball.y=H/2;ball.vx=3*(Math.random()<0.5?-1:1);ball.vy=-3;ball.speed=4}
function draw(){
  X.fillStyle='#0f172a';X.fillRect(0,0,W,H);
  // 砖块
  for(const b of bricks){if(!b.alive)continue;
    const colors=['#475569','#3b82f6','#a78bfa','#f43f5e','#f97316'];
    X.fillStyle=colors[b.hp]||'#fff';X.shadowColor=X.fillStyle;X.shadowBlur=4;
    X.fillRect(b.x,b.y,b.w,b.h);X.shadowBlur=0;
  }
  // 挡板
  X.fillStyle='#4fc3f7';X.shadowColor='#4fc3f7';X.shadowBlur=10;
  X.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);X.shadowBlur=0;
  // 球
  X.fillStyle='#facc15';X.shadowColor='#facc15';X.shadowBlur=8;
  X.beginPath();X.arc(ball.x,ball.y,ball.r,0,Math.PI*2);X.fill();X.shadowBlur=0;
}
function loop(){step();draw();requestAnimationFrame(loop)}
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')paddle.vx=-6;if(e.key==='ArrowRight')paddle.vx=6;if(e.key===' '&&!running)reset()});
document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight')paddle.vx=0});
C.addEventListener('mousemove',e=>{const r=C.getBoundingClientRect();paddle.x=(e.clientX-r.left)/r.width*W-paddle.w/2});
C.addEventListener('touchmove',e=>{e.preventDefault();const r=C.getBoundingClientRect(),t=e.touches[0];paddle.x=(t.clientX-r.left)/r.width*W-paddle.w/2},{passive:false});
document.getElementById('restart').onclick=reset;
reset();requestAnimationFrame(loop);
</script>
</body></html>
