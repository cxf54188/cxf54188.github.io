<!DOCTYPE html>
<html lang="zh-C-N">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🐺 狼人杀</title>
<link rel="stylesheet" href="_common.css">
<style>
.phase-box { background:#222; border:2px solid #7C4DFF; border-radius:12px; padding:16px; text-align:center; margin:12px 0; }
.role-name { font-size:24px; font-weight:700; color:#FFD740; margin:8px 0; }
.player-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(100px,1fr)); gap:8px; margin:10px 0; }
.player-card { background:#333; border-radius:8px; padding:10px; text-align:center; cursor:pointer; border:2px solid #555; transition:all .2s; font-size:13px; }
.player-card:hover { border-color:#FFD740; }
.player-card.killed { opacity:0.3; cursor:not-allowed; }
.player-card.selected { border-color:#e53935; background:#4a1a1a; }
.log-box { background:#1a1a2e; border-radius:8px; padding:10px; margin:8px 0; max-height:150px; overflow-y:auto; font-size:13px; color:#ccc; }
.btn { display:inline-block; padding:8px 20px; border-radius:8px; border:none; font-size:14px; font-weight:600; cursor:pointer; background:linear-gradient(135deg,#7C4DFF,#a78bfa); color:#fff; font-family:inherit; }
.btn:hover { transform:scale(1.05); }
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center; }
.overlay h2 { font-size:22px; margin-bottom:10px; color:#a78bfa; }
.overlay p { color:#cbd5e1; font-size:13px; line-height:1.8; max-width:380px; }
</style>
</head>
<body>
<div class="topbar">
  <a href="index.html" style="color:#7C4DFF;font-size:18px;margin-right:8px">←</a>
  <img class="avatar" src="../../img/avatar.png" alt="cxf54188" onerror="this.style.display='none'">
  <span class="author">作者：cxf54188</span><span class="sep">|</span><span class="author">🤖 辅助：元宝AI</span>
</div>
<div class="game-container">
  <h2 class="game-title">🐺 狼人杀</h2>
  <div class="info-bar"><span id="phaseInfo">准备</span><span class="score" id="aliveInfo"></span></div>
  <div class="phase-box" id="mainBox"></div>
  <div class="log-box" id="logBox"></div>
  <div class="msg" id="msg"></div>
</div>
<div class="overlay" id="overlay">
  <h2>🐺 狼人杀</h2>
  <p>6人局：3村民+1预言家+2狼人<br>夜晚狼人杀人，白天投票<br>狼人杀光好人/好人投出所有狼人</p>
  <button class="btn" id="startBtn">开始游戏</button>
</div>
<script>
const ROLE_TEMPLATES=[
  {id:'wolf',name:'狼人',team:'wolf'},
  {id:'wolf',name:'狼人',team:'wolf'},
  {id:'seer',name:'预言家',team:'good'},
  {id:'villager',name:'村民',team:'good'},
  {id:'villager',name:'村民',team:'good'},
  {id:'villager',name:'村民',team:'good'}
];

let players,myRole,phase,day,gameOver,selectedTarget;

function startGame(){
  document.getElementById('overlay').style.display='none';
  const roles=ROLE_TEMPLATES.slice();
  for(let i=roles.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[roles[i],roles[j]]=[roles[j],roles[i]];}
  players=roles.map((r,i)=>({...r,alive:true,idx:i}));
  myRole=players[0];
  day=0;gameOver=false;selectedTarget=null;
  logMsg('夜晚降临...');
  renderNight();
}

function renderNight(){
  phase='night';day++;
  const box=document.getElementById('mainBox');
  let html=`<div>第 ${day} 天</div><div class="role-name">${myRole.name}</div>`;
  if(myRole.id==='wolf'){
    html+=`<div style="color:#aaa;font-size:12px">你是狼人，选择要杀的人</div>`;
    html+='<div class="player-grid">';
    players.forEach((p,i)=>{if(p.alive&&i>0)html+=`<div class="player-card" onclick="wolfKill(${i})">玩家${i}</div>`;});
    html+='</div>';
  }else if(myRole.id==='seer'){
    html+=`<div style="color:#aaa;font-size:12px">你是预言家，可查验一人</div>`;
    html+='<div class="player-grid">';
    players.forEach((p,i)=>{if(p.alive&&i>0)html+=`<div class="player-card" onclick="seerCheck(${i})">玩家${i}</div>`;});
    html+='</div>';
  }else{
    html+=`<div style="color:#aaa;font-size:12px">你是好人，等待天亮</div>`;
    html+=`<button class="btn" onclick="endNight()">等待天亮</button>`;
  }
  box.innerHTML=html;
  setPhase('夜晚');
}

function wolfKill(target){
  if(gameOver)return;
  players[target].alive=false;
  logMsg(`夜晚：玩家${target}被杀害`);
  setTimeout(renderDay,1000);
}

function seerCheck(target){
  if(gameOver)return;
  const p=players[target];
  logMsg(`预言家查验：玩家${target}是${p.team==='wolf'?'🐺狼人':'😇好人'}`);
  setTimeout(endNight,1500);
}

function endNight(){setTimeout(renderDay,500);}

function renderDay(){
  phase='day';
  const alive=players.filter(p=>p.alive&&p.idx>0);
  const box=document.getElementById('mainBox');
  let html=`<div>第 ${day} 天 · 白天</div><p style="color:#aaa">讨论后投票驱逐嫌疑人</p>`;
  html+='<div class="player-grid" id="voteGrid">';
  alive.forEach(p=>{
    html+=`<div class="player-card" id="pc${p.idx}" onclick="selectVote(${p.idx})">玩家${p.idx}</div>`;
  });
  html+='</div>';
  html+=`<button class="btn" id="voteBtn" style="display:none" onclick="doVote()">确认投票</button>`;
  box.innerHTML=html;
  setPhase('白天讨论+投票');
}

function selectVote(idx){
  if(gameOver)return;
  selectedTarget=idx;
  document.querySelectorAll('.player-card').forEach(c=>c.classList.remove('selected'));
  const el=document.getElementById('pc'+idx);
  if(el)el.classList.add('selected');
  const vb=document.getElementById('voteBtn');
  if(vb)vb.style.display='inline-block';
}

function doVote(){
  if(gameOver||selectedTarget===null)return;
  const target=selectedTarget;
  // AI投票
  const alive=players.filter(p=>p.alive&&p.idx>0);
  const votes={};
  alive.forEach(p=>{
    let vote;
    if(p.team==='wolf'){
      const good=alive.filter(x=>x.team==='good');
      vote=good.length>0?good[Math.floor(Math.random()*good.length)].idx:target;
    }else{
      const wolves=alive.filter(x=>x.team==='wolf');
      vote=wolves.length>0?wolves[Math.floor(Math.random()*wolves.length)].idx:target;
    }
    votes[vote]=(votes[vote]||0)+1;
  });
  // 玩家投票
  votes[target]=(votes[target]||0)+1;
  let maxV=-1,elim=-1;
  Object.keys(votes).forEach(k=>{if(votes[k]>maxV){maxV=votes[k];elim=+k;}});
  if(elim>0&&players[elim]){
    players[elim].alive=false;
    logMsg(`玩家${elim}被投票出局（是${players[elim].name}）`);
  }
  checkWin();
  if(!gameOver)setTimeout(renderNight,2000);
}

function checkWin(){
  const wolves=players.filter(p=>p.alive&&p.team==='wolf').length;
  const goods=players.filter(p=>p.alive&&p.team==='good').length;
  if(wolves===0){gameOver=true;logMsg('🎉 好人赢了！');setMsg('好人驱逐了所有狼人');}
  else if(goods<=wolves){gameOver=true;logMsg('😢 狼人赢了！');setMsg('狼人数量≥好人');}
  document.getElementById('aliveInfo').textContent=`存活:${players.filter(p=>p.alive).length}`;
}

function logMsg(t){const l=document.getElementById('logBox');const p=document.createElement('p');p.textContent=t;l.appendChild(p);l.scrollTop=l.scrollHeight;}
function setMsg(m){document.getElementById('msg').textContent=m;}
function setPhase(t){document.getElementById('phaseInfo').textContent=t;}

document.getElementById('startBtn').onclick=()=>{
  document.getElementById('overlay').style.display='none';
  setTimeout(startGame,100);
};
</script>
</body>
</html>
