<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>快艇骰子</title>
<link rel="stylesheet" href="./_common.css">
<style>
body{display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:8px}
#dice{display:flex;gap:8px;margin:10px 0}
.die{width:48px;height:48px;border-radius:8px;background:white;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#333;cursor:pointer;border:3px solid rgba(255,255,255,.2);user-select:none}
.die.locked{border-color:#34d399;background:#d1fae5}
#scorecard{display:grid;grid-template-columns:1fr 60px;gap:4px;max-width:300px;width:100%;margin:8px 0;font-size:13px}
.score-row{display:contents}
.score-row>div{padding:6px 8px;background:rgba(255,255,255,.05);border-radius:4px}
.score-row .val{cursor:pointer;text-align:center}
.score-row .val:hover{background:rgba(79,195,247,.2)}
.score-row .val.picked{background:rgba(52,211,153,.2);cursor:default}
.hud{display:flex;gap:12px;margin:6px 0;font-size:13px;color:#94a3b8}
.hud b{color:#4fc3f7}
</style>
</head>
<body>
<a class="back-link" href="../../index.html">← 返回主页</a>
<div id="topbar"></div>
<h1 style="font-size:22px;margin:6px 0">🎲 快艇骰子</h1>
<div class="hud"><span>回合：<b id="rd">1</b>/13</span><span>分数：<b id="sc">0</b></span></div>
<div id="dice"></div>
<div id="scorecard"></div>
<div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;justify-content:center">
  <button class="btn btn-sm" id="rollBtn">🎲 掷骰子</button>
  <button class="btn btn-sm btn-danger" id="restart">重来</button>
</div>
<p style="color:#64748b;font-size:12px;margin-top:6px">点骰子锁定/解锁，3次掷骰后选一项记分</p>

<script src="./_common.js"></script>
<script>
const topbar=document.getElementById('topbar');topbar.innerHTML=makeTopbar();
const CATS=[
  {id:'ones',name:'一点',fn:d=>sumOf(d,1)},
  {id:'twos',name:'二点',fn:d=>sumOf(d,2)},
  {id:'threes',name:'三点',fn:d=>sumOf(d,3)},
  {id:'fours',name:'四点',fn:d=>sumOf(d,4)},
  {id:'fives',name:'五点',fn:d=>sumOf(d,5)},
  {id:'sixes',name:'六点',fn:d=>sumOf(d,6)},
  {id:'3kind',name:'三条',fn:d=>hasN(d,3)?sum(d):0},
  {id:'4kind',name:'四条',fn:d=>hasN(d,4)?sum(d):0},
  {id:'full',name:'葫芦',fn:d=>isFull(d)?25:0},
  {id:'sm',name:'小顺',fn:d=>hasSeq(d,4)?30:0},
  {id:'lg',name:'大顺',fn:d=>hasSeq(d,5)?40:0},
  {id:'yahtzee',name:'快艇',fn:d=>hasN(d,5)?50:0},
  {id:'chance',name:'机会',fn:d=>sum(d)},
];
let dice,locks,rolls,round,score,picked;

function sumOf(d,n){return d.filter(x=>x===n).reduce((a,b)=>a+b,0)}
function sum(d){return d.reduce((a,b)=>a+b,0)}
function hasN(d,n){const c={};d.forEach(x=>c[x]=(c[x]||0)+1);return Object.values(c).some(v=>v>=n)}
function isFull(d){const c={};d.forEach(x=>c[x]=(c[x]||0)+1);const v=Object.values(c).sort();return v[0]===2&&v[1]===3}
function hasSeq(d,n){const u=[...new Set(d)].sort();let max=1,cur=1;for(let i=1;i<u.length;i++){if(u[i]===u[i-1]+1){cur++;max=Math.max(max,cur)}else{cur=1}}return max>=n}

function reset(){dice=[1,1,1,1,1];locks=[false,false,false,false,false];rolls=0;round=1;score=0;picked={};render()}
function roll(){if(rolls>=3)return;for(let i=0;i<5;i++)if(!locks[i])dice[i]=Math.floor(Math.random()*6)+1;rolls++;render()}
function toggleLock(i){if(rolls===0)return;locks[i]=!locks[i];render()}
function pickCat(id){if(rolls===0){alert('先掷骰子！');return}if(picked[id])return;const cat=CATS.find(c=>c.id===id);const pts=cat.fn(dice);picked[id]=pts;score+=pts;round++;rolls=0;locks=[false,false,false,false,false];render();if(round>13)setTimeout(()=>alert('🎉 游戏结束！总分：'+score),100)}
function render(){const d=document.getElementById('dice');d.innerHTML=dice.map((v,i)=>`<div class="die ${locks[i]?'locked':''}" data-i="${i}">${'⚀⚁⚂⚃⚄⚅'[v-1]}</div>`).join('');d.querySelectorAll('.die').forEach(el=>el.onclick=()=>toggleLock(+el.dataset.i));const sc=document.getElementById('scorecard');sc.innerHTML=CATS.map(c=>{const p=picked[c.id];return`<div class="score-row"><div>${c.name}</div><div class="val ${p!==undefined?'picked':''}" data-id="${c.id}">${p!==undefined?p:'-'}</div></div>`}).join('');sc.querySelectorAll('.val').forEach(el=>el.onclick=()=>pickCat(el.dataset.id));document.getElementById('rd').textContent=Math.min(round,13);document.getElementById('sc').textContent=score}
document.getElementById('rollBtn').onclick=roll;
document.getElementById('restart').onclick=reset;
reset();
</script>
</body></html>
