<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🃏 拉密</title>
<link rel="stylesheet" href="_common.css">
<style>
.hand-row { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin:10px 0; }
.rum-card { width:44px; height:62px; border-radius:6px; border:2px solid #fff; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:16px; font-weight:700; cursor:pointer; background:#fff; color:#333; transition:all .2s; }
.rum-card:hover { transform:translateY(-6px); }
.rum-card.black { color:#111; }
.rum-card.red { color:#e53935; }
.rum-card.sel { border-color:#FFD740; transform:translateY(-8px); }
.rum-card.joker { background:linear-gradient(135deg,#e53935,#1e88e5); color:#fff; }
.table-area { min-height:100px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:10px 0; padding:10px; background:#222; border-radius:10px; }
.table-group { display:flex; gap:2px; padding:4px; border:1px solid #444; border-radius:6px; }
.btn { display:inline-block; padding:8px 20px; border-radius:8px; border:none; font-size:14px; font-weight:600; cursor:pointer; background:linear-gradient(135deg,#4fc3f7,#a78bfa); color:#0a0e27; font-family:inherit; }
.btn:hover { transform:scale(1.05); }
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center; }
.overlay h2 { font-size:22px; margin-bottom:10px; color:#FFD740; }
.overlay p { color:#cbd5e1; font-size:13px; line-height:1.8; max-width:380px; }
</style>
</head>
<body>
<div class="topbar">
  <a href="index.html" style="color:#7C4DFF;font-size:18px;margin-right:8px">←</a>
  <img class="avatar" src="../../img/avatar.png" alt="cxf54188" onerror="this.style.display='none'">
  <span class="author">作者：cxf54188</span><span class="sep">|</span><span class="author">🤖 辅助：元宝AI</span>
</div>
<div class="game-container">
  <h2 class="game-title">🃏 拉密</h2>
  <div class="info-bar"><span id="turnInfo">你的回合</span><span class="score" id="handCount">手牌:0</span></div>
  <div class="table-area" id="table"></div>
  <div class="hand-row" id="hand"></div>
  <div style="text-align:center;margin-top:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
    <button class="btn" id="drawBtn">摸牌</button>
    <button class="btn" id="submitBtn" style="display:none">提交组合</button>
    <button class="btn" id="restartBtn" style="background:linear-gradient(135deg,#64748b,#475569);color:#fff">重新开始</button>
  </div>
  <div class="msg" id="msg">凑齐同色顺子(3+)或同值组(3-4)打出</div>
</div>
<div class="overlay" id="overlay">
  <h2>🃏 拉密</h2>
  <p>14张手牌，凑顺子/组打出<br>顺子：同色连续3+张<br>组：同数字3-4张不同色<br>先出完手牌获胜</p>
  <button class="btn" id="startBtn">开始游戏</button>
</div>
<script>
const COLS=[{id:0,name:'black'},{id:1,name:'red'},{id:2,name:'blue'},{id:3,name:'green'}];
let myHand=[],aiHand=[],table=[],deck=[],cur,selected=[],gameOver;

function buildDeck(){
  let d=[];
  for(let c=0;c<4;c++)for(let v=1;v<=13;v++){d.push({c,v});d.push({c,v});}
  d.push({joker:true,id:1},{joker:true,id:2});
  for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]];}
  return d;
}

function startGame(){
  document.getElementById('overlay').style.display='none';
  deck=buildDeck();myHand=[];aiHand=[];table=[];selected=[];gameOver=false;
  for(let i=0;i<14;i++){myHand.push(deck.pop());aiHand.push(deck.pop());}
  myHand.sort((a,b)=>(a.joker?1:0)-(b.joker?1:0)||(a.v||0)-(b.v||0));
  cur=0;
  render();setTurn('你的回合 - 选牌凑组合');
}

function cardColor(c){return c.joker?'joker':COLS[c.c].name;}
function cardText(c){return c.joker?'★':c.v;}

function isValidSet(cards){
  if(cards.length<3)return false;
  // 组：同值不同色（最多4张）
  const groups={};
  cards.forEach(c=>{if(!c.joker){(groups[c.v]=groups[c.v]||[]).push(c);}});
  const vals=Object.keys(groups).map(Number);
  if(vals.length===1&&vals[0]===cards[0].v&&cards.length<=4){
    // 检查不同色
    const cols=new Set(cards.filter(c=>!c.joker).map(c=>c.c));
    if(cols.size===cards.filter(c=>!c.joker).length)return true;
  }
  // 顺子：同色连续
  const byColor={};
  cards.forEach(c=>{if(!c.joker){(byColor[c.c]=byColor[c.c]||[]).push(c);}});
  for(const ci of Object.keys(byColor)){
    const same=byColor[ci].sort((a,b)=>a.v-b.v);
    if(same.length+table.filter(c=>c.joker).length>=3){
      // 检查连续
      let ok=true;for(let i=0;i<same.length-1;i++)if(same[i+1].v!==same[i].v+1){ok=false;break;}
      if(ok)return true;
    }
  }
  return false;
}

function toggleSelect(idx){
  if(cur!==0||gameOver)return;
  const pos=selected.indexOf(idx);
  if(pos>=0)selected.splice(pos,1);else selected.push(idx);
  render();
  document.getElementById('submitBtn').style.display=selected.length>=3?'inline-block':'none';
}

function submitSet(){
  if(selected.length<3||cur!==0)return;
  const cards=selected.map(i=>myHand[i]);
  if(!isValidSet(cards)){setMsg('不是合法组合！');return;}
  // 从大到小移除（避免索引偏移）
  selected.sort((a,b)=>b-a).forEach(i=>table.push(myHand.splice(i,1)[0]));
  selected=[];
  if(myHand.length===0){gameOver=true;setMsg('🎉 你赢了！');render();return;}
  cur=1;setTurn('AI思考中...');setTimeout(aiTurn,800);render();
}

function drawTile(){
  if(cur!==0||gameOver)return;
  if(deck.length===0){setMsg('牌堆空了！');return;}
  myHand.push(deck.pop());
  myHand.sort((a,b)=>(a.joker?1:0)-(b.joker?1:0)||(a.v||0)-(b.v||0));
  cur=1;setTurn('AI思考中...');setTimeout(aiTurn,800);render();
}

function aiTurn(){
  if(gameOver)return;
  // AI找组合
  const groups=findGroups(aiHand);
  if(groups.length>0){
    const g=groups[0];
    g.forEach(idx=>table.push(aiHand.splice(idx,1)[0]));
    if(aiHand.length===0){gameOver=true;setMsg('😢 AI赢了');render();return;}
  }else{
    if(deck.length>0)aiHand.push(deck.pop());
  }
  aiHand.sort((a,b)=>(a.joker?1:0)-(b.joker?1:0)||(a.v||0)-(b.v||0));
  cur=0;setTurn('你的回合');render();
}

function findGroups(hand){
  const groups=[];
  // 同值组
  const byVal={};
  hand.forEach((c,i)=>{if(!c.joker){(byVal[c.v]=byVal[c.v]||[]).push(i);}});
  Object.values(byVal).forEach(arr=>{if(arr.length>=3)groups.push(arr.slice(0,Math.min(4,arr.length)));});
  // 同色顺子
  for(let ci=0;ci<4;ci++){
    const same=hand.map((c,i)=>c.c===ci?i:-1).filter(i=>i>=0).sort((a,b)=>hand[a].v-hand[b].v);
    for(let i=0;i<same.length-2;i++){
      if(hand[same[i+1]].v===hand[same[i]].v+1&&hand[same[i+2]].v===hand[same[i]].v+2){
        groups.push([same[i],same[i+1],same[i+2]]);
      }
    }
  });
  return groups;
}

function render(){
  const t=document.getElementById('table');t.innerHTML='';
  if(table.length>0){
    const g=document.createElement('div');g.className='table-group';
    table.forEach(c=>{
      const cd=document.createElement('div');cd.className='rum-card'+(c.joker?' joker':c.c===1||c.c===3?' red':' black');
      cd.textContent=cardText(c);g.appendChild(cd);
    });
    t.appendChild(g);
  }
  const h=document.getElementById('hand');h.innerHTML='';
  myHand.forEach((c,i)=>{
    const d=document.createElement('div');
    d.className='rum-card'+(c.joker?' joker':c.c===1||c.c===3?' red':' black')+(selected.includes(i)?' sel':'');
    d.textContent=cardText(c);
    d.onclick=()=>toggleSelect(i);h.appendChild(d);
  });
  document.getElementById('handCount').textContent=`手牌:${myHand.length} | 牌堆:${deck.length}`;
  document.getElementById('drawBtn').disabled=cur!==0||gameOver;
}

function setMsg(m){document.getElementById('msg').textContent=m;}
function setTurn(t){document.getElementById('turnInfo').textContent=t;}

document.getElementById('drawBtn').onclick=drawTile;
document.getElementById('submitBtn').onclick=submitSet;
document.getElementById('restartBtn').onclick=startGame;
document.getElementById('startBtn').onclick=()=>{
  document.getElementById('overlay').style.display='none';
  setTimeout(startGame,100);
};
</script>
</body>
</html>
