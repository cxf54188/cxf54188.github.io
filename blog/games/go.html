<!DOCTYPE html>
<html lang="zh-C-N">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>♟ 围棋</title>
<link rel="stylesheet" href="_common.css">
<style>
canvas { background:#DEB887; border-radius:10px; display:block; margin:0 auto; }
.btn { display:inline-block; padding:8px 20px; border-radius:8px; border:none; font-size:14px; font-weight:600; cursor:pointer; background:linear-gradient(135deg,#4fc3f7,#a78bfa); color:#0a0e27; font-family:inherit; }
.btn:hover { transform:scale(1.05); }
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center; }
.overlay h2 { font-size:22px; margin-bottom:10px; color:#a78bfa; }
.overlay p { color:#cbd5e1; font-size:13px; line-height:1.8; max-width:380px; }
</style>
</head>
<body>
<div class="topbar">
  <a href="index.html" style="color:#7C4DFF;font-size:18px;margin-right:8px">←</a>
  <img class="avatar" src="../../img/avatar.png" alt="cxf54188" onerror="this.style.display='none'">
  <span class="author">作者：cxf54188</span><span class="sep">|</span><span class="author">🤖 辅助：元宝AI</span>
</div>
<div class="game-container">
  <h2 class="game-title">♟ 围棋</h2>
  <div class="info-bar"><span id="turnInfo">你的回合（黑）</span><span class="score" id="captured">提子:0</span></div>
  <canvas id="cv" width="380" height="380"></canvas>
  <div class="msg" id="msg">点击交叉点落子，围地吃子</div>
  <div style="text-align:center;margin-top:8px;display:flex;gap:8px;justify-content:center">
    <button class="btn" id="passBtn">弃手</button>
    <button class="btn" id="restartBtn" style="background:linear-gradient(135deg,#64748b,#475569);color:#fff">重新开始</button>
  </div>
</div>
<div class="overlay" id="overlay">
  <h2>♟ 围棋</h2>
  <p>9×9 小棋盘<br>围地吃子，地多者胜<br>连续两弃手则终局</p>
  <button class="btn" id="startBtn">开始游戏</button>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const N=9, SZ=cv.width/(N-1);
let board,cur,captures,passCount,gameOver,lastBoard;

function startGame(){
  document.getElementById('overlay').style.display='none';
  board=Array(N).fill(null).map(()=>Array(N).fill(0));
  cur=1;captures=0;passCount=0;gameOver=false;lastBoard=null;
  draw();setTurn('你的回合（黑方）');setMsg('点击交叉点落子');
}

function getLiberties(r,c,color,visited){
  if(!visited)visited=new Set();
  let lib=0;
  const key=(r,c)=>`${r},${c}`;
  const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
  for(const[dr,dc] of dirs){
    const nr=r+dr,nc=c+dc;
    if(nr<0||nr>=N||nc<0||nc>=N)continue;
    const k=key(nr,nc);
    if(visited.has(k))continue;
    visited.add(k);
    if(board[nr][nc]===0)lib++;
    else if(board[nr][nc]===color){
      lib+=getLiberties(nr,nc,color,visited);
    }
  }
  return lib;
}

function captureAt(r,c,oppColor){
  const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
  let totalCaptured=0;
  for(const[dr,dc] of dirs){
    const nr=r+dr,nc=c+dc;
    if(nr<0||nr>=N||nc<0||nc>=N)continue;
    if(board[nr][nc]===oppColor){
      const lib=getLiberties(nr,nc,oppColor);
      if(lib===0){
        // 提子
        const group=[];
        collectGroup(nr,nc,oppColor,group,new Set());
        group.forEach(([gr,gc])=>{board[gr][gc]=0;totalCaptured++;});
      }
    }
  }
  return totalCaptured;
}

function collectGroup(r,c,color,group,visited){
  const k=`${r},${c}`;
  if(visited.has(k))return;
  visited.add(k);
  group.push([r,c]);
  const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
  for(const[dr,dc] of dirs){
    const nr=r+dr,nc=c+dc;
    if(nr<0||nr>=N||nc<0||nc>=N)continue;
    if(board[nr][nc]===color)collectGroup(nr,nc,color,group,visited);
  }
}

function isSuicide(r,c,color){
  board[r][c]=color;
  const lib=getLiberties(r,c,color);
  // 检查是否能吃对方
  const opp=color===1?2:1;
  let canCapture=false;
  const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
  for(const[dr,dc] of dirs){
    const nr=r+dr,nc=c+dc;
    if(nr<0||nr>=N||nc<0||nc>=N)continue;
    if(board[nr][nc]===opp){
      if(getLiberties(nr,nc,opp)===0){canCapture=true;break;}
    }
  }
  board[r][c]=0;
  return lib===0&&!canCapture;
}

cv.addEventListener('click',e=>{
  if(gameOver||cur!==1)return;
  const rct=cv.getBoundingClientRect();
  const x=(e.clientX-rct.left)/rct.width*cv.width;
  const y=(e.clientY-rct.top)/rct.height*cv.height;
  const c=Math.round(x/SZ),r=Math.round(y/SZ);
  if(r<0||r>=N||c<0||c>=N)return;
  if(board[r][c]!==0)return;
  if(isSuicide(r,c,1)){setMsg('不能自填！');return;}
  board[r][c]=1;
  const caps=captureAt(r,c,2);
  captures+=caps;
  passCount=0;
  cur=2;setTurn('AI思考中...');draw();
  setTimeout(aiTurn,500);
});

function pass(){
  if(gameOver||cur!==1)return;
  passCount++;
  if(passCount>=2){endGame();return;}
  cur=2;setTurn('AI思考中...');setTimeout(aiTurn,400);
}

function aiTurn(){
  if(gameOver)return;
  // 找合法且有气的落点
  const candidates=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(board[r][c]!==0)continue;
    if(isSuicide(r,c,2))continue;
    let score=Math.random();
    // 优先吃子
    const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
    for(const[dr,dc] of dirs){
      const nr=r+dr,nc=c+dc;
      if(nr<0||nr>=N||nc<0||nc>=N)continue;
      if(board[nr][nc]===1&&getLiberties(nr,nc,1)===1)score+=10;
    }
    // 优先占角
    if((r===0||r===N-1)&&(c===0||c===N-1))score+=2;
    candidates.push({r,c,score});
  }
  candidates.sort((a,b)=>b.score-a.score);
  if(candidates.length===0||passCount>=1){
    passCount++;
    if(passCount>=2){endGame();return;}
    cur=1;setTurn('你的回合（黑）');draw();
    return;
  }
  const best=candidates[0];
  board[best.r][best.c]=2;
  captureAt(best.r,best.c,1);
  passCount=0;
  cur=1;setTurn('你的回合（黑）');draw();
}

function endGame(){
  gameOver=true;
  let black=0,white=0;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(board[r][c]===1)black++;
    else if(board[r][c]===2)white++;
  }
  black+=captures;
  setMsg(`终局！黑:${black} 白:${white} ${black>white?'🎉 你赢了！':'😢 AI赢了'}`);
}

function draw(){
  ctx.fillStyle='#DEB887';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.strokeStyle='#333';ctx.lineWidth=1;
  for(let i=0;i<N;i++){
    ctx.beginPath();ctx.moveTo(i*SZ,0);ctx.lineTo(i*SZ,cv.height);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i*SZ);ctx.lineTo(cv.width,i*SZ);ctx.stroke();
  }
  const stars=[[2,2],[2,6],[6,2],[6,6],[4,4]];
  stars.forEach(([r,c])=>{ctx.fillStyle='#333';ctx.beginPath();ctx.arc(c*SZ,r*SZ,3,0,Math.PI*2);ctx.fill();});
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(board[r][c]===0)continue;
    ctx.fillStyle=board[r][c]===1?'#111':'#eee';
    ctx.beginPath();ctx.arc(c*SZ,r*SZ,SZ/2-3,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=board[r][c]===1?'#000':'#ccc';ctx.lineWidth=1;ctx.stroke();
  }
}

function setMsg(m){document.getElementById('msg').textContent=m;}
function setTurn(t){document.getElementById('turnInfo').textContent=t;document.getElementById('captured').textContent='提子:'+captures;}

document.getElementById('passBtn').onclick=pass;
document.getElementById('restartBtn').onclick=startGame;
document.getElementById('startBtn').onclick=()=>{
  document.getElementById('overlay').style.display='none';
  setTimeout(startGame,100);
};
ctx.fillStyle='#DEB887';ctx.fillRect(0,0,cv.width,cv.height);
</script>
</body>
</html>
