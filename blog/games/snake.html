<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🐍 贪吃蛇</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0c29;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:system-ui,sans-serif;overflow:hidden}
#wrap{position:relative;width:420px;max-width:96vw}
canvas{display:block;width:100%;border-radius:14px;box-shadow:0 0 40px rgba(0,255,128,.35);background:#0a0a1a;touch-action:none}
#bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:rgba(0,0,0,.6);border-radius:14px 14px 0 0;color:#fff;font-size:13px}
#bar img{width:24px;height:24px;border-radius:50%;object-fit:cover}
#bar .sep{opacity:.5;margin:0 2px}
#info{display:flex;justify-content:space-between;padding:6px 14px;color:#0f6;font-size:14px;font-weight:700;background:rgba(0,0,0,.4)}
#overlay{position:absolute;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);border-radius:14px;color:#fff;text-align:center;padding:20px}
#overlay h1{font-size:26px;margin-bottom:6px}
#overlay p{font-size:13px;opacity:.8;max-width:300px;line-height:1.5}
#btn{margin-top:16px;padding:12px 44px;font-size:18px;font-weight:700;border:none;border-radius:999px;cursor:pointer;background:linear-gradient(135deg,#00f5a0,#00d9f5);color:#000;box-shadow:0 6px 24px rgba(0,245,160,.4)}
#btn:active{transform:scale(.95)}
</style>
</head>
<body>
<div id="wrap">
<div id="bar">
  <img src="https://cdn.luogu.com.cn/upload/image_hosting/v70j6st4.png" alt="cxf" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2216%22 fill=%22%236a5acd%22/%3E%3Ctext x=%2216%22 y=%2222%22 text-anchor=%22middle%22 font-size=%2218%22 fill=%22%23fff%22%3Ec%3C/text%3E%3C/svg%3E'">
  <span>作者：cxf54188</span><span class="sep">|</span>
  <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2322c55e' stroke='%2316a34a' stroke-width='2'/%3E%3Cpath d='M20 35 Q32 42 46 33' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='24' r='3.5' fill='%23fff'/%3E%3Ccircle cx='42' cy='24' r='3.5' fill='%23fff'/%3E%3Ccircle cx='22' cy='24' r='1.5' fill='%2316a34a'/%3E%3Ccircle cx='42' cy='24' r='1.5' fill='%2316a34a'/%3E%3C/svg%3E" alt="YB" style="background:#22c55e;">
  <span>辅助：元宝AI</span>
</div>
<canvas id="c" width="420" height="420"></canvas>
<div id="info"><span id="score">得分: 0</span><span id="hi">最高: 0</span></div>
<div id="overlay">
  <h1>🐍 贪吃蛇</h1>
  <p>方向键 / 滑动控制蛇移动<br>吃食物变长，撞墙或撞自己则死<br>每 50 分加速一档</p>
  <button id="btn">开始游戏</button>
</div>
</div>
<script>
(function(){
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const W=420,SZ=20,COLS=W/SZ,ROWS=W/SZ;
const ov=document.getElementById('overlay'),btn=document.getElementById('btn');
const scoreEl=document.getElementById('score'),hiEl=document.getElementById('hi');
let snake,dir,nextDir,food,score,hi,running,timer;
hi=+localStorage.getItem('snake_hi')||0;hiEl.textContent='最高: '+hi;
const hues=[0,45,120,180,280,330];
function randHue(){return hues[Math.floor(Math.random()*hues.length)]}
function placeFood(){
  let c;
  do{c={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)}}
  while(snake.some(s=>s.x===c.x&&s.y===c.y));
  food={...c,hue:randHue()};
}
function reset(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0};nextDir={x:1,y:0};
  score=0;scoreEl.textContent='得分: 0';
  placeFood();
}
function step(){
  dir=nextDir;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.y<0||head.x>=COLS||head.y>=ROWS)return die();
  if(snake.some(s=>s.x===head.x&&s.y===head.y))return die();
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score++;scoreEl.textContent='得分: '+score;
    if(score>hi){hi=score;localStorage.setItem('snake_hi',hi);hiEl.textContent='最高: '+hi}
    placeFood();
  }else snake.pop();
}
function die(){
  running=false;clearInterval(timer);
  ov.style.display='flex';
  ov.innerHTML='<h1>💀 游戏结束</h1><p>得分: '+score+'<br>最高: '+hi+'</p><button id="btn" style="margin-top:16px;padding:12px 44px;font-size:18px;font-weight:700;border:none;border-radius:999px;cursor:pointer;background:linear-gradient(135deg,#00f5a0,#00d9f5);color:#000" onclick="location.reload()">再来一次</button>';
}
function draw(){
  ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,W);
  // grid
  ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;
  for(let i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(i*SZ,0);ctx.lineTo(i*SZ,W);ctx.stroke()}
  for(let i=0;i<=ROWS;i++){ctx.beginPath();ctx.moveTo(0,i*SZ);ctx.lineTo(W,i*SZ);ctx.stroke()}
  // food
  const fg=ctx.createRadialGradient(food.x*SZ+SZ/2,food.y*SZ+SZ/2,2,food.x*SZ+SZ/2,food.y*SZ+SZ/2,SZ/2);
  fg.addColorStop(0,`hsl(${food.hue},100%,70%)`);fg.addColorStop(1,`hsl(${food.hue},100%,40%)`);
  ctx.fillStyle=fg;ctx.beginPath();ctx.arc(food.x*SZ+SZ/2,food.y*SZ+SZ/2,SZ/2-2,0,Math.PI*2);ctx.fill();
  // snake
  snake.forEach((s,i)=>{
    const t=i/snake.length;
    const hue=(120-t*60+360)%360;
    const grd=ctx.createLinearGradient(s.x*SZ,s.y*SZ,s.x*SZ+SZ,s.y*SZ+SZ);
    grd.addColorStop(0,`hsl(${hue},100%,60%)`);grd.addColorStop(1,`hsl(${hue},80%,40%)`);
    ctx.fillStyle=grd;ctx.shadowColor=`hsl(${hue},100%,50%)`;ctx.shadowBlur=8;
    const r=4;ctx.beginPath();ctx.roundRect(s.x*SZ+1,s.y*SZ+1,SZ-2,SZ-2,r);ctx.fill();
  });
  ctx.shadowBlur=0;
  // head eyes
  const h=snake[0],cx=h.x*SZ+SZ/2,cy=h.y*SZ+SZ/2;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx-4,cy-3,2.5,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cx+4,cy-3,2.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(cx-4+dir.x*1.5,cy-3+dir.y*1.5,1.2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cx+4+dir.x*1.5,cy-3+dir.y*1.5,1.2,0,Math.PI*2);ctx.fill();
}
function loop(){if(!running)return;step();draw();requestAnimationFrame(loop)}
function start(){ov.style.display='none';reset();running=true;clearInterval(timer);timer=setInterval(()=>{step();draw()},160)}
btn.addEventListener('click',start);
// keys
document.addEventListener('keydown',e=>{
  if(!running)return;
  const k=e.key;
  if(k==='ArrowUp'&&dir.y!==1)nextDir={x:0,y:-1};
  else if(k==='ArrowDown'&&dir.y!==-1)nextDir={x:0,y:1};
  else if(k==='ArrowLeft'&&dir.x!==1)nextDir={x:-1,y:0};
  else if(k==='ArrowRight'&&dir.x!==-1)nextDir={x:1,y:0};
  e.preventDefault();
});
// swipe
let tx,ty;cvs.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;e.preventDefault()},{passive:false});
cvs.addEventListener('touchmove',e=>{e.preventDefault()},{passive:false});
cvs.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)){if(dx>0&&dir.x!==-1)nextDir={x:1,y:0};else if(dx<0&&dir.x!==1)nextDir={x:-1,y:0}}
  else{if(dy>0&&dir.y!==-1)nextDir={x:0,y:1};else if(dy<0&&dir.y!==1)nextDir={x:0,y:-1}}
});
// roundRect polyfill
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.quadraticCurveTo(x+w,y,x+w,y+r);this.lineTo(x+w,y+h-r);this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);this.lineTo(x+r,y+h);this.quadraticCurveTo(x,y+h,x,y+h-r);this.lineTo(x,y+r);this.quadraticCurveTo(x,y,x+r,y);this.closePath()}}
draw();
})();
</script>
<!-- 提交分数弹窗 -->
<div class="score-dialog" id="scoreDialog">
  <div class="box">
    <h2>🏆 游戏结束</h2>
    <p id="finalScore" style="color:#fff;font-size:14px"></p>
    <button onclick="loginAndSubmit()" style="background:#24292e;color:#fff;border:1px solid #555">
      🐙 用 GitHub 登录提交
    </button>
    <p class="status" id="submitStatus"></p>
  </div>
</div>

<script>
const GAME_KEY = 'snake';
const CLIENT_ID = 'Ov23liUtg4iRn8uimlnC';

function showScoreDialog(score) {
  window._lastScore = score;
  document.getElementById('finalScore').textContent = '得分: ' + score;
  document.getElementById('scoreDialog').classList.add('show');
}

function loginAndSubmit() {
  localStorage.setItem('pending_game', GAME_KEY);
  localStorage.setItem('pending_score', String(window._lastScore));
  const redirect = encodeURIComponent('https://cxf54188.github.io/blog/games/oauth-callback.html');
  location.href = `https://github.com/login/oauth/authorize?client_id=${CLIENT_ID}&redirect_uri=${redirect}&scope=read:user`;
}
</script>
</body>
</html>
