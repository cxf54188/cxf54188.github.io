<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>贪吃蛇</title>
<link rel="stylesheet" href="_common.css">
<style>
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:8px}
#game{background:#0f172a;border-radius:12px;display:block;max-width:100%}
.hud{display:flex;gap:20px;margin:8px 0;font-size:14px;color:#94a3b8;flex-wrap:wrap;justify-content:center}
.hud b{color:#4fc3f7}
.hud .lvl b{color:#a78bfa}
.ctrl{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<a class="back-link" href="index.html">← 返回游戏列表</a>
<div id="topbar"></div>
<h1 style="font-size:22px;margin:6px 0;background:linear-gradient(90deg,#34d399,#4fc3f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent">🐍 贪吃蛇大作战</h1>
<div class="hud">
  <span>分数：<b id="sc">0</b></span>
  <span class="lvl">等级：<b id="lv">1</b></span>
  <span>最高分：<b id="hi">0</b></span>
</div>
<canvas id="game" width="400" height="400"></canvas>
<div class="ctrl">
  <button class="btn btn-sm" id="pause">暂停</button>
  <button class="btn btn-sm btn-danger" id="restart">重新开始</button>
div>
<p style="color:#64748b;font-size:12px;margin-top:8px">方向键 / WASD 控制 · 空格暂停 · R 重来 · 手机可滑动</p>

<script src="_common.js"></script>
<script>
const C=document.getElementById('game'),X=C.getContext('2d');
const topbar=document.getElementById('topbar');topbar.innerHTML=makeTopbar();
const W=400,SZ=20,COLS=W/SZ;
let snake,direction,nextDir,food,score,level,high=Store.get('snake_hi',0),running=true,paused=false,speed=150,lastT=0;
let dirQueue=[];

function reset(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  direction={x:1,y:0};nextDir={x:1,y:0};dirQueue=[];
  score=0;level=1;speed=150;running=true;paused=false;
  document.getElementById('pause').textContent='暂停';
  newFood();updateHUD();
}
function newFood(){
  const cells=[];
  for(let i=0;i<COLS;i++)for(let j=0;j<COLS;j++){
    if(!snake.some(s=>s.x===i&&s.y===j))cells.push({x:i,y:j});
  }
  food=cells[Math.floor(Math.random()*cells.length)]||{x:5,y:5};
}
function updateHUD(){
  document.getElementById('sc').textContent=score;
  document.getElementById('lv').textContent=level;
  document.getElementById('hi').textContent=high;
}
function step(){
  // 从队列取出安全的下一个方向
  while(dirQueue.length>0){
    const d=dirQueue.shift();
    if(!(direction.x===-d.x&&direction.y===-d.y)){nextDir=d;break}
  }
  direction=nextDir;
  const head={x:snake[0].x+direction.x,y:snake[0].y+direction.y};
  // 撞墙
  if(head.x<0||head.x>=COLS||head.y<0||head.y>=COLS){die();return}
  // 撞自己
  if(snake.some(s=>s.x===head.x&&s.y===head.y)){die();return}
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score+=10*level;
    const ratio=snake.length/(COLS*COLS);
    if(ratio>0.15){level=Math.min(10,level+1);speed=Math.max(50,150-level*12)}
    newFood();
  }else{snake.pop()}
  if(score>high){high=score;Store.set('snake_hi',high)}
  updateHUD();
}
function die(){
  running=false;
  X.fillStyle='rgba(0,0,0,.7)';X.fillRect(0,0,W,W);
  X.fillStyle='#f43f5e';X.font='bold 36px sans-serif';X.textAlign='center';
  X.fillText('💀 游戏结束',W/2,W/2-10);
  X.fillStyle='#fff';X.font='18px sans-serif';
  X.fillText(`得分 ${score}`,W/2,W/2+20);
}
function draw(){
  X.fillStyle='#0f172a';X.fillRect(0,0,W,W);
  // 网格
  X.strokeStyle='rgba(255,255,255,.03)';X.lineWidth=0.5;
  for(let i=0;i<=COLS;i++){X.beginPath();X.moveTo(i*SZ,0);X.lineTo(i*SZ,W);X.stroke();X.beginPath();X.moveTo(0,i*SZ);X.lineTo(W,i*SZ);X.stroke()}
  // 食物
  const foods=[
    {c:'#f43f5e',e:'🍎'},{c:'#a78bfa',e:'🍇'},{c:'#f97316',e:'🍊'},{c:'#facc15',e:'⭐'}
  ];
  const fc=foods[Math.floor(Math.random()*4)];
  X.fillStyle=fc.c;X.shadowColor=fc.c;X.shadowBlur=12;
  X.beginPath();X.arc(food.x*SZ+SZ/2,food.y*SZ+SZ/2,SZ/2-3,0,Math.PI*2);X.fill();
  X.shadowBlur=0;
  // 蛇
  snake.forEach((s,i)=>{
    const t=i/snake.length;
    X.fillStyle=lerpColor('#34d399','#059669',t);
    X.shadowColor='#34d399';X.shadowBlur=i===0?10:0;
    const pad=i===0?1:2;
    X.fillRect(s.x*SZ+pad,s.y*SZ+pad,SZ-pad*2,SZ-pad*2);
    if(i===0){X.fillStyle='#fff';X.fillRect(s.x*SZ+6,s.y*SZ+5,3,3);X.fillRect(s.x*SZ+13,s.y*SZ+5,3,3)}
  });
  X.shadowBlur=0;
}
function loop(t){
  if(running&&!paused){
    if(t-lastT>speed){lastT=t;step()}
  }
  draw();requestAnimationFrame(loop);
}
function setDir(dx,dy){
  // 防止180度反向：和当前方向不能相反
  if(direction.x===-dx&&direction.y===-dy)return;
  // 防止和队列最后一个方向重复
  const last=dirQueue.length>0?dirQueue[dirQueue.length-1]:nextDir;
  if(last.x===dx&&last.y===dy)return;
  dirQueue.push({x:dx,y:dy});
}
document.addEventListener('keydown',e=>{
  switch(e.key){
    case'ArrowUp':case'w':case'W':setDir(0,-1);break;
    case'ArrowDown':case's':case'S':setDir(0,1);break;
    case'ArrowLeft':case'a':case'A':setDir(-1,0);break;
    case'ArrowRight':case'd':case'D':setDir(1,0);break;
    case' ':e.preventDefault();document.getElementById('pause').click();break;
    case'r':case'R':reset();break;
  }
});
addSwipe(C,{up:()=>setDir(0,-1),down:()=>setDir(0,1),left:()=>setDir(-1,0),right:()=>setDir(1,0)});
document.getElementById('pause').onclick=()=>{
  paused=!paused;document.getElementById('pause').textContent=paused?'继续':'暂停';
};
document.getElementById('restart').onclick=reset;
reset();requestAnimationFrame(loop);
</script>
</body>
</html>
