name: Submit Score

on:
  repository_dispatch:
    types: [submit-score]

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create Leaderboard Issue
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          GAME="${{ github.event.client_payload.game }}"
          USERNAME="${{ github.event.client_payload.username }}"
          SCORE="${{ github.event.client_payload.score }}"

          curl -L -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/${{ github.repository }}/issues \
            -d "{
              \"title\": \"[$GAME] $USERNAME - $SCORE\",
              \"body\": \"游戏: $GAME\n玩家: $USERNAME\n分数: $SCORE\",
              \"labels\": [\"leaderboard\", \"game-$GAME\"]
            }"