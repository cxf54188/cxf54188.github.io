<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cxf54188.github.io</title>
    <meta name="description" content="cxf54188 鐨勪釜浜虹綉绔?- 绉戞妧鏀瑰彉鏈潵">
    <link rel="icon" type="image/svg+xml" href="img/yb_avatar.svg">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        :root {
            --cyan: #00f0ff;
            --cyan-dim: rgba(0, 240, 255, 0.6);
            --magenta: #ff006e;
            --purple: #7b2ff7;
            --dark: #0a0a1a;
            --darker: #050510;
            --text: #e0e0ff;
            --text-dim: rgba(200, 200, 255, 0.6);
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "JetBrains Mono", "Fira Code", "Consolas",
                         "PingFang SC", "Microsoft YaHei", monospace;
            background: var(--darker);
            overflow: hidden;
            position: relative;
            color: var(--text);
        }

        /* ========== 鐭╅樀闆?========== */
        #matrix-canvas {
            position: fixed; top:0; left:0;
            width:100%; height:100%;
            pointer-events:none; z-index:0;
            opacity:0.12;
        }

        /* ========== 缃戞牸鑳屾櫙 ========== */
        .grid-bg {
            position: fixed; top:0; left:0;
            width:100%; height:100%;
            pointer-events:none; z-index:0;
            background:
                linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove {
            0%   { background-position: 0 0, 0 0; }
            100% { background-position: 60px 60px, 60px 60px; }
        }

        /* ========== 鍏夋檿 ========== */
        .glow-orb {
            position: fixed; border-radius:50%;
            filter: blur(80px); pointer-events:none; z-index:0;
        }
        .glow-1 {
            width:400px; height:400px; top:-100px; left:-100px;
            background: radial-gradient(circle, rgba(0,240,255,0.15), transparent 70%);
            animation: orbFloat 8s ease-in-out infinite;
        }
        .glow-2 {
            width:350px; height:350px; bottom:-80px; right:-80px;
            background: radial-gradient(circle, rgba(123,47,247,0.15), transparent 70%);
            animation: orbFloat 10s ease-in-out infinite reverse;
        }
        .glow-3 {
            width:300px; height:300px;
            top:50%; left:50%;
            transform: translate(-50%,-50%);
            background: radial-gradient(circle, rgba(255,0,110,0.08), transparent 70%);
            animation: orbPulse 6s ease-in-out infinite;
        }
        @keyframes orbFloat {
            0%,100% { transform: translate(0,0); }
            50%     { transform: translate(30px,-30px); }
        }
        @keyframes orbPulse {
            0%,100% { opacity:0.5; transform:translate(-50%,-50%) scale(1); }
            50%     { opacity:1;   transform:translate(-50%,-50%) scale(1.2); }
        }

        /* ========== 鎵弿绾?========== */
        .scanline {
            position: fixed; top:0; left:0;
            width:100%; height:100%;
            pointer-events:none; z-index:9999;
            background: repeating-linear-gradient(
                0deg, transparent, transparent 2px,
                rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
        }

        /* ========== 涓诲鍣?========== */
        .container {
            position: relative; z-index:10;
            text-align:center; padding:60px 40px;
            max-width:720px;
        }

        /* ========== 澶村儚 ========== */
        @property --angle {
            syntax:'<angle>'; initial-value:0deg; inherits:false;
        }
        .avatar-wrapper {
            position:relative;
            width:150px; height:150px;
            margin:0 auto 32px;
            opacity:0;
            animation: fadeUp 0.8s ease forwards 0.2s;
        }
        .avatar-wrapper::before,
        .avatar-wrapper::after {
            content:''; position:absolute; inset:-3px;
            border-radius:50%;
            background: conic-gradient(
                from var(--angle),
                var(--cyan), var(--purple), var(--magenta), var(--cyan)
            );
            animation: conicSpin 4s linear infinite;
            z-index:-1;
        }
        .avatar-wrapper::after { filter:blur(12px); opacity:0.6; }
        @keyframes conicSpin { to { --angle: 360deg; } }

        .avatar {
            width:100%; height:100%;
            border-radius:50%; object-fit:cover;
            border:3px solid var(--darker);
            display:block; background:#111;
        }

        .corner-deco {
            position:absolute; width:20px; height:20px;
            border-color:var(--cyan); border-style:solid; border-width:0;
        }
        .corner-deco.tl { top:-8px; left:-8px;  border-top-width:2px; border-left-width:2px; }
        .corner-deco.tr { top:-8px; right:-8px; border-top-width:2px; border-right-width:2px; }
        .corner-deco.bl { bottom:-8px; left:-8px;  border-bottom-width:2px; border-left-width:2px; }
        .corner-deco.br { bottom:-8px; right:-8px; border-bottom-width:2px; border-right-width:2px; }

        /* ========== 缁堢娆㈣繋鏉?========== */
        .terminal-bar {
            display:inline-flex; align-items:center; gap:8px;
            background:rgba(0,240,255,0.06);
            border:1px solid rgba(0,240,255,0.2);
            border-radius:6px; padding:6px 16px;
            margin-bottom:20px; opacity:0;
            animation: fadeUp 0.8s ease forwards 0.4s;
        }
        .terminal-dot {
            width:8px; height:8px; border-radius:50%;
            background:var(--cyan); box-shadow:0 0 6px var(--cyan);
            animation: dotPulse 2s ease-in-out infinite;
        }
        @keyframes dotPulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .terminal-bar span { font-size:0.85rem; color:var(--cyan-dim); letter-spacing:2px; }

        /* ========== 鏍囬 ========== */
        h1.title {
            font-size:clamp(1.5rem, 3.5vw, 2.2rem);
            font-weight:600; margin-bottom:8px;
            opacity:0; animation: fadeUp 0.8s ease forwards 0.5s;
            line-height:1.6; color:#fff; letter-spacing:1px;
        }
        h1.title .cursor {
            display:inline-block; width:3px; height:1em;
            background:var(--cyan); vertical-align:middle;
            margin-left:4px; animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity:0; } }

        /* ========== 鎵撳瓧鏈哄壇鏍囬 ========== */
        .subtitle {
            font-size:1rem; color:var(--text-dim);
            margin-bottom:40px; min-height:1.6em;
            opacity:0; animation: fadeUp 0.8s ease forwards 0.7s;
            letter-spacing:1px;
        }
        .subtitle .caret {
            display:inline-block; width:2px; height:1.1em;
            background:var(--cyan); vertical-align:middle;
            margin-left:3px; animation: blink 1s step-end infinite;
        }

        /* ========== 鎶€鑳芥爣绛?========== */
        .tech-tags {
            display:flex; gap:10px; justify-content:center;
            flex-wrap:wrap; margin-bottom:36px;
            opacity:0; animation: fadeUp 0.8s ease forwards 0.8s;
        }
        .tech-tag {
            padding:5px 14px; border-radius:4px;
            font-size:0.8rem; letter-spacing:1px;
            border:1px solid rgba(0,240,255,0.2);
            background:rgba(0,240,255,0.04);
            color:var(--cyan-dim);
            transition: all 0.3s ease;
        }
        .tech-tag:hover {
            border-color:var(--cyan); color:var(--cyan);
            box-shadow:0 0 12px rgba(0,240,255,0.2);
            transform:translateY(-2px);
        }

        /* ========== 鎸夐挳 ========== */
        .links {
            display:flex; gap:16px; justify-content:center;
            flex-wrap:wrap;
            opacity:0; animation: fadeUp 0.8s ease forwards 0.9s;
        }
        .btn {
            position:relative; display:inline-flex;
            align-items:center; gap:8px;
            padding:13px 30px; border-radius:4px;
            font-size:0.92rem; font-weight:500;
            text-decoration:none; color:var(--text);
            border:1px solid rgba(0,240,255,0.25);
            background:rgba(0,240,255,0.03);
            transition: all 0.3s ease;
            overflow:hidden; letter-spacing:1px;
        }
        .btn::before {
            content:''; position:absolute; top:0; left:-100%;
            width:100%; height:100%;
            background:linear-gradient(90deg, transparent, rgba(0,240,255,0.1), transparent);
            transition: left 0.5s ease;
        }
        .btn:hover::before { left:100%; }
        .btn:hover {
            transform:translateY(-3px);
            border-color:var(--cyan); color:var(--cyan);
            box-shadow:0 0 20px rgba(0,240,255,0.15), inset 0 0 20px rgba(0,240,255,0.05);
        }
        .btn.primary {
            background:rgba(0,240,255,0.08);
            border-color:var(--cyan); color:var(--cyan);
        }
        .btn.primary:hover {
            background:rgba(0,240,255,0.15);
            box-shadow:0 0 30px rgba(0,240,255,0.3);
        }

        /* ========== 搴曢儴鐘舵€佹爮 ========== */
        .status-bar {
            margin-top:50px; display:flex;
            align-items:center; justify-content:center; gap:16px;
            opacity:0; animation: fadeUp 0.8s ease forwards 1.1s;
        }
        .status-item {
            display:flex; align-items:center; gap:6px;
            font-size:0.78rem; color:var(--text-dim); letter-spacing:1px;
        }
        .status-dot {
            width:6px; height:6px; border-radius:50%;
            background:#00ff88; box-shadow:0 0 6px #00ff88;
            animation: dotPulse 2s ease-in-out infinite;
        }
        .status-divider { width:1px; height:14px; background:rgba(255,255,255,0.1); }

        /* ========== 閫氱敤鍔ㄧ敾 ========== */
        @keyframes fadeUp {
            from { opacity:0; transform:translateY(24px); }
            to   { opacity:1; transform:translateY(0); }
        }

        /* ========== 鍝嶅簲寮?========== */
        @media (max-width:480px) {
            .container { padding:40px 20px; }
            .links { flex-direction:column; align-items:center; }
            .btn { width:220px; justify-content:center; }
            .status-bar { flex-wrap:wrap; gap:10px; }
            .avatar-wrapper { width:120px; height:120px; }
        }
    </style>
</head>
<body>

<!-- 鑳屾櫙灞?-->
<div class="grid-bg"></div>
<canvas id="matrix-canvas"></canvas>
<div class="glow-orb glow-1"></div>
<div class="glow-orb glow-2"></div>
<div class="glow-orb glow-3"></div>
<div class="scanline"></div>

<!-- 涓诲唴瀹?-->
<div class="container">

    <!-- 澶村儚 -->
    <div class="avatar-wrapper">
        <span class="corner-deco tl"></span>
        <span class="corner-deco tr"></span>
        <span class="corner-deco bl"></span>
        <span class="corner-deco br"></span>
        <img class="avatar" src="img/avatar.png" alt="avatar">
    </div>

    <!-- 缁堢椋庢牸娆㈣繋鏉?-->
    <div class="terminal-bar">
        <span class="terminal-dot"></span>
        <span>绯荤粺灏辩华</span>
    </div>

    <!-- 鏍囬 -->
    <h1 class="title">
        娆㈣繋璁块棶 cxf54188.github.io<span class="cursor"></span>
    </h1>

    <!-- 鎵撳瓧鏈哄壇鏍囬 -->
    <p class="subtitle" id="typewriter"></p>

    <!-- 鎶€鑳芥爣绛?-->
    <div class="tech-tags">
        <span class="tech-tag">&lt;/&gt; 鍓嶇寮€鍙?/span>
        <span class="tech-tag">{ } 缂栫▼浠ｇ爜</span>
        <span class="tech-tag">鈿?鎶€鏈帰绱?/span>
        <span class="tech-tag">馃殌 鏈潵鍙湡</span>
    </div>

    <!-- 鎸夐挳 -->
    <div class="links">
        <a class="btn primary" href="blog/">
            <span>馃摑</span> Blog
        </a>
        <a class="btn" href="links/">
            <span>馃敆</span> 鍙嬫儏閾炬帴
        </a>
    </div>

    <!-- 搴曢儴鐘舵€佹爮 -->
    <div class="status-bar">
        <div class="status-item">
            <span class="status-dot"></span>
            <span id="clock"></span>
        </div>
        <div class="status-divider"></div>
        <div class="status-item">
            <span style="color:var(--cyan)">鈼?/span>
            <span>鍦ㄧ嚎</span>
        </div>
        <div class="status-divider"></div>
        <div class="status-item">
            <span style="color:var(--purple)">鈿?/span>
            <span>鐢?GITHUB PAGES 椹卞姩</span>
        </div>
    </div>

</div>

<script>
    /* ========== 鐭╅樀闆?========== */
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
    resizeCanvas(); window.addEventListener('resize', resizeCanvas);

    const chars = '01ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz闆朵竴浜屼笁鍥涗簲鍏竷鍏節鍗佺櫨鍗冧竾浜跨鎶€鏈潵缃戠粶鏁版嵁浠ｇ爜缂栫▼鏅鸿兘浜戠璁＄畻瀹夊叏榛戝绯荤粺鏋舵瀯鍖哄潡閾句汉宸ユ櫤鑳芥満鍣ㄥ涔犳繁搴﹀涔?;
    const fontSize = 14;
    let columns = Math.floor(canvas.width / fontSize);
    let drops = Array(columns).fill(0).map(() => Math.random() * -100);

    function drawMatrix() {
        ctx.fillStyle = 'rgba(5, 5, 16, 0.08)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = fontSize + 'px monospace';
        for (let i = 0; i < drops.length; i++) {
            const text = chars[Math.floor(Math.random() * chars.length)];
            const x = i * fontSize;
            const y = drops[i] * fontSize;
            const alpha = Math.min(1, drops[i] / 10);
            ctx.fillStyle = `rgba(0, 240, 255, ${alpha * 0.8})`;
            ctx.fillText(text, x, y);
            if (y > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(drawMatrix, 50);
    window.addEventListener('resize', () => {
        columns = Math.floor(canvas.width / fontSize);
        drops = Array(columns).fill(0).map(() => Math.random() * -100);
    });

    /* ========== 鎵撳瓧鏈?========== */
    const lines = [
        "姝ｅ湪鍒濆鍖栫郴缁?.. 瀹屾垚 鉁?,
        "姝ｅ湪鍔犺浇鐢ㄦ埛璧勬枡... cxf54188",
        "杩欓噷鏄垜鐨勪釜浜虹┖闂达紝娆㈣繋鎺㈢储 馃殌",
        "鐑埍缂栫▼锛岀儹鐖辩敓娲伙紝鎸佺画瀛︿範 馃捇"
    ];
    let lineIdx = 0, charIdx = 0;
    const target = document.getElementById("typewriter");
    function type() {
        if (lineIdx >= lines.length) { setTimeout(()=>{lineIdx=0;charIdx=0;type();},3000); return; }
        const cur = lines[lineIdx];
        target.innerHTML = cur.slice(0, charIdx+1) + '<span class="caret"></span>';
        charIdx++;
        if (charIdx < cur.length) setTimeout(type, 35);
        else setTimeout(()=>{lineIdx++;charIdx=0;type();},1600);
    }
    setTimeout(type, 1000);

    /* ========== 鏃堕挓 ========== */
    const clock = document.getElementById("clock");
    function tick() {
        clock.textContent = "鈴?" + new Date().toLocaleString("zh-CN", {
            year:"numeric", month:"2-digit", day:"2-digit",
            hour:"2-digit", minute:"2-digit", second:"2-digit"
        });
    }
    tick(); setInterval(tick, 1000);
</script>

</body>
</html>
