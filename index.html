<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎来到cxf54188.gthub.io</title>
    <style>
        /* ========== 基础重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            overflow: hidden;
            position: relative;
        }

        /* ========== 粒子背景 ========== */
        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px; height: 4px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: float linear infinite;
        }

        @keyframes float {
            0%   { transform: translateY(100vh) scale(0); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* ========== 主容器 ========== */
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 60px 40px;
            max-width: 680px;
        }

        /* ========== 头像圆环 ========== */
        .avatar-ring {
            width: 120px; height: 120px;
            margin: 0 auto 30px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #f093fb, #f5576c, #fda085);
            animation: ringSpin 6s linear infinite;
        }

        .avatar-ring .avatar {
            width: 100%; height: 100%;
            border-radius: 50%;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            animation: ringSpin 6s linear infinite reverse;
        }

        @keyframes ringSpin {
            to { transform: rotate(360deg); }
        }

        /* ========== 标题 ========== */
        .greeting {
            font-size: 16px;
            color: rgba(255,255,255,0.5);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 12px;
            opacity: 0;
            animation: fadeUp 0.8s ease forwards 0.3s;
        }

        h1.title {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 800;
            color: #fff;
            margin-bottom: 16px;
            opacity: 0;
            animation: fadeUp 0.8s ease forwards 0.5s;
        }

        h1.title .highlight {
            background: linear-gradient(135deg, #f093fb, #f5576c, #fda085);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ========== 打字机副标题 ========== */
        .subtitle {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 36px;
            min-height: 1.6em;
            opacity: 0;
            animation: fadeUp 0.8s ease forwards 0.7s;
        }

        .subtitle .caret {
            display: inline-block;
            width: 2px; height: 1.1em;
            background: #f5576c;
            vertical-align: middle;
            margin-left: 3px;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* ========== 社交按钮 ========== */
        .links {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            opacity: 0;
            animation: fadeUp 0.8s ease forwards 0.9s;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
            border-color: rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.12);
            box-shadow: 0 8px 30px rgba(245, 87, 108, 0.25);
        }

        .btn.primary {
            background: linear-gradient(135deg, #f5576c, #f093fb);
            border-color: transparent;
        }

        .btn.primary:hover {
            box-shadow: 0 8px 30px rgba(245, 87, 108, 0.4);
        }

        /* ========== 底部时间 ========== */
        .footer-time {
            margin-top: 48px;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.3);
            letter-spacing: 2px;
            opacity: 0;
            animation: fadeUp 0.8s ease forwards 1.1s;
        }

        /* ========== 通用动画 ========== */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ========== 响应式 ========== */
        @media (max-width: 480px) {
            .container { padding: 40px 20px; }
            .links { flex-direction: column; align-items: center; }
            .btn { width: 200px; justify-content: center; }
        }
    </style>
</head>
<body>

<!-- 粒子背景 -->
<div class="particles" id="particles"></div>

<!-- 主内容 -->
<div class="container">
    <!-- 头像 -->
    <div class="avatar-ring">
        <div class="avatar">"https://cdn.luogu.com.cn/upload/image_hosting/v70j6st4.png"width:100%;border-radius:50%</div>
    </div>

    <!-- 问候 -->
    <p class="greeting">Welcome</p>

    <!-- 标题 -->
    <h1 class="title">你好，我是<span class="highlight">cxf54188</span></h1>

    <!-- 打字机副标题 -->
    <p class="subtitle" id="typewriter"></p>

    <!-- 按钮 -->
    <div class="links">
        <a class="btn primary" href="#">🚀 进入博客</a>
        <a class="btn" href="#">💼 关于我</a>
        <a class="btn" href="#">📮 联系我</a>
    </div>

    <!-- 底部时间 -->
    <p class="footer-time" id="clock"></p>
</div>

<script>
    /* ========== 打字机效果 ========== */
    const lines = [
        "这里是我用 GitHub Pages 搭建的个人网站 ✨",
        "热爱编程 · 热爱生活 · 持续学习"
    ];
    let lineIdx = 0, charIdx = 0;
    const target = document.getElementById("typewriter");

    function type() {
        if (lineIdx >= lines.length) return;
        const cur = lines[lineIdx];
        target.innerHTML = cur.slice(0, charIdx + 1) + '<span class="caret"></span>';
        charIdx++;
        if (charIdx < cur.length) {
            setTimeout(type, 55);
        } else {
            setTimeout(() => { lineIdx++; charIdx = 0; type(); }, 1800);
        }
    }
    setTimeout(type, 1200);

    /* ========== 实时时钟 ========== */
    const clock = document.getElementById("clock");
    function tick() {
        const now = new Date();
        const opts = { year:"numeric", month:"2-digit", day:"2-digit",
                       hour:"2-digit", minute:"2-digit", second:"2-digit" };
        clock.textContent = now.toLocaleString("zh-CN", opts) + " · 欢迎来访 🎉";
    }
    tick(); setInterval(tick, 1000);

    /* ========== 生成粒子 ========== */
    const box = document.getElementById("particles");
    const COUNT = 40;
    for (let i = 0; i < COUNT; i++) {
        const p = document.createElement("span");
        p.className = "particle";
        const size = Math.random() * 3 + 2;
        p.style.cssText = `
            left:${Math.random()*100}%;
            width:${size}px; height:${size}px;
            animation-duration:${Math.random()*8+6}s;
            animation-delay:${Math.random()*10}s;
            opacity:${Math.random()*0.5+0.2};
        `;
        box.appendChild(p);
    }
</script>

</body>
</html>
