<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cxf54188.github.io</title>
<meta name="description" content="cxf54188 的个人网站 - 科技改变未来">
<link rel="icon" type="image/svg+xml" href="img/yb_avatar.svg">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
    --cyan: #00f0ff;
    --cyan-dim: rgba(0, 240, 255, 0.6);
    --magenta: #ff006e;
    --purple: #7b2ff7;
    --dark: #0a0a1a;
    --darker: #050510;
    --text: #e0e0ff;
    --text-dim: rgba(200, 200, 255, 0.6);
}

body {
    min-height: 100vh;
    font-family: "JetBrains Mono", "Fira Code", "Consolas", "PingFang SC", "Microsoft YaHei", monospace;
    background: var(--darker);
    color: var(--text);
    overflow-x: hidden;
    position: relative;
}

.grid-bg {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
    background:
        linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: gridMove 20s linear infinite;
}
@keyframes gridMove {
    0% { background-position: 0 0, 0 0; }
    100% { background-position: 60px 60px, 60px 60px; }
}

.scanline {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 9999;
    background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px
    );
}

.glow-orb {
    position: fixed; border-radius: 50%;
    filter: blur(80px); pointer-events: none; z-index: 0;
}
.glow-1 {
    width: 400px; height: 400px; top: -100px; left: -100px;
    background: radial-gradient(circle, rgba(0,240,255,0.1), transparent 70%);
    animation: orbFloat 8s ease-in-out infinite;
}
.glow-2 {
    width: 350px; height: 350px; bottom: -80px; right: -80px;
    background: radial-gradient(circle, rgba(123,47,247,0.1), transparent 70%);
    animation: orbFloat 10s ease-in-out infinite reverse;
}
@keyframes orbFloat {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(30px, -30px); }
}

.navbar {
    position: relative; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 40px;
    border-bottom: 1px solid rgba(0, 240, 255, 0.08);
    backdrop-filter: blur(10px);
    background: rgba(5, 5, 16, 0.6);
}
.nav-brand {
    display: flex; align-items: center; gap: 10px;
    font-size: 1rem; color: var(--cyan);
    text-decoration: none; letter-spacing: 1px;
}
.nav-brand .avatar-mini {
    width: 32px; height: 32px;
    border-radius: 50%; border: 2px solid var(--cyan);
    object-fit: cover;
}
.nav-links { display: flex; gap: 8px; }
.nav-links a {
    padding: 8px 18px; border-radius: 4px;
    font-size: 0.85rem; color: var(--text-dim);
    text-decoration: none; border: 1px solid transparent;
    transition: all 0.3s ease; letter-spacing: 1px;
}
.nav-links a:hover,
.nav-links a.active {
    color: var(--cyan);
    border-color: rgba(0, 240, 255, 0.3);
    background: rgba(0, 240, 255, 0.05);
}

.hero {
    position: relative; z-index: 10;
    text-align: center; padding: 80px 20px 40px;
}
.hero h1 {
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 700; margin-bottom: 16px; color: #fff;
    text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
}
.hero p {
    color: var(--text-dim); font-size: 1.05rem; letter-spacing: 1px;
    max-width: 600px; margin: 0 auto 30px;
}

.btn-group {
    display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;
}
.btn {
    padding: 12px 28px; border-radius: 6px;
    font-size: 0.9rem; text-decoration: none;
    transition: all 0.3s ease; letter-spacing: 1px;
    border: 1px solid rgba(0, 240, 255, 0.3);
    color: var(--cyan); background: rgba(0, 240, 255, 0.06);
}
.btn:hover {
    background: rgba(0, 240, 255, 0.15);
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
    transform: translateY(-2px);
}
.btn-primary {
    background: rgba(0, 240, 255, 0.15);
    border-color: rgba(0, 240, 255, 0.5);
    color: #fff;
}

.cards-section {
    position: relative; z-index: 10;
    max-width: 1100px; margin: 0 auto;
    padding: 20px 30px 60px;
}
.cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
}
.card {
    background: rgba(10, 10, 30, 0.5);
    border: 1px solid rgba(0, 240, 255, 0.08);
    border-radius: 10px; padding: 28px 24px;
    backdrop-filter: blur(6px);
    transition: all 0.3s ease;
    text-decoration: none; color: var(--text);
    display: flex; flex-direction: column; gap: 12px;
}
.card:hover {
    transform: translateY(-4px);
    border-color: rgba(0, 240, 255, 0.25);
    box-shadow: 0 8px 30px rgba(0, 240, 255, 0.1);
}
.card-icon { font-size: 2rem; }
.card-title { font-size: 1.1rem; font-weight: 600; color: #fff; }
.card-desc { font-size: 0.85rem; color: var(--text-dim); line-height: 1.6; }

.footer {
    position: relative; z-index: 10;
    text-align: center; padding: 24px;
    border-top: 1px solid rgba(0, 240, 255, 0.06);
    font-size: 0.78rem; color: rgba(200, 200, 255, 0.25);
    letter-spacing: 1px;
}

@media (max-width: 640px) {
    .navbar { padding: 10px 16px; }
    .nav-links a { padding: 6px 12px; font-size: 0.8rem; }
    .hero { padding: 50px 20px 30px; }
    .cards-section { padding: 10px 16px 40px; }
    .cards-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="glow-orb glow-1"></div>
<div class="glow-orb glow-2"></div>
<div class="scanline"></div>

<nav class="navbar">
    <a class="nav-brand" href="./">
        <img class="avatar-mini" src="img/avatar.png" alt="avatar">
        <span>cxf54188@github.io</span>
    </a>
    <div class="nav-links">
        <a href="./" class="active">首页</a>
        <a href="blog/">博客</a>
        <a href="links/">友链</a>
    </div>
</nav>

<div class="hero">
    <h1>🚀 cxf54188</h1>
    <p>个人站点 · 游戏合集 · 技术笔记 · 项目展示</p>
    <div class="btn-group">
        <a class="btn btn-primary" href="blog/">进入博客</a>
        <a class="btn" href="blog/games/">玩小游戏</a>
        <a class="btn" href="links/">友情链接</a>
    </div>
</div>

<div class="cards-section">
    <div class="cards-grid">
        <a class="card" href="blog/">
            <div class="card-icon">📝</div>
            <div class="card-title">博客</div>
            <div class="card-desc">项目展示、更新日志与技术笔记。查看我做过的事情和最新动态。</div>
        </a>
        <a class="card" href="blog/games/">
            <div class="card-icon">🎮</div>
            <div class="card-title">游戏合集</div>
            <div class="card-desc">8 款纯前端小游戏，即点即玩。2048、贪吃蛇、俄罗斯方块、扫雷等。</div>
        </a>
        <a class="card" href="links/">
            <div class="card-icon">🔗</div>
            <div class="card-title">友情链接</div>
            <div class="card-desc">伙伴站点与推荐资源。洛谷、AtCoder、Codeforces、Virtual Judge 等。</div>
        </a>
    </div>
</div>

<div class="footer">
    © <span id="year"></span> cxf54188 &nbsp;|&nbsp; Powered by GitHub Pages &nbsp;|&nbsp; <span id="clock"></span>
</div>

<script>
    const clock = document.getElementById("clock");
    function tick() {
        clock.textContent = new Date().toLocaleString("zh-CN", {
            year: "numeric", month: "2-digit", day: "2-digit",
            hour: "2-digit", minute: "2-digit", second: "2-digit"
        });
    }
    tick(); setInterval(tick, 1000);
    document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
