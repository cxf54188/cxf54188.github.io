<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>传图给 CXF</title>
<style>
  :root{--bg:#0f1117;--card:#171a24;--line:#2a2f3d;--txt:#eef0f6;--sub:#9aa1b1;--acc:#7c9cff;--ok:#4ade80;--bad:#f87171}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","WenQuanYi Micro Hei",sans-serif;
    background:radial-gradient(1000px 500px at 80% -20%,#1d2740 0,transparent 60%),var(--bg);
    color:var(--txt);min-height:100vh;display:grid;place-items:center;padding:24px}
  .box{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:26px 22px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
  .logo{width:48px;height:48px;border-radius:15px;margin-bottom:14px;
    background:linear-gradient(135deg,#7c9cff,#b48cff);display:grid;place-items:center;font-size:26px}
  h1{font-size:19px;margin-bottom:6px}
  .sub{font-size:13px;color:var(--sub);margin-bottom:20px;line-height:1.6}
  .drop{border:2px dashed var(--line);border-radius:16px;padding:34px 16px;text-align:center;cursor:pointer;
    transition:.18s;background:rgba(255,255,255,.015)}
  .drop.hover{border-color:var(--acc);background:rgba(124,156,255,.08)}
  .drop .big{font-size:38px;line-height:1;margin-bottom:10px}
  .drop p{font-size:14px;color:var(--sub)}
  .drop p b{color:var(--txt)}
  .drop .hint{font-size:12px;margin-top:6px;opacity:.8}
  input[type=file]{display:none}
  .list{margin-top:16px;display:flex;flex-direction:column;gap:7px}
  .item{display:flex;align-items:center;gap:10px;padding:9px 11px;background:rgba(255,255,255,.03);
    border:1px solid var(--line);border-radius:11px;font-size:13px}
  .item .ok{color:var(--ok);flex:0 0 auto}
  .item .no{color:var(--bad);flex:0 0 auto}
  .item .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .s{color:var(--sub);font-size:11.5px;flex:0 0 auto}
  .bar{height:7px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden;margin-top:16px;display:none}
  .bar.show{display:block}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c9cff,#b48cff);transition:width .2s;border-radius:999px}
  .status{font-size:12.5px;color:var(--sub);margin-top:8px;min-height:1.4em}
  .foot{margin-top:18px;font-size:12px;color:var(--sub);line-height:1.7;
    background:rgba(251,191,36,.05);border:1px solid rgba(251,191,36,.2);border-radius:14px;padding:12px 14px}
  .foot code{background:rgba(255,255,255,.06);padding:1px 5px;border-radius:5px;color:#eef0f6;font-size:11.5px}
</style>
</head>
<body>
<div class="box">
  <div class="logo">🖼️</div>
  <h1>传图给 CXF</h1>
  <p class="sub">把图片拖到这里，或点一下选文件，可以多选、一张张加。</p>
  <div class="drop" id="drop">
    <div class="big">📂</div>
    <p><b>拖图片到这里</b>，或点击选择</p>
    <p class="hint">JPG / PNG / GIF / WebP · 单张 ≤ 20MB</p>
    <input type="file" id="file" accept="image/*" multiple>
  </div>
  <div class="list" id="list"></div>
  <div class="bar" id="bar"><i id="barIn"></i></div>
  <div class="status" id="status"></div>
  <div class="foot">
    💡 图床用的 SM.MS，匿名有每日额度。<br>
    传完把链接发给我，或截图告诉我「传完了」。
  </div>
</div>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var CFG = { url:'https://sm.ms/api/v2/upload', field:'smfile', max:20*1024*1024 };
  var list = [];

  function add(files){
    var arr = Array.prototype.slice.call(files), bad = [], big = [];
    arr.forEach(function(f){
      if(!f.type.match(/^image\//)){ bad.push(f.name); return; }
      if(f.size > CFG.max){ big.push(f.name); return; }
      list.push({ id:'i'+Date.now()+Math.random(), file:f, state:'pending' });
    });
    if(bad.length) status('跳过非图片：'+bad.join('、'));
    if(big.length) status('太大已忽略：'+big.join('、'));
    render(); next();
  }

  function render(){
    if(!list.length){ $('list').innerHTML = ''; return; }
    $('list').innerHTML = list.map(function(it){
      var icon = it.state==='ok' ? '<span class="ok">✓</span>'
               : it.state==='err' ? '<span class="no">✕</span>' : '<span class="no" style="opacity:.35">○</span>';
      var sub = it.state==='ok' ? '<span class="s">已上传</span>'
              : it.state==='err' ? '<span class="s" style="color:#f87171">失败</span>'
              : '<span class="s">等待</span>';
      return '<div class="item">'+icon+'<span class="n">'+esc(it.file.name)+'</span>'+sub+'</div>';
    }).join('');
  }

  function status(t){ $('status').textContent = t || ''; }

  function setBar(pct, label){
    $('bar').classList.add('show');
    $('barIn').style.width = Math.max(0,Math.min(100,pct))+'%';
    status(label);
  }

  var busy = false;
  function next(){
    if(busy) return;
    var cur = list.filter(function(x){ return x.state==='pending'; })[0];
    if(!cur){ busy = false; return; }
    busy = true; cur.state = 'up';
    var fd = new FormData();
    fd.append(CFG.field, cur.file, cur.file.name);
    fd.append('format','json');
    var xhr = new XMLHttpRequest();
    xhr.open('POST', CFG.url);
    xhr.upload.onprogress = function(e){
      if(e.lengthComputable){
        var base = list.filter(function(x){return x.state!=='pending';}).length;
        setBar((base + e.loaded/e.total)*100/list.length*100, '上传中 '+cur.file.name);
      }
    };
    xhr.onload = function(){
      var ok = false, msg = '';
      try{
        var j = JSON.parse(xhr.responseText);
        if((xhr.status>=200&&xhr.status<300) && j.data && (j.data.url||j.data.image)){ ok = true; msg = j.data.url || j.data.image; }
        else msg = (j.message||'图床返回异常').slice(0,80);
      }catch(e){ msg = '返回解析失败'; }
      cur.state = ok ? 'ok' : 'err';
      cur.url = ok ? msg : '';
      if(ok) console.log('[上传成功]', cur.file.name, msg);
      render(); busy = false;
      var done = list.filter(function(x){return x.state==='ok';}).length;
      var fail = list.filter(function(x){return x.state==='err';}).length;
      setBar(done/list.length*100, '已完成 '+done+' / '+list.length + (fail?'（失败 '+fail+'）':''));
      if(done===list.length) $('bar').classList.remove('show');
      next();
    };
    xhr.onerror = function(){ cur.state='err'; render(); busy=false; status('网络错误，可能跨域或服务挂了'); next(); };
    xhr.timeout = 120000;
    xhr.ontimeout = function(){ cur.state='err'; render(); busy=false; status('超时，文件可能太大'); next(); };
    xhr.send(fd);
  }

  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function status(t){ $('status').textContent = t || ''; }

  $('drop').onclick = function(){ $('file').click(); };
  $('file').onchange = function(e){ add(e.target.files); this.value=''; };
  ['dragenter','dragover'].forEach(function(ev){
    $('drop').addEventListener(ev,function(e){ e.preventDefault(); e.stopPropagation(); $('drop').classList.add('hover'); });
  });
  ['dragleave','drop'].forEach(function(ev){
    $('drop').addEventListener(ev,function(e){ e.preventDefault(); e.stopPropagation(); $('drop').classList.remove('hover'); });
  });
  $('drop').addEventListener('drop',function(e){
    if(e.dataTransfer && e.dataTransfer.files) add(e.dataTransfer.files);
  });
  document.addEventListener('paste',function(e){
    if(e.clipboardData && e.clipboardData.files && e.clipboardData.files.length) add(e.clipboardData.files);
  });
  window.addEventListener('dragover',function(e){ e.preventDefault(); });
  window.addEventListener('drop',function(e){ e.preventDefault(); });
})();
</script>
</body>
</html>
